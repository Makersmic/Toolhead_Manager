# ---------------------------------------------------------------------
# Cancel
# ---------------------------------------------------------------------
# CANCEL_PRINT (pause_resume.cfg) calls _RHINO_CANCEL after the heaters and the fan are off, and before Klipper's own
# cancel. PAUSE calls _RHINO_PAUSE_HOOK and RESUME calls _RHINO_RESUME_HOOK (both in tools/tool_power.cfg).

[gcode_macro _RHINO_CANCEL]
description: Rhino part of CANCEL_PRINT (called by CANCEL_PRINT after the heaters and the fan are off).
gcode:
    M117 Canceling print...
    RESPOND TYPE=command MSG="action:notify Print canceled"
    _TOOL_SAFE_OFF ; laser / spindle / custom-tool power was left on by a cancel
    _RHINO_PAUSE_CLEAR ; forget a paused non-print-tool job
    M107 ; Turn off fan
    _RHINO_PARK ; bed down to the safe park height (was a 10 mm lift)
    SET_GCODE_OFFSET X=0 Y=0 Z=0 ; a CNC / knife work zero must not shift the park move or the next job
    {% set p = printer["gcode_macro RHINO_POSITIONS"] %}
    {% set _th = {} %}
    {% set _ = _th.update(printer["gcode_macro VARIABLES"].toolheads) %}
    {% set _ = _th.update(printer["gcode_macro CUSTOM_TOOLS"].toolheads) %}
    {% set _map = {} %}
    {% set _ = _map.update(printer["gcode_macro VARIABLES"].tool_mapping) %}
    {% set _ = _map.update(printer["gcode_macro CUSTOM_TOOLS"].tool_mapping|default({})) %}
    {% set tool = _map.get(printer["gcode_macro SWAP_TOOL"].current_tool|int, "") %}
    {% set is_laser = _th.get(tool, {}).get("type", "")|upper == "LASER" %}
    {% set xy_homed = "x" in printer.toolhead.homed_axes and "y" in printer.toolhead.homed_axes %}
    {% if is_laser %}
      # 1.4.5: no X/Y homing with a laser mounted (homing Y with the LightSaber on crashes it).
      # A laser has no cutting load, so steps are unlikely to be lost; park only if X/Y are homed,
      # because an unhomed move would error and stop CANCEL_PRINT_BASE from finishing.
      {% if xy_homed %}
        G90
        G1 X{p.park_x} Y{p.park_y} F6000 ; park (myrhino/positions.cfg), as END_PRINT does
      {% else %}
        RESPOND MSG="Cancel: {tool} mounted, X/Y not homed - the head stays where it is (no homing with a laser)."
      {% endif %}
    {% else %}
      G28 X Y ; Home X and Y (steps may have been lost)
      G90
      G1 X{p.park_x} Y{p.park_y} F6000 ; then the park position (myrhino/positions.cfg)
    {% endif %}
    SAVE_VARIABLE VARIABLE=pause_state VALUE="'none'"
    M117 Print canceled
    LEDFLASH
    # job hooks / interlocks (docs/proposal-macro-hooks.md): last, so a failing hook can't stop the Rhino's own cancel (tool power is already off)
    _RHINO_HOOKS SLOT=on_cancel
