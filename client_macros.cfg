# NOTE: [pause_resume], [display_status], and [respond] are commented
# out here. printer.cfg's very first line is "[include mainsail.cfg]" -
# the standard mainsail-crew/mainsail-config file (confirmed installed
# via moonraker.conf's [update_manager mainsail-config]) - and that
# file's well-known standard content already declares all three of
# these sections, along with a base PAUSE/RESUME/CANCEL_PRINT. Unlike
# [gcode_macro ...] sections, these do NOT support "rename_existing" -
# Klipper has no override mechanism for them, so a second declaration
# anywhere in the include tree is a hard "section already defined"
# error at startup. This file no longer overrides CANCEL_PRINT (see the
# Mainsail hooks below) - only these three bare sections were the problem.
# If your mainsail.cfg does NOT define these (e.g. a heavily trimmed
# custom version), uncomment them back in.
#[pause_resume]
#[display_status]
#[respond]

# ---------------------------------------------------------------------
# Mainsail hooks
# ---------------------------------------------------------------------
# mainsail.cfg already defines PAUSE, RESUME and CANCEL_PRINT. This file used to define a
# second [gcode_macro CANCEL_PRINT]; Klipper merges same-named sections, so ours silently
# replaced Mainsail's and its clean-up (idle timeout restore, pause-at-layer reset) never ran.
# Mainsail's own way to add behaviour is the _CLIENT_VARIABLE hooks below - mainsail.cfg is
# read-only and is replaced on every Mainsail update, so nothing here edits it.
#   user_pause_macro  - runs after PAUSE_BASE, BEFORE the head parks
#   user_resume_macro - runs BEFORE the head moves back to the job (blocks non-print-tool jobs: they use TOOL_RESUME)
#   user_cancel_macro - runs after heaters off, before CANCEL_PRINT_BASE
# Each hook takes a single command, so each points at one macro.
[gcode_macro _CLIENT_VARIABLE]
variable_user_pause_macro : "_RHINO_PAUSE_HOOK"
variable_user_resume_macro: "_RHINO_RESUME_HOOK"
variable_user_cancel_macro: "_RHINO_CANCEL"
# Park position (Mainsail's pause park and the end of a cancel). Mainsail's default is X/Y maximum minus 5 mm
# (X571, Y401 here), which runs into the frame; this is 20 mm in from that on both axes.
variable_use_custom_pos   : True
variable_custom_park_x    : 551.0
variable_custom_park_y    : 381.0
gcode:

[gcode_macro _RHINO_CANCEL]
description: Rhino part of CANCEL_PRINT (called by Mainsail's CANCEL_PRINT through user_cancel_macro).
gcode:
    M117 Canceling print...
    RESPOND TYPE=command MSG="action:notify Print canceled"
    _TOOL_SAFE_OFF ; laser / spindle / custom-tool power was left on by a cancel
    _RHINO_PAUSE_CLEAR ; forget a paused non-print-tool job
    M107 ; Turn off fan
    _RHINO_PARK ; bed down to the safe park height (was a 10 mm lift)
    SET_GCODE_OFFSET X=0 Y=0 Z=0 ; a CNC / knife work zero must not shift the park move or the next job
    G28 X Y ; Home X and Y (steps may have been lost)
    {% set cv = printer["gcode_macro _CLIENT_VARIABLE"] %}
    G90
    G1 X{cv.custom_park_x} Y{cv.custom_park_y} F6000 ; then the park position
    SAVE_VARIABLE VARIABLE=pause_state VALUE="'none'"
    M117 Print canceled
    LEDFLASH
