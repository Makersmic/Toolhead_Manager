# ====================================================================
# 🪚 STAGE 1: HARDWARE GATING & SETUP INITIALIZATION
# ====================================================================

[gcode_macro DRAGKNIFE_JOB_SETUP]
description: Guided setup for a drag-knife job - material verification, manual dial adjustment, Z zeroing, test cuts.
gcode:
  # 🔒 State Verification Lockout Check
  {% if printer.print_stats.state in ["printing", "paused"] %}
    { action_raise_error("DRAGKNIFE_JOB_SETUP cannot execute while an active cut job is running or paused!") }
  {% endif %}

  # 🔍 DISPATCH SOURCE OF TRUTH CHECK: Verify physical tool status
  {% set physical_slot = printer["gcode_macro SWAP_TOOL"].current_tool|int %}
  {% set tool_mapping = printer["gcode_macro VARIABLES"].tool_mapping %}
  {% set physical_name = tool_mapping.get(physical_slot, "Unknown") %}

  {% if physical_name != "DragKnife" %}
    { action_raise_error("Setup Blocked: Run the SWAP_TOOL wizard to mount your DragKnife before setting up this job.") }
  {% endif %}

  # Map file target pointer payload
  SET_GCODE_VARIABLE MACRO=_START_JOB_FILE VARIABLE=file VALUE="'{params.FILE|default("")}'"
  
  # Fetch globally stored tool parameters from your variables cache
  {% set MATERIAL = printer.save_variables.variables.set_material_material|default("VINYL") %}
  {% set pressure = printer.save_variables.variables.set_material_blade_pressure|default(150) %}
  {% set feed_rate = printer.save_variables.variables.set_material_feed_rate|default(800) %}

  RESPOND TYPE=command MSG="action:prompt_begin Drag knife setup"
  RESPOND TYPE=command MSG="action:prompt_text Toolhead: {physical_name} / Material: {MATERIAL}"
  RESPOND TYPE=command MSG="action:prompt_text Blade pressure: {pressure} g / Feed: {feed_rate} mm/min"
  RESPOND TYPE=command MSG="action:prompt_text Check before you start:"
  RESPOND TYPE=command MSG="action:prompt_text - Material is taped down flat, with no wrinkles"
  RESPOND TYPE=command MSG="action:prompt_text - A cutting mat is underneath, if the material needs one"
  RESPOND TYPE=command MSG="action:prompt_text - Blade is extended and the pressure dial is set to {pressure} g"
  
  RESPOND TYPE=command MSG="action:prompt_button All checked - set Z zero|_DK_ZERO_Z|primary"
  RESPOND TYPE=command MSG="action:prompt_button Cancel setup|_CLOSE_PROMPT|error"
  RESPOND TYPE=command MSG="action:prompt_show"


# ====================================================================
# 🧭 STAGE 2: WORK COORDINATE SYSTEM ZEROING (Z-ZERO VIA G54)
# ====================================================================

[gcode_macro _DK_ZERO_Z]
description: Set the blade's Z zero on the material surface by eye (SET_Z_ZERO), then the test cut.
gcode:
  RESPOND TYPE=command MSG="action:prompt_end"
  SET_Z_ZERO NEXT=_DK_SAVE_Z

[gcode_macro _DK_SAVE_Z]
description: After SET_Z_ZERO - X/Y work zero is the machine origin for the knife; apply G54 and run the test cut.
gcode:
  SAVE_VARIABLE VARIABLE=cnc_g54_x VALUE=0.0
  SAVE_VARIABLE VARIABLE=cnc_g54_y VALUE=0.0
  G54
  M117 G54 Material Surface Set
  _DK_TEST_CUT


# ====================================================================
# 🖋️ STAGE 3: MECHANICAL VALIDATION LOOP (TEST CUTS)
# ====================================================================

[gcode_macro _DK_TEST_CUT]
description: Drops the knife to blade depth, scores a 10mm diagonal validation mark, and lifts clear
gcode:
  RESPOND TYPE=command MSG="action:prompt_end"
  M117 Scoring structural validation mark...

  # Upgraded to absolute, safety-gated depth cuts anchored by your G54 zero plane
  G90
  G1 Z2 F600             # Ensure transit clearance altitude
  G1 X0 Y0 F3000         # Center tool over the local origin
  G1 Z-0.3 F200          # Absolute safe blade plunge depth (exactly 0.3mm below stock face)
  
  # Execute short 10mm diagonal vector score line
  {% set feed = printer.save_variables.variables.set_material_feed_rate|default(800)|float %}
  G1 X10 Y10 F{feed}
  
  # Safe mechanical clearance lift
  G1 Z10 F600
  M117 Scoring complete

  # Prompt evaluation window panel
  RESPOND TYPE=command MSG="action:prompt_begin Check the test cut"
  RESPOND TYPE=command MSG="action:prompt_text Look at the 10 mm test line:"
  RESPOND TYPE=command MSG="action:prompt_text - Did the blade cut cleanly through the material, without skipping or tearing?"
  RESPOND TYPE=command MSG="action:prompt_text - Is the backing sheet underneath still uncut?"
  
  RESPOND TYPE=command MSG="action:prompt_button Cut looks good - continue|_DK_READY|success"
  RESPOND TYPE=command MSG="action:prompt_button Cut is wrong - help me adjust|_DK_ADJUST|warning"
  RESPOND TYPE=command MSG="action:prompt_button Cancel setup|_DK_ABORT|error"
  RESPOND TYPE=command MSG="action:prompt_show"

[gcode_macro _DK_ADJUST]
description: Diagnostic feedback menu allowing tension recalibration and test re-runs
gcode:
  RESPOND TYPE=command MSG="action:prompt_end"
  
  RESPOND TYPE=command MSG="action:prompt_begin Adjust the blade"
  RESPOND TYPE=command MSG="action:prompt_text Turn the pressure dial on the toolhead by hand:"
  RESPOND TYPE=command MSG="action:prompt_text - Blade skipped or barely scored: more pressure, or set Z zero slightly lower (Bed up 0.1 mm)."
  RESPOND TYPE=command MSG="action:prompt_text - Material tore or the backing was cut: less pressure, or set Z zero slightly higher (Bed down 0.1 mm)."
  RESPOND TYPE=command MSG="action:prompt_text Then set Z zero again and cut a new test line."
  
  # Re-route straight back to Z re-touching or test cut loop execution
  RESPOND TYPE=command MSG="action:prompt_button Set Z zero and test again|_DK_ZERO_Z|primary"
  RESPOND TYPE=command MSG="action:prompt_footer_button Cancel setup|_DK_ABORT|error"
  RESPOND TYPE=command MSG="action:prompt_show"


# ====================================================================
# 🏁 STAGE 4: PRODUCTION READINESS & FILE DEPLOYMENT
# ====================================================================

[gcode_macro _DK_READY]
description: Final validation gate view before committing streaming file commands
gcode:
  RESPOND TYPE=command MSG="action:prompt_end"
  
  RESPOND TYPE=command MSG="action:prompt_begin Ready to cut"
  RESPOND TYPE=command MSG="action:prompt_text The test cut is good. Start the job to cut the full design."
  
  RESPOND TYPE=command MSG="action:prompt_button Start the cut|_DK_START|success"
  RESPOND TYPE=command MSG="action:prompt_button Cancel setup|_DK_ABORT|error"
  RESPOND TYPE=command MSG="action:prompt_show"

[gcode_macro _DK_START]
gcode:
  RESPOND TYPE=command MSG="action:prompt_end"
  M117 Drag knife vector cutting starting...
  _START_JOB_FILE

[gcode_macro _DK_ABORT]
gcode:
  RESPOND TYPE=command MSG="action:prompt_end"
  G91
  G1 Z15 F600            # Safe clear lift of 15mm absolute clear height
  G90
  M117 Drag Knife Wizard Aborted
