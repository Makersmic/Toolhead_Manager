# ====================================================================
# 🪚 STAGE 1: HARDWARE GATING & SETUP INITIALIZATION
# ====================================================================

[gcode_macro DRAGKNIFE_JOB_SETUP]
description: Guided setup for a drag-knife job - material verification, manual dial adjustment, Z zeroing, test cuts.
gcode:
  # 🔒 State Verification Lockout Check
  {% if printer.print_stats.state in ["printing", "paused"] %}
    { action_raise_error("DRAGKNIFE_JOB_SETUP cannot execute while an active cut job is running or paused!") }
  {% endif %}

  # 🔍 DISPATCH SOURCE OF TRUTH CHECK: Verify physical tool status
  {% set physical_slot = printer["gcode_macro SWAP_TOOL"].current_tool|int %}
  {% set tool_mapping = printer["gcode_macro VARIABLES"].tool_mapping %}
  {% set physical_name = tool_mapping.get(physical_slot, "Unknown") %}

  {% if physical_name != "DragKnife" %}
    { action_raise_error("Setup Blocked: Run the SWAP_TOOL wizard to mount your DragKnife before setting up this job.") }
  {% endif %}

  # Map file target pointer payload
  SET_GCODE_VARIABLE MACRO=_START_JOB_FILE VARIABLE=file VALUE="'{params.FILE|default("")}'"
  
  # Fetch globally stored tool parameters from your variables cache
  {% set MATERIAL = printer.save_variables.variables.set_material_material|default("VINYL") %}
  {% set pressure = printer.save_variables.variables.set_material_blade_pressure|default(150) %}
  {% set feed_rate = printer.save_variables.variables.set_material_feed_rate|default(800) %}

  RESPOND TYPE=command MSG="action:prompt_begin Drag Knife Job Setup"
  RESPOND TYPE=command MSG="action:prompt_text Active Toolhead: {physical_name} | Material Profile: {MATERIAL}"
  RESPOND TYPE=command MSG="action:prompt_text Target spring-tension pressure: {pressure}g | Feed: {feed_rate} mm/min"
  RESPOND TYPE=command MSG="action:prompt_text --------------------------------------------------"
  RESPOND TYPE=command MSG="action:prompt_text Before proceeding, explicitly verify:"
  RESPOND TYPE=command MSG="action:prompt_text  • Material is taped/secured completely flat with zero wrinkles"
  RESPOND TYPE=command MSG="action:prompt_text  • A protective sacrificial cutting mat is laid underneath if required"
  RESPOND TYPE=command MSG="action:prompt_text  • Blade is extended, and the manual spring-tension dial is dialed to {pressure}g"
  
  RESPOND TYPE=command MSG="action:prompt_button All Verified -> Move to Z Align|_DK_ZERO_Z|primary"
  RESPOND TYPE=command MSG="action:prompt_button Abort Setup Routine|_CLOSE_PROMPT|error"
  RESPOND TYPE=command MSG="action:prompt_show"


# ====================================================================
# 🧭 STAGE 2: WORK COORDINATE SYSTEM ZEROING (Z-ZERO VIA G54)
# ====================================================================

[gcode_macro _DK_ZERO_Z]
description: Guides a manual paper/feel Z touch-off for the blade against the material surface plane
gcode:
  RESPOND TYPE=command MSG="action:prompt_end"
  
  _RHINO_HOME_SAFE ; never homes Z with this tool mounted

  RESPOND TYPE=command MSG="action:prompt_begin Set Z Work Zero"
  RESPOND TYPE=command MSG="action:prompt_text Using your dashboard move panel, jog the toolhead over your raw stock material."
  RESPOND TYPE=command MSG="action:prompt_text Lower the blade down slowly in small increments until the knife tip just kisses the material face."
  RESPOND TYPE=command MSG="action:prompt_text "
  RESPOND TYPE=command MSG="action:prompt_text Click below once the blade tip is calibrated against the material surface:"
  
  RESPOND TYPE=command MSG="action:prompt_button Lock Z Surface and Cut Test Mark|_DK_SAVE_Z|primary"
  RESPOND TYPE=command MSG="action:prompt_button Abort Setup Routine|_DK_ABORT|error"
  RESPOND TYPE=command MSG="action:prompt_show"

[gcode_macro _DK_SAVE_Z]
gcode:
  RESPOND TYPE=command MSG="action:prompt_end"
  
  # Capture user's manual jog position and commit to persistent disk storage
  {% set raw_z = printer.gcode_move.gcode_position.z|float %}
  
  # Cleanly zero out X and Y for G54 space, while locking down your Z work target plane
  SAVE_VARIABLE VARIABLE=cnc_g54_x VALUE=0.0
  SAVE_VARIABLE VARIABLE=cnc_g54_y VALUE=0.0
  SAVE_VARIABLE VARIABLE=cnc_g54_z VALUE={raw_z}
  G54 # Reload active coordinate matrix transform rules
  M117 G54 Material Surface Set

  # Automatically advance forward to execute mechanical validation cut
  _DK_TEST_CUT


# ====================================================================
# 🖋️ STAGE 3: MECHANICAL VALIDATION LOOP (TEST CUTS)
# ====================================================================

[gcode_macro _DK_TEST_CUT]
description: Drops the knife to blade depth, scores a 10mm diagonal validation mark, and lifts clear
gcode:
  RESPOND TYPE=command MSG="action:prompt_end"
  M117 Scoring structural validation mark...

  # Upgraded to absolute, safety-gated depth cuts anchored by your G54 zero plane
  G90
  G1 Z2 F600             # Ensure transit clearance altitude
  G1 X0 Y0 F3000         # Center tool over the local origin
  G1 Z-0.3 F200          # Absolute safe blade plunge depth (exactly 0.3mm below stock face)
  
  # Execute short 10mm diagonal vector score line
  {% set feed = printer.save_variables.variables.set_material_feed_rate|default(800)|float %}
  G1 X10 Y10 F{feed}
  
  # Safe mechanical clearance lift
  G1 Z10 F600
  M117 Scoring complete

  # Prompt evaluation window panel
  RESPOND TYPE=command MSG="action:prompt_begin Check Test Cut Result"
  RESPOND TYPE=command MSG="action:prompt_text Inspect the marked 10mm score line on your stock:"
  RESPOND TYPE=command MSG="action:prompt_text  • Did the knife blade slice cleanly through the vinyl/paper without skipping, bunching, or tearing?"
  RESPOND TYPE=command MSG="action:prompt_text  • Did it leave the underlying backing sheet completely uncut and scored safely?"
  
  RESPOND TYPE=command MSG="action:prompt_button 👍 Looks Perfect - Ready to Cut|_DK_READY|success"
  RESPOND TYPE=command MSG="action:prompt_button 👎 Bad Cut - Readjust Dial Settings|_DK_ADJUST|warning"
  RESPOND TYPE=command MSG="action:prompt_button 🛑 Emergency Abort Setup|_DK_ABORT|error"
  RESPOND TYPE=command MSG="action:prompt_show"

[gcode_macro _DK_ADJUST]
description: Diagnostic feedback menu allowing tension recalibration and test re-runs
gcode:
  RESPOND TYPE=command MSG="action:prompt_end"
  
  RESPOND TYPE=command MSG="action:prompt_begin Manual Blade Calibration Help"
  RESPOND TYPE=command MSG="action:prompt_text Reach into the toolhead and turn the physical spring-tension barrel by hand:"
  RESPOND TYPE=command MSG="action:prompt_text  • Blade skipped or didn't score: Increase dial pressure or lower Z offset slightly."
  RESPOND TYPE=command MSG="action:prompt_text  • Material tore / sliced backing: Decrease dial pressure or lift your Z offset slightly."
  RESPOND TYPE=command MSG="action:prompt_text --------------------------------------------------"
  RESPOND TYPE=command MSG="action:prompt_text Once manual dial changes are set, click below to re-verify the alignment:"
  
  # Re-route straight back to Z re-touching or test cut loop execution
  RESPOND TYPE=command MSG="action:prompt_button 🔄 Re-adjust Z Surface and Re-test|_DK_ZERO_Z|primary"
  RESPOND TYPE=command MSG="action:prompt_footer_button Abort Setup Sequence|_DK_ABORT|error"
  RESPOND TYPE=command MSG="action:prompt_show"


# ====================================================================
# 🏁 STAGE 4: PRODUCTION READINESS & FILE DEPLOYMENT
# ====================================================================

[gcode_macro _DK_READY]
description: Final validation gate view before committing streaming file commands
gcode:
  RESPOND TYPE=command MSG="action:prompt_end"
  
  RESPOND TYPE=command MSG="action:prompt_begin Ready to Deploy Cut"
  RESPOND TYPE=command MSG="action:prompt_text Test cut confirmed. Starting execution will run the full design layout vector pass."
  
  RESPOND TYPE=command MSG="action:prompt_button 🚀 DEPLOY ACTIVE CUT PASS|_DK_START|success"
  RESPOND TYPE=command MSG="action:prompt_button Abort Setup Sequence|_DK_ABORT|error"
  RESPOND TYPE=command MSG="action:prompt_show"

[gcode_macro _DK_START]
gcode:
  RESPOND TYPE=command MSG="action:prompt_end"
  M117 Drag knife vector cutting starting...
  _START_JOB_FILE

[gcode_macro _DK_ABORT]
gcode:
  RESPOND TYPE=command MSG="action:prompt_end"
  G91
  G1 Z15 F600            # Safe clear lift of 15mm absolute clear height
  G90
  M117 Drag Knife Wizard Aborted
