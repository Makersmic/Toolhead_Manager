# =====================================================================
# SHARED UTILITY FOR GUIDED WALKTHROUGH PROMPTS
# =====================================================================
# Used by every file in this guided/ folder as a plain "close this
# dialog, take no other action" Cancel target - lighter than
# RESET_PRINTER_STATE (which cancels an active print), appropriate for
# wizards that haven't committed to anything irreversible yet.
# =====================================================================

[gcode_macro _CLOSE_PROMPT]
description: Closes any open guided-prompt dialog without side effects.
gcode:
  RESPOND TYPE=command MSG="action:prompt_end"
  M117 Canceled
