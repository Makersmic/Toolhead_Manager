# =====================================================================
# PREVENTIVE MAINTENANCE REMINDERS
# =====================================================================
# Tasks, schedules and the work log live in the Rhino portal (Maintenance). The portal keeps
# myrhino/maintenance_status.cfg up to date with what is due; Klipper reads it when it starts and
# this file shows it ONCE per start, after the "which tool is mounted?" question is answered.
#
# Maintenance never blocks anything - no job, swap or command waits for it.
#
#   PM_STATUS     what is overdue or coming up right now (asks the portal's files, live)
#   PM_REMINDER   show the start-up reminder again
# =====================================================================

[gcode_macro _PM_BOOT_REMINDER]
description: Show due maintenance once after Klipper starts (called when the tool-restore question is answered).
gcode:
  {% if "gcode_macro _PM_STATE" in printer %}
    {% set st = printer["gcode_macro _PM_STATE"] %}
    {% if st.shown|int == 0 and st.enabled|int == 1 and st.due_list|length > 0 %}
      SET_GCODE_VARIABLE MACRO=_PM_STATE VARIABLE=shown VALUE=1
      PM_REMINDER
    {% endif %}
  {% endif %}


[gcode_macro PM_REMINDER]
description: Show the maintenance that was due when Klipper started.
gcode:
  {% set st = printer["gcode_macro _PM_STATE"] %}
  {% set items = st.due_list %}
  {% set ns = namespace(over=0) %}
  {% for it in items if it[0] == "overdue" %}{% set ns.over = ns.over + 1 %}{% endfor %}
  {% set n_over = ns.over %}
  {% if items|length == 0 %}
    RESPOND MSG="Maintenance: nothing was due when Klipper started (checked {st.written})."
  {% else %}
    RESPOND TYPE=command MSG="action:prompt_begin Maintenance due"
    RESPOND TYPE=command MSG="action:prompt_text {n_over} overdue, {items|length - n_over} coming up (early alarm). Nothing is blocked - plan it in when it suits you."
    {% for it in items[:8] %}
      RESPOND TYPE=command MSG="action:prompt_text {'OVERDUE' if it[0] == 'overdue' else 'Soon'} - {it[1]}: {it[2]} ({it[3]})"
    {% endfor %}
    {% if items|length > 8 %}
      RESPOND TYPE=command MSG="action:prompt_text ...and {items|length - 8} more."
    {% endif %}
    RESPOND TYPE=command MSG="action:prompt_text Log the work in the Rhino portal, Maintenance. As of {st.written}."
    RESPOND TYPE=command MSG="action:prompt_footer_button OK|_PM_CLOSE|primary"
    RESPOND TYPE=command MSG="action:prompt_show"
  {% endif %}


[gcode_macro _PM_CLOSE]
description: Close the maintenance reminder.
gcode:
  RESPOND TYPE=command MSG="action:prompt_end"


[gcode_macro PM_STATUS]
description: List maintenance that is overdue or coming up (live, from the portal's task files).
gcode:
  RUN_SHELL_COMMAND CMD=rhino_toolgen PARAMS="pm-status"
