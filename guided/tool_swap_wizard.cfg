# =====================================================================
# GUIDED TOOL SWAP WIZARD
# =====================================================================
# Front door for SWAP_TOOL (toolchanger.cfg) - shows a button per
# toolhead defined in variables.cfg's tool_mapping instead of requiring
# you to remember/type TOOL=<id> by hand. SWAP_TOOL itself already ends
# in CONFIRM_TOOL_INSTALL, which confirms what you actually installed.
#
# Entry point: START_TOOL_SWAP
# =====================================================================

[gcode_macro START_TOOL_SWAP]
description: Shows a button for each defined toolhead and starts SWAP_TOOL for the one you pick.
gcode:
  {% set _tm = {} %}
  {% set _ = _tm.update(printer["gcode_macro VARIABLES"].tool_mapping) %}
  {% set _ = _tm.update(printer["gcode_macro CUSTOM_TOOLS"].tool_mapping) %}
  {% set tool_mapping = _tm %}
  {% set current = printer["gcode_macro SWAP_TOOL"].current_tool %}
  {% set current_name = tool_mapping.get(current, "None") if current != 0 else "None" %}

  RESPOND TYPE=command MSG="action:prompt_begin Tool swap"
  RESPOND TYPE=command MSG="action:prompt_text Currently installed: {current_name}"
  RESPOND TYPE=command MSG="action:prompt_text Pick the toolhead to install:"
  {% for id in tool_mapping|sort %}
    {% if id != current %}
      RESPOND TYPE=command MSG="action:prompt_button {tool_mapping[id]}|_START_TOOL_SWAP_CONFIRM TOOL={id}|primary"
    {% endif %}
  {% endfor %}
  RESPOND TYPE=command MSG="action:prompt_button Cancel|_CLOSE_PROMPT|error"
  RESPOND TYPE=command MSG="action:prompt_show"


[gcode_macro _START_TOOL_SWAP_CONFIRM]
description: One more confirmation before SWAP_TOOL parks the toolhead and powers down heaters - it commits to the swap.
gcode:
  {% set _tm = {} %}
  {% set _ = _tm.update(printer["gcode_macro VARIABLES"].tool_mapping) %}
  {% set _ = _tm.update(printer["gcode_macro CUSTOM_TOOLS"].tool_mapping) %}
  {% set TOOL = params.TOOL|int %}
  {% set tool_mapping = _tm %}
  {% set name = tool_mapping.get(TOOL, "Unknown tool " ~ TOOL) %}
  RESPOND TYPE=command MSG="action:prompt_end"

  RESPOND TYPE=command MSG="action:prompt_begin Confirm tool swap"
  RESPOND TYPE=command MSG="action:prompt_text Installing: {name}"
  RESPOND TYPE=command MSG="action:prompt_text The machine cools down, lowers the bed and switches the current tool off. Have {name} ready."
  RESPOND TYPE=command MSG="action:prompt_button Start the swap|SWAP_TOOL TOOL={TOOL}|primary"
  RESPOND TYPE=command MSG="action:prompt_button Back|START_TOOL_SWAP|secondary"
  RESPOND TYPE=command MSG="action:prompt_button Cancel|_CLOSE_PROMPT|error"
  RESPOND TYPE=command MSG="action:prompt_show"
