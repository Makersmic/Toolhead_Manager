# =====================================================================
# ADD / EDIT / REMOVE TOOLHEADS FROM THE CONSOLE  (fallback for the web portal)
# =====================================================================
# Mainsail prompts only support text and buttons - no drop-downs, no typed answers - so a
# real "wizard" cannot live here. The full form (drop-downs, free-text names, photos, live
# pin checks) is the Rhino portal (scripts/rhino_portal.py, port 5000). These macros are the
# console equivalent: you type the answers as parameters, the macro hands them to
# scripts/rhino_toolgen.py, which validates everything BEFORE changing any file.
#
#   ADD_TOOLHEAD NAME=FoamWire KIND=HOT_WIRE PIN=PB1
#   ADD_TOOLHEAD NAME=Needle KIND=NEEDLE POWER_PIN=SPINDLE_SPEED
#   ADD_TOOLHEAD NAME=Wide KIND=PRINT_HEAD BASE=BlockOne NOZZLES=0.6,1.0
#   ADD_TOOLHEAD NAME=Pen KIND=PASSIVE
#   EDIT_TOOLHEAD NAME=FoamWire CAP=0.45 MATERIAL=FOAM_EPS POWER=0.35 FEED=280
#   REMOVE_TOOLHEAD NAME=FoamWire
#   LIST_TOOLHEADS   TOOLHEAD_PINS   CHECK_TOOLHEADS   TOOLS_MENU
#
# Changes are saved at once but only load after a FIRMWARE_RESTART; the macros offer a button.
# Nothing here can run during a job.
# =====================================================================

[gcode_macro _TOOLGEN_GUARD]
description: Refuse registry changes while a job is running.
gcode:
  {% if printer.print_stats.state in ["printing", "paused"] %}
    { action_raise_error("Tool registry changes are blocked while a job is " ~ printer.print_stats.state ~ ". Finish or cancel the job first.") }
  {% endif %}


[gcode_macro _TOOLGEN]
description: Forward whitelisted parameters to rhino_toolgen (ACTION=add|edit|remove|rename|list|pins|check, KEYS=comma list).
gcode:
  {% set ns = namespace(args="") %}
  {% for k in params.KEYS.split(",") if k != "" %}
    {% if params[k] is defined %}
      {% set ns.args = ns.args ~ " " ~ k ~ "=" ~ params[k] %}
    {% endif %}
  {% endfor %}
  RUN_SHELL_COMMAND CMD=rhino_toolgen PARAMS="{params.ACTION}{ns.args}"


[gcode_macro ADD_TOOLHEAD]
description: Add a toolhead. NAME= KIND=HOT_WIRE|NEEDLE|POWERED|PASSIVE|PRINT_HEAD, then PIN= (new pin) or POWER_PIN= (share an existing PWM output).
gcode:
  _TOOLGEN_GUARD
  {% if params.NAME is not defined or params.KIND is not defined %}
    TOOLS_MENU
  {% else %}
    _TOOLGEN {rawparams} ACTION=add KEYS=NAME,KIND,SLOT,PIN,NEW_PIN,NEW_ENABLE_PIN,POWER_PIN,ENABLE_PIN,CYCLE,IDLE,MIN,CAP,S_MAX,MAX_ON_S,BASE,NOZZLES
    _TOOLS_RESTART_PROMPT
  {% endif %}


[gcode_macro EDIT_TOOLHEAD]
description: Change a custom toolhead. NAME= plus CAP= MIN= IDLE= MAX_ON_S= S_MAX= DEFAULT_POWER=, or MATERIAL= with POWER= FEED= ZOFF=, or DELMATERIAL=.
gcode:
  _TOOLGEN_GUARD
  {% if params.NAME is not defined %}
    { action_raise_error("EDIT_TOOLHEAD needs NAME=<custom toolhead>. See LIST_TOOLHEADS.") }
  {% endif %}
  _TOOLGEN {rawparams} ACTION=edit KEYS=NAME,CAP,MIN,IDLE,MAX_ON_S,S_MAX,DEFAULT_POWER,MATERIAL,POWER,FEED,ZOFF,DELMATERIAL
  _TOOLS_RESTART_PROMPT


[gcode_macro RENAME_TOOLHEAD]
description: Rename a custom toolhead. NAME=<old> NEWNAME=<new>
gcode:
  _TOOLGEN_GUARD
  _TOOLGEN {rawparams} ACTION=rename KEYS=NAME,NEWNAME
  _TOOLS_RESTART_PROMPT


[gcode_macro REMOVE_TOOLHEAD]
description: Remove a custom toolhead (asks you to confirm). NAME=<name>
gcode:
  _TOOLGEN_GUARD
  {% set _tm = {} %}
  {% set _ = _tm.update(printer["gcode_macro CUSTOM_TOOLS"].tool_mapping) %}
  {% set name = params.NAME|default("")|string %}
  {% if name not in _tm.values() %}
    { action_raise_error("REMOVE_TOOLHEAD: '" ~ name ~ "' is not a custom toolhead. See LIST_TOOLHEADS.") }
  {% endif %}
  {% if _tm.get(printer["gcode_macro SWAP_TOOL"].current_tool|int, "") == name %}
    { action_raise_error("REMOVE_TOOLHEAD: " ~ name ~ " is the mounted tool. Swap to another tool first.") }
  {% endif %}
  RESPOND TYPE=command MSG="action:prompt_begin Remove {name}?"
  RESPOND TYPE=command MSG="action:prompt_text This deletes {name} and its materials from the tool registry. Its pins are freed after the next restart."
  RESPOND TYPE=command MSG="action:prompt_button Remove {name}|_REMOVE_TOOLHEAD_GO NAME={name}|error"
  RESPOND TYPE=command MSG="action:prompt_footer_button Cancel|_CLOSE_PROMPT"
  RESPOND TYPE=command MSG="action:prompt_show"


[gcode_macro _REMOVE_TOOLHEAD_GO]
description: Second step of REMOVE_TOOLHEAD.
gcode:
  RESPOND TYPE=command MSG="action:prompt_end"
  _TOOLGEN_GUARD
  _TOOLGEN {rawparams} ACTION=remove KEYS=NAME
  _TOOLS_RESTART_PROMPT


[gcode_macro LIST_TOOLHEADS]
description: List every toolhead (built-in and custom) with slot, type and materials.
gcode:
  _TOOLGEN ACTION=list KEYS=NAME


[gcode_macro TOOLHEAD_PINS]
description: Show which tool-connector pins are free, used by the config, or reserved by a custom tool.
gcode:
  _TOOLGEN ACTION=pins KEYS=NAME


[gcode_macro CHECK_TOOLHEADS]
description: Re-validate the custom tool registry against the current config and regenerate custom_tools.cfg.
gcode:
  _TOOLGEN_GUARD
  _TOOLGEN ACTION=check KEYS=NAME
  _TOOLS_RESTART_PROMPT


[gcode_macro _TOOLS_RESTART_PROMPT]
description: After a registry change - changes are only loaded by a FIRMWARE_RESTART.
gcode:
  RESPOND TYPE=command MSG="action:prompt_begin Toolhead registry"
  RESPOND MSG="Look at the rhino: line above: OK means it was saved, ERROR means nothing changed."
  RESPOND TYPE=command MSG="action:prompt_text Check the console behind this window: the line starting rhino: says OK (saved) or ERROR (nothing changed)."
  RESPOND TYPE=command MSG="action:prompt_text If it says OK, restart to load the change. If it says ERROR, press Later and fix what it names."
  RESPOND TYPE=command MSG="action:prompt_button Restart now|RESTART_FOR_TOOLS|primary"
  RESPOND TYPE=command MSG="action:prompt_footer_button Later|_CLOSE_PROMPT"
  RESPOND TYPE=command MSG="action:prompt_show"


[gcode_macro RESTART_FOR_TOOLS]
description: FIRMWARE_RESTART to load registry changes (refused during a job).
gcode:
  RESPOND TYPE=command MSG="action:prompt_end"
  _TOOLGEN_GUARD
  M117 Restarting to load tools...
  FIRMWARE_RESTART


[gcode_macro TOOLS_MENU]
description: Where to add, edit and remove toolheads.
gcode:
  RESPOND TYPE=command MSG="action:prompt_begin Toolheads"
  RESPOND TYPE=command MSG="action:prompt_text Add, edit and remove tools in the Rhino portal (port 5000 on this machine): drop-down menus, typed names, photos and live pin checks."
  RESPOND TYPE=command MSG="action:prompt_text From the console: ADD_TOOLHEAD NAME=<name> KIND=<HOT_WIRE|NEEDLE|POWERED|PASSIVE|PRINT_HEAD> PIN=<free pin>"
  RESPOND TYPE=command MSG="action:prompt_button List toolheads|LIST_TOOLHEADS"
  RESPOND TYPE=command MSG="action:prompt_button Free pins|TOOLHEAD_PINS"
  RESPOND TYPE=command MSG="action:prompt_button Select a tool|SWAP_TOOL"
  RESPOND TYPE=command MSG="action:prompt_footer_button Close|_CLOSE_PROMPT"
  RESPOND TYPE=command MSG="action:prompt_show"
