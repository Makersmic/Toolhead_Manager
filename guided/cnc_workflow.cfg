# ====================================================================
# 🪓 STAGE 1: SAFETY REVIEW & ENTRY PANEL
# ====================================================================

[gcode_macro CNC_JOB_SETUP]
description: Guided setup wizard for a spindle (CNC) job - safety, work-zero matrix, spindle warmup, file fire.
variable_duty: 0.6
gcode:
  # 🔒 State Verification Lockout Check
  {% if printer.print_stats.state in ["printing", "paused"] %}
    { action_raise_error("CNC_JOB_SETUP cannot execute while a print or cut job is running or paused!") }
  {% endif %}

  # Validate that the active mounted hardware is HotJoe
  {% set physical_slot = printer["gcode_macro SWAP_TOOL"].current_tool|int %}
  {% set tool_mapping = printer["gcode_macro VARIABLES"].tool_mapping %}
  {% set physical_name = tool_mapping.get(physical_slot, "Unknown") %}

  {% if physical_name != "HotJoe" %}
    { action_raise_error("Setup Blocked: Run the SWAP_TOOL wizard to mount HotJoe before setting up a CNC job.") }
  {% endif %}

  # Map file target pointer payload
  SET_GCODE_VARIABLE MACRO=_START_JOB_FILE VARIABLE=file VALUE="'{params.FILE|default("")}'"
  
  # Fetch globally stored tool parameters from your variables cache
  {% set TOOLHEAD = physical_name %}
  {% set MATERIAL = printer.save_variables.variables.set_material_material|default("SOFT_WOOD") %}
  {% set target_rpm = printer.save_variables.variables.set_material_spindle_speed|default(10000) %}
  {% set feed_rate = printer.save_variables.variables.set_material_feed_rate|default(500) %}

  RESPOND TYPE=command MSG="action:prompt_begin CNC setup"
  RESPOND TYPE=command MSG="action:prompt_text Toolhead: {TOOLHEAD} / Material: {MATERIAL}"
  RESPOND TYPE=command MSG="action:prompt_text For your CAM: {target_rpm} RPM / Feed: {feed_rate} mm/min"
  RESPOND TYPE=command MSG="action:prompt_text Check before you start:"
  RESPOND TYPE=command MSG="action:prompt_text - Stock is clamped firmly to the bed"
  RESPOND TYPE=command MSG="action:prompt_text - Bit is seated and the collet nut is tight"
  RESPOND TYPE=command MSG="action:prompt_text - Dust extraction is on"
  RESPOND TYPE=command MSG="action:prompt_text - Eye and ear protection on, work area clear"
  
  RESPOND TYPE=command MSG="action:prompt_button All checked - set X/Y zero|_CNC_ZERO_XY|primary"
  RESPOND TYPE=command MSG="action:prompt_button Cancel setup|_CLOSE_PROMPT|error"
  RESPOND TYPE=command MSG="action:prompt_show"


# ====================================================================
# 🧭 STAGE 2: WORK COORDINATE SYSTEM ZEROING (X/Y ZERO VIA G54)
# ====================================================================

[gcode_macro _CNC_ZERO_XY]
description: Instructs jogging to the stock's XY origin, then sets that as persistent G54 work zero
gcode:
  RESPOND TYPE=command MSG="action:prompt_end"
  
  # Auto-home security gate if axes are clear
  _RHINO_HOME_SAFE RESUME=_CNC_ZERO_XY ; never homes Z with this tool mounted

  RESPOND TYPE=command MSG="action:prompt_begin Set X/Y zero"
  RESPOND TYPE=command MSG="action:prompt_text Jog the bit over the X/Y origin of your stock (usually a corner) with Mainsail's move panel."
  RESPOND TYPE=command MSG="action:prompt_text Then set X/Y zero. Nothing moves when you press it."
  
  RESPOND TYPE=command MSG="action:prompt_button Set X/Y zero here|_CNC_SAVE_XY|primary"
  RESPOND TYPE=command MSG="action:prompt_button Cancel setup|_CNC_ABORT|error"
  RESPOND TYPE=command MSG="action:prompt_show"

[gcode_macro _CNC_SAVE_XY]
gcode:
  RESPOND TYPE=command MSG="action:prompt_end"
  
  # Upgraded from volatile G92 to persistent G54 coordinate offset mappings
  # machine position, so an older work offset cannot leak into the new one
  {% set raw_x = printer.toolhead.position.x|float %}
  {% set raw_y = printer.toolhead.position.y|float %}

  SAVE_VARIABLE VARIABLE=cnc_g54_x VALUE={raw_x}
  SAVE_VARIABLE VARIABLE=cnc_g54_y VALUE={raw_y}
  G54 # Refresh the live gcode transform coordinates mapping cache
  M117 G54 XY Zero Committed

  # Route directly into the upgraded dynamic Z Zero selector interface
  _CNC_ZERO_Z_CHOOSE


# ====================================================================
# 🔍 STAGE 3: INTERACTIVE DYNAMIC Z-AXIS SELECTION (MANUAL OR PROBED)
# ====================================================================

[gcode_macro _CNC_ZERO_Z_CHOOSE]
description: Set the spindle's Z zero on the material surface by eye (SET_Z_ZERO), then go on to the spindle warm-up.
gcode:
  RESPOND TYPE=command MSG="action:prompt_end"
  SET_Z_ZERO NEXT=_CNC_WARMUP


# ====================================================================
# 📈 STAGE 4: SPINDLE ESC RAMPING & SPEED CONTROL TUNER
# ====================================================================

[gcode_macro _CNC_WARMUP]
description: Safely lifts tool head clear, energizes power relay, and ramps ESC throttle smoothly
gcode:
  RESPOND TYPE=command MSG="action:prompt_end"
  M117 Work zero verified - spinning up tool
  
  # Lift toolhead safely relative to your new working G54 coordinate plane (never past the end of Z travel)
  _RHINO_LIFT DZ=10 F=600

  # Energize the primary spindle motor electrical rails safely via your safety-gated profile
  Spindle_ACTIVATE
  
  # Ramping stage 1: Safe baseline tracking speed initialization
  SET_PIN PIN=SPINDLE_SPEED VALUE=0.4 PWM_CYCLE_TIME=0.0025
  G4 P2000
  
  # Ramping stage 2: Target to chosen starting duty cycle setting
  {% set target_duty = printer["gcode_macro CNC_JOB_SETUP"].duty|float %}
  SET_PIN PIN=SPINDLE_SPEED VALUE={target_duty} PWM_CYCLE_TIME=0.0025
  G4 P2000

  _CNC_READY

[gcode_macro _CNC_READY]
description: Final dashboard view offering active speed nudge parameters before firing Gcode
gcode:
  {% set duty = printer["gcode_macro CNC_JOB_SETUP"].duty|float %}
  RESPOND TYPE=command MSG="action:prompt_begin Ready to cut"
  RESPOND TYPE=command MSG="action:prompt_text Spindle running at {"%.0f"|format(duty * 100)}% throttle."
  RESPOND TYPE=command MSG="action:prompt_text Dust extraction on and eye protection on? Then start the cut."
  
  RESPOND TYPE=command MSG="action:prompt_button Start the cut|_CNC_START|success"
  RESPOND TYPE=command MSG="action:prompt_button Throttle +5%|_CNC_ADJUST_SPEED DELTA=0.05|secondary"
  RESPOND TYPE=command MSG="action:prompt_button Throttle -5%|_CNC_ADJUST_SPEED DELTA=-0.05|secondary"
  RESPOND TYPE=command MSG="action:prompt_button Stop the spindle and cancel|_CNC_ABORT|error"
  RESPOND TYPE=command MSG="action:prompt_show"

[gcode_macro _CNC_ADJUST_SPEED]
gcode:
  {% set DELTA = params.DELTA|default(0.05)|float %}
  {% set current = printer["gcode_macro CNC_JOB_SETUP"].duty|float %}
  {% set new_duty = [[current + DELTA, 0.3]|max, 1.0]|min %}
  
  SET_GCODE_VARIABLE MACRO=CNC_JOB_SETUP VARIABLE=duty VALUE={new_duty}
  SET_PIN PIN=SPINDLE_SPEED VALUE={new_duty} PWM_CYCLE_TIME=0.0025
  RESPOND TYPE=command MSG="action:prompt_end"
  _CNC_READY


# ====================================================================
# 🏁 STAGE 5: START FILE EXECUTION & DEVIANT BAILOUTS
# ====================================================================

[gcode_macro _CNC_START]
gcode:
  RESPOND TYPE=command MSG="action:prompt_end"
  M117 CNC cutting file starting...
  _START_JOB_FILE

[gcode_macro _CNC_ABORT]
gcode:
  RESPOND TYPE=command MSG="action:prompt_end"
  # Clean safety kill via hardware profile
  Spindle_DEACTIVATE
  _RHINO_LIFT DZ=15 F=600   # 15 mm clear of the stock face (less near the end of Z travel)
  M117 CNC Setup Cancelled
