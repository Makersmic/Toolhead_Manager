# ====================================================================
# 🪓 STAGE 1: SAFETY REVIEW & ENTRY PANEL
# ====================================================================

[gcode_macro CNC_JOB_SETUP]
description: Guided setup wizard for a spindle (CNC) job - safety, work-zero matrix, spindle warmup, file fire.
variable_duty: 0.6
gcode:
  # 🔒 State Verification Lockout Check
  {% if printer.print_stats.state in ["printing", "paused"] %}
    { action_raise_error("CNC_JOB_SETUP cannot execute while a print or cut job is running or paused!") }
  {% endif %}

  # Validate that the active mounted hardware is HotJoe
  {% set physical_slot = printer["gcode_macro SWAP_TOOL"].current_tool|int %}
  {% set tool_mapping = printer["gcode_macro VARIABLES"].tool_mapping %}
  {% set physical_name = tool_mapping.get(physical_slot, "Unknown") %}

  {% if physical_name != "HotJoe" %}
    { action_raise_error("Setup Blocked: Run the SWAP_TOOL wizard to mount HotJoe before setting up a CNC job.") }
  {% endif %}

  # Map file target pointer payload
  SET_GCODE_VARIABLE MACRO=_START_JOB_FILE VARIABLE=file VALUE="'{params.FILE|default("")}'"
  
  # Fetch globally stored tool parameters from your variables cache
  {% set TOOLHEAD = physical_name %}
  {% set MATERIAL = printer.save_variables.variables.set_material_material|default("SOFT_WOOD") %}
  {% set target_rpm = printer.save_variables.variables.set_material_spindle_speed|default(10000) %}
  {% set feed_rate = printer.save_variables.variables.set_material_feed_rate|default(500) %}

  RESPOND TYPE=command MSG="action:prompt_begin CNC Job Setup"
  RESPOND TYPE=command MSG="action:prompt_text Active Toolhead: {TOOLHEAD} | Material Profile: {MATERIAL}"
  RESPOND TYPE=command MSG="action:prompt_text CAM Reference targets: {target_rpm} RPM | Feed: {feed_rate} mm/min"
  RESPOND TYPE=command MSG="action:prompt_text --------------------------------------------------"
  RESPOND TYPE=command MSG="action:prompt_text Before proceeding, explicitly verify:"
  RESPOND TYPE=command MSG="action:prompt_text  • Stock material is clamped/secured firmly to the bed table"
  RESPOND TYPE=command MSG="action:prompt_text  • Cutting bit is firmly seated and collet nut is torqued tight"
  RESPOND TYPE=command MSG="action:prompt_text  • Dust extraction shroud / chip evacuation vacuum lines are active"
  RESPOND TYPE=command MSG="action:prompt_text  • Personal protection equipment (eyes/ears) on, work area clear"
  
  RESPOND TYPE=command MSG="action:prompt_button All Confirmed -> Move to Positioning|_CNC_ZERO_XY|primary"
  RESPOND TYPE=command MSG="action:prompt_button Abort Setup Sequence|_CLOSE_PROMPT|error"
  RESPOND TYPE=command MSG="action:prompt_show"


# ====================================================================
# 🧭 STAGE 2: WORK COORDINATE SYSTEM ZEROING (X/Y ZERO VIA G54)
# ====================================================================

[gcode_macro _CNC_ZERO_XY]
description: Instructs jogging to the stock's XY origin, then sets that as persistent G54 work zero
gcode:
  RESPOND TYPE=command MSG="action:prompt_end"
  
  # Auto-home security gate if axes are clear
  _RHINO_HOME_SAFE ; never homes Z with this tool mounted

  RESPOND TYPE=command MSG="action:prompt_begin Set XY Work Zero"
  RESPOND TYPE=command MSG="action:prompt_text Using your dashboard move panel, manually jog the cutting bit center directly over the XY origin corner of your stock material."
  RESPOND TYPE=command MSG="action:prompt_text "
  RESPOND TYPE=command MSG="action:prompt_text Click below once the cutter is aligned directly over the corner point:"
  
  RESPOND TYPE=command MSG="action:prompt_button Set XY Zero and Move to Z|_CNC_SAVE_XY|primary"
  RESPOND TYPE=command MSG="action:prompt_button Abort Setup Routine|_CNC_ABORT|error"
  RESPOND TYPE=command MSG="action:prompt_show"

[gcode_macro _CNC_SAVE_XY]
gcode:
  RESPOND TYPE=command MSG="action:prompt_end"
  
  # Upgraded from volatile G92 to persistent G54 coordinate offset mappings
  {% set raw_x = printer.gcode_move.gcode_position.x|float %}
  {% set raw_y = printer.gcode_move.gcode_position.y|float %}
  {% set current_z = printer.save_variables.variables.cnc_g54_z|default(0.0)|float %}

  SAVE_VARIABLE VARIABLE=cnc_g54_x VALUE={raw_x}
  SAVE_VARIABLE VARIABLE=cnc_g54_y VALUE={raw_y}
  G54 # Refresh the live gcode transform coordinates mapping cache
  M117 G54 XY Zero Committed

  # Route directly into the upgraded dynamic Z Zero selector interface
  _CNC_ZERO_Z_CHOOSE


# ====================================================================
# 🔍 STAGE 3: INTERACTIVE DYNAMIC Z-AXIS SELECTION (MANUAL OR PROBED)
# ====================================================================

[gcode_macro _CNC_ZERO_Z_CHOOSE]
description: Interface modal giving choice between manual paper method or automated touch plate probing
gcode:
  RESPOND TYPE=command MSG="action:prompt_begin Set Z Work Zero"
  RESPOND TYPE=command MSG="action:prompt_text XY limits locked. Choose how you want to index your material surface Z-height zero point:"
  RESPOND TYPE=command MSG="action:prompt_text "
  RESPOND TYPE=command MSG="action:prompt_text • Touch Plate: Place the 10mm block under the bit and connect the ground clip."
  RESPOND TYPE=command MSG="action:prompt_text • Manual: Slowly jog Z down until the bit edge just nips your material face."
  
  RESPOND TYPE=command MSG="action:prompt_button 🔍 Use Automated 10mm Touch Plate|_CNC_PROBE_Z_RUN|warning"
  RESPOND TYPE=command MSG="action:prompt_button 📝 Set Manual Jog Zero Here|_CNC_SAVE_MANUAL_Z|primary"
  RESPOND TYPE=command MSG="action:prompt_button Abort Setup Routine|_CNC_ABORT|error"
  RESPOND TYPE=command MSG="action:prompt_show"

[gcode_macro _CNC_PROBE_Z_RUN]
gcode:
  RESPOND TYPE=command MSG="action:prompt_end"
  
  # Call our verified, safe touch-plate probing routine
  RESPOND MSG="⚡ Initializing downward sensor search matrix..."
  G91                    
  G38.2 Z-30 F100        # Downward probe movement looking for circuit contact strike
  G90
  # Read the contact height in a separate macro so it is taken AFTER the probe move
  # (see _CNC_SAVE_TOUCH_Z in tools/spindle_macros.cfg). 10.0 = your aluminium plate block.
  _CNC_SAVE_TOUCH_Z THICKNESS=10.0
  G91
  G1 Z5 F600             # Lift toolbit clear safely
  G90                    
  G54                    # Load updated coordinate plane registers
  
  M117 Probed Z Zero Set
  _CNC_WARMUP            # Automatically step forward to the warmup sequence

[gcode_macro _CNC_SAVE_MANUAL_Z]
gcode:
  RESPOND TYPE=command MSG="action:prompt_end"
  
  # Capture user's manual jog position and write to disk
  {% set raw_z = printer.gcode_move.gcode_position.z|float %}
  SAVE_VARIABLE VARIABLE=cnc_g54_z VALUE={raw_z}
  G54
  
  M117 Manual Z Zero Set
  _CNC_WARMUP


# ====================================================================
# 📈 STAGE 4: SPINDLE ESC RAMPING & SPEED CONTROL TUNER
# ====================================================================

[gcode_macro _CNC_WARMUP]
description: Safely lifts tool head clear, energizes power relay, and ramps ESC throttle smoothly
gcode:
  RESPOND TYPE=command MSG="action:prompt_end"
  M117 Work zero verified - spinning up tool
  
  # Lift toolhead safely relative to your new working G54 coordinate plane
  G91
  G1 Z10 F600
  G90

  # Energize the primary spindle motor electrical rails safely via your safety-gated profile
  Spindle_ACTIVATE
  
  # Ramping stage 1: Safe baseline tracking speed initialization
  SET_PIN PIN=SPINDLE_SPEED VALUE=0.4 PWM_CYCLE_TIME=0.0025
  G4 P2000
  
  # Ramping stage 2: Target to chosen starting duty cycle setting
  {% set target_duty = printer["gcode_macro CNC_JOB_SETUP"].duty|float %}
  SET_PIN PIN=SPINDLE_SPEED VALUE={target_duty} PWM_CYCLE_TIME=0.0025
  G4 P2000

  _CNC_READY

[gcode_macro _CNC_READY]
description: Final dashboard view offering active speed nudge parameters before firing Gcode
gcode:
  {% set duty = printer["gcode_macro CNC_JOB_SETUP"].duty|float %}
  RESPOND TYPE=command MSG="action:prompt_begin Ready to Cut"
  RESPOND TYPE=command MSG="action:prompt_text Spindle motor initialized and stabilized at {"%.0f"|format(duty * 100)}% throttle cycle."
  RESPOND TYPE=command MSG="action:prompt_text Verify dust collections are active and protective eyewear is sealed."
  
  RESPOND TYPE=command MSG="action:prompt_button 🚀 START JOB CUT NOW|_CNC_START|success"
  RESPOND TYPE=command MSG="action:prompt_button 📈 Throttle UP (+5%)|_CNC_ADJUST_SPEED DELTA=0.05|secondary"
  RESPOND TYPE=command MSG="action:prompt_button 📉 Throttle DOWN (-5%)|_CNC_ADJUST_SPEED DELTA=-0.05|secondary"
  RESPOND TYPE=command MSG="action:prompt_button 🛑 EMERGENCY ABORT WIZARD|_CNC_ABORT|error"
  RESPOND TYPE=command MSG="action:prompt_show"

[gcode_macro _CNC_ADJUST_SPEED]
gcode:
  {% set DELTA = params.DELTA|default(0.05)|float %}
  {% set current = printer["gcode_macro CNC_JOB_SETUP"].duty|float %}
  {% set new_duty = [[current + DELTA, 0.3]|max, 1.0]|min %}
  
  SET_GCODE_VARIABLE MACRO=CNC_JOB_SETUP VARIABLE=duty VALUE={new_duty}
  SET_PIN PIN=SPINDLE_SPEED VALUE={new_duty} PWM_CYCLE_TIME=0.0025
  RESPOND TYPE=command MSG="action:prompt_end"
  _CNC_READY


# ====================================================================
# 🏁 STAGE 5: START FILE EXECUTION & DEVIANT BAILOUTS
# ====================================================================

[gcode_macro _CNC_START]
gcode:
  RESPOND TYPE=command MSG="action:prompt_end"
  M117 CNC cutting file starting...
  _START_JOB_FILE

[gcode_macro _CNC_ABORT]
gcode:
  RESPOND TYPE=command MSG="action:prompt_end"
  # Clean safety kill via hardware profile
  Spindle_DEACTIVATE
  G91
  G1 Z15 F600   # Lift up an extra 15mm clear of the stock material face
  G90
  M117 CNC Setup Cancelled
