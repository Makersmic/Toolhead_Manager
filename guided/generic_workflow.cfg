# =====================================================================
# GUIDED JOB SETUP FOR USER-ADDED TOOLS (hot wire, needle cutter, pen, ...)
# =====================================================================
# What LASER_JOB_SETUP / CNC_JOB_SETUP do for the built-in tools, for any tool added with
# ADD_TOOLHEAD or the portal:
#   1. shows the tool's own safety checklist
#   2. sets the work zero (X/Y at the current position, Z at the tool tip) WITHOUT moving
#   3. optional low-power test pulse
#   4. starts the job - with tool power switched ON first, or leaving power to M3/M5 in the file
#
# Entry point:   TOOL_JOB_SETUP FILE=<name.gcode>
# Select the tool and material first:  SET_TOOLHEAD TOOLHEAD=<name> MATERIAL=<material>
#
# Zero is set from printer.toolhead.position with SET_GCODE_OFFSET and no MOVE=1. (MOVE=1 would
# drive the head by the offset change, so "set zero here" would move it away from "here".)
# =====================================================================

[gcode_macro _TOOL_JOB_STATE]
description: Progress of TOOL_JOB_SETUP (do not run).
variable_xy: 0
variable_z: 0
gcode:
  RESPOND MSG="_TOOL_JOB_STATE only holds state"


[gcode_macro TOOL_JOB_SETUP]
description: Guided setup for a job with a user-added powered or passive tool - checklist, work zero, test pulse, start.
gcode:
  {% set _tm = {} %}
  {% set _ = _tm.update(printer["gcode_macro VARIABLES"].tool_mapping) %}
  {% set _ = _tm.update(printer["gcode_macro CUSTOM_TOOLS"].tool_mapping) %}
  {% set name = _tm.get(printer["gcode_macro SWAP_TOOL"].current_tool|int, "none") %}
  {% set t = printer["gcode_macro CUSTOM_TOOLS"].toolheads.get(name, {}) %}
  {% set sv = printer.save_variables.variables %}

  {% if printer.print_stats.state in ["printing", "paused"] %}
    { action_raise_error("TOOL_JOB_SETUP sets a work zero, which a running or paused job's RESUME would undo. Run it BEFORE the job: TOOL_JOB_SETUP FILE=<name.gcode>") }
  {% endif %}
  {% if t.get("type") not in ["POWERED", "PASSIVE"] %}
    { action_raise_error("TOOL_JOB_SETUP is for tools added with ADD_TOOLHEAD or the portal. Mounted tool: " ~ name ~ ". Built-in tools have LASER_JOB_SETUP, CNC_JOB_SETUP, DRAGKNIFE_JOB_SETUP and START_JOB.") }
  {% endif %}
  {% if sv.set_material_toolhead|default("") != name or sv.set_material_material|default("") not in t.get("materials", {}) %}
    { action_raise_error("Choose a material for " ~ name ~ " first: SET_TOOLHEAD TOOLHEAD=" ~ name ~ " MATERIAL=<" ~ t.get("materials", {}).keys()|join("|") ~ ">") }
  {% endif %}
  SET_GCODE_VARIABLE MACRO=_START_JOB_FILE VARIABLE=file VALUE="'{params.FILE|default("")}'"
  _RHINO_HOME_SAFE RESUME=_TOOL_JOB_SETUP_AGAIN ; never homes Z; homes X/Y only if needed
  SET_GCODE_VARIABLE MACRO=_TOOL_JOB_STATE VARIABLE=xy VALUE=0
  SET_GCODE_VARIABLE MACRO=_TOOL_JOB_STATE VARIABLE=z VALUE=0

  RESPOND TYPE=command MSG="action:prompt_begin {name} Job Setup"
  RESPOND TYPE=command MSG="action:prompt_text Tool: {name} / Material: {sv.set_material_material}"
  RESPOND TYPE=command MSG="action:prompt_text Before continuing, confirm:"
  {% for item in t.get("checklist", []) %}
    RESPOND TYPE=command MSG="action:prompt_text - {item}"
  {% endfor %}
  RESPOND TYPE=command MSG="action:prompt_button All Confirmed|_TOOL_POSITION|primary"
  RESPOND TYPE=command MSG="action:prompt_footer_button Cancel|_TOOL_JOB_ABORT"
  RESPOND TYPE=command MSG="action:prompt_show"


[gcode_macro _TOOL_POSITION]
description: Step 2 - jog the tool to the work origin and record it. XY/Z are 0/1 flags for the prompt text.
gcode:
  {% set xy = params.XY|default(printer["gcode_macro _TOOL_JOB_STATE"].xy)|int %}
  {% set z = params.Z|default(printer["gcode_macro _TOOL_JOB_STATE"].z)|int %}
  RESPOND TYPE=command MSG="action:prompt_end"
  RESPOND TYPE=command MSG="action:prompt_begin Set Work Zero"
  RESPOND TYPE=command MSG="action:prompt_text Jog the tool over the work origin and record X/Y (nothing moves). Z zero opens a window where you move the bed to the surface and press SET."
  RESPOND TYPE=command MSG="action:prompt_text X/Y zero: {'SET' if xy else 'not set'}   Z zero: {'SET' if z else 'not set'}"
  RESPOND TYPE=command MSG="action:prompt_button Set X/Y zero here|_TOOL_SET_XY"
  RESPOND TYPE=command MSG="action:prompt_button Set Z zero (move the bed, then SET)|_TOOL_SET_Z"
  {% if xy and z %}
    RESPOND TYPE=command MSG="action:prompt_button Continue|_TOOL_READY|primary"
  {% endif %}
  RESPOND TYPE=command MSG="action:prompt_footer_button Cancel|_TOOL_JOB_ABORT"
  RESPOND TYPE=command MSG="action:prompt_show"


[gcode_macro _TOOL_SET_XY]
description: Make the current X/Y position the work origin (no movement).
gcode:
  {% set pos = printer.toolhead.position %}
  SET_GCODE_OFFSET X={pos.x} Y={pos.y}
  SET_GCODE_VARIABLE MACRO=_TOOL_JOB_STATE VARIABLE=xy VALUE=1
  M117 X/Y zero set
  _TOOL_POSITION XY=1


[gcode_macro _TOOL_JOB_SETUP_AGAIN]
description: Helper - run TOOL_JOB_SETUP again (same file) after Z was restored.
gcode:
  TOOL_JOB_SETUP FILE={printer["gcode_macro _START_JOB_FILE"].file}


[gcode_macro _TOOL_SET_Z]
description: Set the work surface by eye with SET_Z_ZERO; _TOOL_Z_DONE then adds the material's z_offset.
gcode:
  RESPOND TYPE=command MSG="action:prompt_end"
  SET_Z_ZERO NEXT=_TOOL_Z_DONE


[gcode_macro _TOOL_Z_DONE]
description: After SET_Z_ZERO - add the material's z_offset to the surface just set (no movement).
gcode:
  {% set sv = printer.save_variables.variables %}
  {% set th = printer["gcode_macro CUSTOM_TOOLS"].toolheads.get(sv.set_material_toolhead|default(""), {}) %}
  {% set zoff = th.get("materials", {}).get(sv.set_material_material|default(""), {}).get("z_offset", 0)|float %}
  SET_GCODE_OFFSET Z={sv.cnc_g54_z|float + zoff}
  SET_GCODE_VARIABLE MACRO=_TOOL_JOB_STATE VARIABLE=z VALUE=1
  M117 Z zero set
  _TOOL_POSITION Z=1


[gcode_macro _TOOL_READY]
description: Step 3 - optional test pulse, then choose how the job starts.
gcode:
  {% set _tm = {} %}
  {% set _ = _tm.update(printer["gcode_macro VARIABLES"].tool_mapping) %}
  {% set _ = _tm.update(printer["gcode_macro CUSTOM_TOOLS"].tool_mapping) %}
  {% set name = _tm.get(printer["gcode_macro SWAP_TOOL"].current_tool|int, "none") %}
  {% set t = printer["gcode_macro CUSTOM_TOOLS"].toolheads.get(name, {}) %}
  RESPOND TYPE=command MSG="action:prompt_end"
  RESPOND TYPE=command MSG="action:prompt_begin Ready to start"
  {% if t.get("type") == "POWERED" %}
    RESPOND TYPE=command MSG="action:prompt_text Stand clear of the tool. The test pulse runs for 1 second at 10% of the cap."
    RESPOND TYPE=command MSG="action:prompt_text Start with tool power ON if the G-code file never switches the tool itself (typical for hot wire). Choose 'file controls power' if the file has its own M3/M5."
    RESPOND TYPE=command MSG="action:prompt_button Test pulse|_TOOL_TEST_PULSE"
    RESPOND TYPE=command MSG="action:prompt_button Start - tool power ON|_TOOL_START MODE=ON|primary"
    RESPOND TYPE=command MSG="action:prompt_button Start - file controls power|_TOOL_START MODE=FILE"
  {% else %}
    RESPOND TYPE=command MSG="action:prompt_text Work zero is set. Start the job."
    RESPOND TYPE=command MSG="action:prompt_button Start|_TOOL_START MODE=FILE|primary"
  {% endif %}
  RESPOND TYPE=command MSG="action:prompt_footer_button Cancel|_TOOL_JOB_ABORT"
  RESPOND TYPE=command MSG="action:prompt_show"


[gcode_macro _TOOL_TEST_PULSE]
description: 1 second at 10% of the power cap, then off.
gcode:
  RESPOND TYPE=command MSG="action:prompt_end"
  M117 Test pulse...
  SET_TOOL_POWER POWER=0.1
  G4 P1000
  SET_TOOL_POWER POWER=0
  _TOOL_READY


[gcode_macro _TOOL_START]
description: Start the job. MODE=ON switches the tool on at the material's power first; MODE=FILE leaves power to the file.
gcode:
  {% set sv = printer.save_variables.variables %}
  RESPOND TYPE=command MSG="action:prompt_end"
  {% if params.MODE|default("FILE")|upper == "ON" %}
    SET_TOOL_POWER POWER={sv.set_material_power|default(0.5)|float}
  {% endif %}
  M117 Job starting
  _START_JOB_FILE


[gcode_macro _TOOL_JOB_ABORT]
description: Cancel the setup - power off, work offset cleared.
gcode:
  RESPOND TYPE=command MSG="action:prompt_end"
  _TOOL_SAFE_OFF
  SET_GCODE_OFFSET X=0 Y=0 Z=0
  SET_GCODE_VARIABLE MACRO=_START_JOB_FILE VARIABLE=file VALUE="''"
  M117 Tool setup canceled
