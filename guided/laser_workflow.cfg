# =====================================================================
# GUIDED LASER JOB SETUP
# =====================================================================
# This laser toolhead predates Klipper's native laser-mode merge and is
# wired/configured as a cutter (fixed-power passes via M3/M4/M5 ->
# SET_LASER_POWER), not a rastering engraver - so this workflow is
# built around cut confirmation and pass count, not raster/grayscale
# steps.
#
# Entry point: LASER_JOB_SETUP
# =====================================================================

[gcode_macro LASER_JOB_SETUP]
description: Guided setup for a laser cutting job - safety check, focus height, low-power test fire, start.
variable_passes: 1
gcode:
  {% if printer.print_stats.state in ["printing", "paused"] %}
    { action_raise_error("LASER_JOB_SETUP sets a work zero, which a running or paused job's RESUME would undo. Run it BEFORE the job starts: LASER_JOB_SETUP FILE=<name.gcode>") }
  {% endif %}
  SET_GCODE_VARIABLE MACRO=_START_JOB_FILE VARIABLE=file VALUE="'{params.FILE|default("")}'"
  {% set TOOLHEAD = printer.save_variables.variables.set_material_toolhead|default("LightSaber") %}
  {% set MATERIAL = printer.save_variables.variables.set_material_material|default("PLYWOOD") %}
  {% set power = printer.save_variables.variables.set_material_laser_power|default(0.8) %}
  {% set feed_rate = printer.save_variables.variables.set_material_feed_rate|default(600) %}

  RESPOND TYPE=command MSG="action:prompt_begin Laser Job Setup"
  RESPOND TYPE=command MSG="action:prompt_text Toolhead: {TOOLHEAD} / Material: {MATERIAL}"
  RESPOND TYPE=command MSG="action:prompt_text Cut power: {"%.0f"|format(power * 100)}%, feed {feed_rate} mm/min"
  RESPOND TYPE=command MSG="action:prompt_text Before continuing, confirm:"
  RESPOND TYPE=command MSG="action:prompt_text - Fume extraction / ventilation is running"
  RESPOND TYPE=command MSG="action:prompt_text - Laser safety glasses on (correct wavelength)"
  RESPOND TYPE=command MSG="action:prompt_text - Material is NOT PVC/vinyl or other chlorinated plastic"
  RESPOND TYPE=command MSG="action:prompt_text - Material lies flat, non-reflective side up"
  RESPOND TYPE=command MSG="action:prompt_text - Fire extinguisher/water nearby; you will stay present for the whole cut"
  RESPOND TYPE=command MSG="action:prompt_button All Confirmed|_LASER_FOCUS|primary"
  RESPOND TYPE=command MSG="action:prompt_button Cancel|_CLOSE_PROMPT|error"
  RESPOND TYPE=command MSG="action:prompt_show"


[gcode_macro _LASER_FOCUS]
description: Set the laser's Z zero at the focus point by eye (SET_Z_ZERO), then go on to the test fire.
gcode:
  RESPOND TYPE=command MSG="action:prompt_end"
  M5
  DEACTIVATE_LASER
  # Z0 is the focus point: G-code from the laser software runs at Z0 with no extra offset
  SET_Z_ZERO NEXT=_LASER_TEST_FIRE


[gcode_macro _LASER_ABORT]
description: Safe bailout - ensures the laser is off before closing.
gcode:
  RESPOND TYPE=command MSG="action:prompt_end"
  M5
  DEACTIVATE_LASER
  M117 Laser setup aborted


[gcode_macro _LASER_TEST_FIRE]
description: Fires a brief low-power pulse in place to confirm alignment/focus before cutting.
gcode:
  RESPOND TYPE=command MSG="action:prompt_end"
  M117 Test firing at low power...
  ACTIVATE_LASER
  SET_LASER_POWER POWER=0.05
  G4 P200
  SET_LASER_POWER POWER=0.0
  DEACTIVATE_LASER

  RESPOND TYPE=command MSG="action:prompt_begin Check Test Mark"
  RESPOND TYPE=command MSG="action:prompt_text Did you see a small mark/dot on the material?"
  RESPOND TYPE=command MSG="action:prompt_button Yes - Ready to Cut|_LASER_READY|primary"
  RESPOND TYPE=command MSG="action:prompt_button No - Refocus|_LASER_FOCUS|secondary"
  RESPOND TYPE=command MSG="action:prompt_button Abort|_LASER_ABORT|error"
  RESPOND TYPE=command MSG="action:prompt_show"


[gcode_macro _LASER_READY]
description: Final confirmation with a pass-count choice for thicker material, then starts the job.
gcode:
  {% set passes = printer["gcode_macro LASER_JOB_SETUP"].passes %}
  RESPOND TYPE=command MSG="action:prompt_begin Ready to Cut"
  RESPOND TYPE=command MSG="action:prompt_text Passes: {passes}. For thicker material, add passes rather than raising power."
  RESPOND TYPE=command MSG="action:prompt_button Start Job|_LASER_START|primary"
  RESPOND TYPE=command MSG="action:prompt_button Add a Pass|_LASER_SET_PASSES DELTA=1|secondary"
  RESPOND TYPE=command MSG="action:prompt_button Remove a Pass|_LASER_SET_PASSES DELTA=-1|secondary"
  RESPOND TYPE=command MSG="action:prompt_button Abort|_LASER_ABORT|error"
  RESPOND TYPE=command MSG="action:prompt_show"


[gcode_macro _LASER_SET_PASSES]
description: Adjusts the stored pass count, clamped to 1-5, then re-shows the ready prompt.
gcode:
  {% set DELTA = params.DELTA|int %}
  {% set current = printer["gcode_macro LASER_JOB_SETUP"].passes %}
  {% set new_passes = [[current + DELTA, 1]|max, 5]|min %}
  SET_GCODE_VARIABLE MACRO=LASER_JOB_SETUP VARIABLE=passes VALUE={new_passes}
  RESPOND TYPE=command MSG="action:prompt_end"
  _LASER_READY


[gcode_macro _LASER_START]
description: Starts the job file given as FILE= to LASER_JOB_SETUP. Multi-pass jobs must be built into the G-code file itself - this only records the intended count for your reference.
gcode:
  {% set passes = printer["gcode_macro LASER_JOB_SETUP"].passes %}
  RESPOND TYPE=command MSG="action:prompt_end"
  M117 Laser job starting ({passes} pass{"es" if passes > 1 else ""})...
  RESPOND TYPE=command MSG="action:notify Laser job starting"
  _START_JOB_FILE
