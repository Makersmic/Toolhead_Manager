# =====================================================================
# GUIDED FILAMENT CHANGE
# =====================================================================
# Works mid-print (pauses first) or standalone (e.g. loading filament
# on a freshly-installed BlockOne or SwitchFly toolhead). Reads the
# active toolhead/material from the same saved variables SET_PRINT
# writes, so it matches whatever job was last configured.
#
# Entry point: FILAMENT_CHANGE
# =====================================================================

[gcode_macro FILAMENT_CHANGE]
description: Guided filament change - pauses the job if printing, walks through unload/load/purge, then resumes.
variable_active: 0
gcode:
  _RHINO_NEED_PRINT_HEAD FOR=FILAMENT_CHANGE HOMED=1
  {% set was_printing = printer.print_stats.state == "printing" %}
  SAVE_VARIABLE VARIABLE=fc_was_printing VALUE={was_printing}

  {% if was_printing %}
    PAUSE
  {% endif %}

  SAVE_GCODE_STATE NAME=filament_change_state
  SET_GCODE_VARIABLE MACRO=FILAMENT_CHANGE VARIABLE=active VALUE=1

  {% set TOOLHEAD = printer.save_variables.variables.set_material_toolhead|default("BlockOne") %}
  {% set MATERIAL = printer.save_variables.variables.set_material_material|default("PLA") %}
  {% set target_temp = printer.save_variables.variables.set_material_extruder_temp|default(200)|float %}

  RESPOND TYPE=command MSG="action:prompt_begin Filament change"
  RESPOND TYPE=command MSG="action:prompt_text Toolhead: {TOOLHEAD}"
  RESPOND TYPE=command MSG="action:prompt_text Material: {MATERIAL}"
  RESPOND TYPE=command MSG="action:prompt_text Nozzle temperature: {target_temp}°C"
  {% if TOOLHEAD == "SwitchFly" %}
    {% set path = printer.save_variables.variables.set_material_extruder_index|default(0)|int %}
    RESPOND TYPE=command MSG="action:prompt_text Filament path: T{path} (the engaged path). To change the other spool, run SWITCH_T{1 - path} first."
  {% endif %}
  RESPOND TYPE=command MSG="action:prompt_button Heat and start|_FC_HEAT TOOLHEAD={TOOLHEAD} MATERIAL={MATERIAL} TEMP={target_temp}|primary"
  RESPOND TYPE=command MSG="action:prompt_button Cancel|_FC_ABORT|error"
  RESPOND TYPE=command MSG="action:prompt_show"


[gcode_macro _FC_ABORT]
description: Cancels an in-progress filament change and resumes if a print was paused for it.
gcode:
  RESPOND TYPE=command MSG="action:prompt_end"
  {% if printer["gcode_macro FILAMENT_CHANGE"].active|int == 0 %}
    RESPOND MSG="No filament change is running - nothing to cancel."
  {% else %}
    SET_GCODE_VARIABLE MACRO=FILAMENT_CHANGE VARIABLE=active VALUE=0
    RESTORE_GCODE_STATE NAME=filament_change_state
    {% if printer.save_variables.variables.fc_was_printing|default(false) %}
      M117 Filament change canceled - resuming
      RESUME
    {% else %}
      M117 Filament change canceled
    {% endif %}
  {% endif %}


[gcode_macro _FC_HEAT]
description: Heats the extruder and parks before retraction.
gcode:
  {% set TOOLHEAD = params.TOOLHEAD %}
  {% set MATERIAL = params.MATERIAL %}
  {% set TEMP = params.TEMP|float %}
  _RHINO_NEED_PRINT_HEAD FOR=FILAMENT_CHANGE HOMED=1
  RESPOND TYPE=command MSG="action:prompt_end"
  M117 Heating for filament change...
  RESPOND TYPE=command MSG="action:notify Heating to {TEMP}C for filament change"
  M109 S{TEMP}

  # Park at the same safe position used for tool swaps
  {% set park_x = printer["gcode_macro VARIABLES"].tool_swap_park_x|float %}
  {% set park_y = printer["gcode_macro VARIABLES"].tool_swap_park_y|float %}
  _RHINO_LIFT DZ=10 F=600
  G1 X{park_x} Y{park_y} F6000

  # SwitchFly: re-assert the servo on the engaged path (the servo can be out of
  # step after a restart) and re-record it, so the G0/G1 E-reversal matches the
  # path whose filament is about to be pulled/fed.
  {% if TOOLHEAD == "SwitchFly" %}
    _SWITCHFLY_SET_PATH PATH={printer.save_variables.variables.set_material_extruder_index|default(0)|int}
  {% endif %}

  _FC_RETRACT_PROMPT TOOLHEAD={TOOLHEAD} MATERIAL={MATERIAL} TEMP={TEMP}


[gcode_macro _FC_RETRACT_PROMPT]
description: Offers a short (in-hotend) or long (through-bowden) retraction distance before pulling filament.
gcode:
  {% set TOOLHEAD = params.TOOLHEAD %}
  {% set MATERIAL = params.MATERIAL %}
  {% set TEMP = params.TEMP|float %}
  RESPOND TYPE=command MSG="action:prompt_begin Retract the old filament"
  RESPOND TYPE=command MSG="action:prompt_text Choose how far to retract before pulling the filament out by hand."
  RESPOND TYPE=command MSG="action:prompt_button Short (~20mm, direct drive)|_FC_RETRACT TOOLHEAD={TOOLHEAD} MATERIAL={MATERIAL} TEMP={TEMP} DIST=20|primary"
  RESPOND TYPE=command MSG="action:prompt_button Long (~450mm, bowden)|_FC_RETRACT TOOLHEAD={TOOLHEAD} MATERIAL={MATERIAL} TEMP={TEMP} DIST=450|secondary"
  RESPOND TYPE=command MSG="action:prompt_button Cancel|_FC_ABORT|error"
  RESPOND TYPE=command MSG="action:prompt_show"


[gcode_macro _FC_RETRACT]
description: Performs the retraction, then prompts to pull the rest of the filament out by hand.
gcode:
  {% set TOOLHEAD = params.TOOLHEAD %}
  {% set MATERIAL = params.MATERIAL %}
  {% set TEMP = params.TEMP|float %}
  {% set DIST = params.DIST|float %}
  RESPOND TYPE=command MSG="action:prompt_end"
  M117 Retracting filament...
  G91
  G1 E-{DIST} F300
  G90

  RESPOND TYPE=command MSG="action:prompt_begin Remove the filament"
  RESPOND TYPE=command MSG="action:prompt_text Pull the old filament the rest of the way out by hand now."
  RESPOND TYPE=command MSG="action:prompt_button Filament is out|_FC_LOAD_PROMPT TOOLHEAD={TOOLHEAD} MATERIAL={MATERIAL} TEMP={TEMP}|primary"
  RESPOND TYPE=command MSG="action:prompt_button Cancel|_FC_ABORT|error"
  RESPOND TYPE=command MSG="action:prompt_show"


[gcode_macro _FC_LOAD_PROMPT]
description: Prompts to insert new filament into the extruder gears before loading.
gcode:
  {% set TOOLHEAD = params.TOOLHEAD %}
  {% set MATERIAL = params.MATERIAL %}
  {% set TEMP = params.TEMP|float %}
  RESPOND TYPE=command MSG="action:prompt_begin Insert the new filament"
  RESPOND TYPE=command MSG="action:prompt_text Feed the new filament into the extruder gears until it grips, then click Load."
  RESPOND TYPE=command MSG="action:prompt_button Load filament|_FC_LOAD TOOLHEAD={TOOLHEAD} MATERIAL={MATERIAL} TEMP={TEMP}|primary"
  RESPOND TYPE=command MSG="action:prompt_button Cancel|_FC_ABORT|error"
  RESPOND TYPE=command MSG="action:prompt_show"


[gcode_macro _FC_LOAD]
description: Feeds filament forward, then asks whether it's extruding cleanly.
gcode:
  {% set TOOLHEAD = params.TOOLHEAD %}
  {% set MATERIAL = params.MATERIAL %}
  {% set TEMP = params.TEMP|float %}
  RESPOND TYPE=command MSG="action:prompt_end"
  M117 Loading filament...
  {% if printer.extruder.temperature < (TEMP * 0.9) %}
    M109 S{TEMP}
  {% endif %}
  G91
  G1 E80 F300
  G90

  RESPOND TYPE=command MSG="action:prompt_begin Check extrusion"
  RESPOND TYPE=command MSG="action:prompt_text Is filament extruding cleanly from the nozzle?"
  RESPOND TYPE=command MSG="action:prompt_button Yes - purge and resume|_FC_FINISH TOOLHEAD={TOOLHEAD} MATERIAL={MATERIAL}|primary"
  RESPOND TYPE=command MSG="action:prompt_button No - feed more|_FC_LOAD TOOLHEAD={TOOLHEAD} MATERIAL={MATERIAL} TEMP={TEMP}|secondary"
  RESPOND TYPE=command MSG="action:prompt_button Cancel|_FC_ABORT|error"
  RESPOND TYPE=command MSG="action:prompt_show"


[gcode_macro _FC_FINISH]
description: Purges and resumes the print (or just reports ready if this was a standalone load).
gcode:
  {% set TOOLHEAD = params.TOOLHEAD %}
  {% set MATERIAL = params.MATERIAL %}
  RESPOND TYPE=command MSG="action:prompt_end"

  {% set NOZZLE_SIZE = printer.save_variables.variables.set_material_nozzle_size|default(0.4)|float %}
  {% set EXTRUDER = printer.save_variables.variables.set_material_extruder_index|default(0)|int %}
  PURGE TOOLHEAD="{TOOLHEAD}" MATERIAL="{MATERIAL}" NOZZLE_SIZE={NOZZLE_SIZE} EXTRUDER={EXTRUDER}

  RESTORE_GCODE_STATE NAME=filament_change_state MOVE=1 MOVE_SPEED=100
  SET_GCODE_VARIABLE MACRO=FILAMENT_CHANGE VARIABLE=active VALUE=0
  M117 Filament change complete
  RESPOND TYPE=command MSG="action:notify Filament change complete"
  LEDFLASH

  {% if printer.save_variables.variables.fc_was_printing|default(false) %}
    RESUME
  {% endif %}
