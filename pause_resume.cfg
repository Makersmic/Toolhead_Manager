# The Rhino's own PAUSE, RESUME and CANCEL_PRINT.
#
# Klipper needs three macros by these names (Moonraker's pause, resume and cancel run them), and a few helpers around
# them. They used to come from Mainsail's client.cfg, kept unchanged as client_mainsail.cfg. This file replaces it:
# the same steps in the same order with the same numbers, but only what the Rhino uses, with the Rhino's hooks called
# by name instead of through a settings macro, and the park spot read straight from myrhino/positions.cfg.
#
# Derived from mainsail-config's client.cfg (https://github.com/mainsail-crew/mainsail-config), GPL-3.0,
# Copyright (C) 2022 Alex Zellner. The structure and the idle/hot-enough logic follow that file; this one is a rewrite
# for the Rhino and is GPL-3.0-or-later like the rest of the package.
#
# Why and how: docs/proposal-own-pause-resume.md. Never include this file together with client_mainsail.cfg.
#
# The Rhino's own steps stay where they were:
#   _RHINO_PAUSE_HOOK   tools/tool_power.cfg    runs after PAUSE_BASE, BEFORE the head parks
#   _RHINO_RESUME_HOOK  tools/tool_power.cfg    runs BEFORE the head moves back (refuses non-print tools: TOOL_RESUME)
#   _RHINO_CANCEL       client_macros.cfg       runs after heaters off, before CANCEL_PRINT_BASE

[virtual_sdcard]
path: ~/printer_data/gcodes
on_error_gcode: CANCEL_PRINT

[pause_resume]
# recover_velocity: 50   (Klipper's default; mm/s for the return to the paused spot)

[display_status]

[respond]

# The numbers pause, resume and cancel use. These are the values the Rhino has always run (Mainsail's defaults).
[gcode_macro _RHINO_PAUSE_SETTINGS]
description: Pause, resume and cancel numbers: retract lengths, speeds and the lift when parking.
variable_retract: 1.0           ; mm pulled back while pausing
variable_cancel_retract: 5.0    ; mm pulled back while cancelling
variable_speed_retract: 35.0    ; mm/s
variable_unretract: 1.0         ; mm pushed back while resuming
variable_speed_unretract: 35.0  ; mm/s
variable_speed_hop: 15          ; mm/s for the lift
variable_park_dz: 2.0           ; mm lifted before the move to the park spot
gcode:

# For positions.cfg files from before 1.9.44. Their start-up step copied the park spot into _CLIENT_VARIABLE, and the
# installer keeps your own positions.cfg, so on a machine updated from an earlier release those two SET_GCODE_VARIABLE
# lines still run half a second after Klipper starts. This takes them quietly (without it each restart would print an
# error and skip the position check that follows). Nothing reads it: pause and cancel read RHINO_POSITIONS directly.
# Remove it once positions.cfg no longer has those lines.
[gcode_macro _CLIENT_VARIABLE]
description: Compatibility only: absorbs the park-spot copy made by positions.cfg files older than 1.9.44. Nothing reads it.
variable_custom_park_x: 0.0
variable_custom_park_y: 0.0
gcode:


[gcode_macro CANCEL_PRINT]
description: Cancel the running job: heaters and fan off, the Rhino's cancel steps, then Klipper's own cancel.
rename_existing: CANCEL_PRINT_BASE
gcode:
  {% set s = printer["gcode_macro _RHINO_PAUSE_SETTINGS"] %}
  _RHINO_RETRACT LENGTH={s.cancel_retract|abs}
  TURN_OFF_HEATERS
  M106 S0
  _RHINO_CANCEL
  SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=idle_state VALUE=False
  # forget any layer pause, ready for the next job
  SET_PAUSE_NEXT_LAYER ENABLE=0
  SET_PAUSE_AT_LAYER ENABLE=0 LAYER=0
  CANCEL_PRINT_BASE


[gcode_macro PAUSE]
description: Pause the running job
rename_existing: PAUSE_BASE
gcode:
  {% set temp = printer[printer.toolhead.extruder].target if printer.toolhead.extruder != '' else 0 %}
  {% set restore = printer.toolhead.extruder != '' and params.RESTORE|default(1)|int == 1 %}
  # remember the nozzle temperature, so RESUME can heat back up if the printer timed out while paused
  SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=last_extruder_temp VALUE="{{'restore': restore, 'temp': temp}}"
  PAUSE_BASE
  _RHINO_PAUSE_HOOK
  _RHINO_PAUSE_PARK {rawparams}


[gcode_macro RESUME]
description: Resume the paused job (print heads; laser, CNC, knife and added tools use TOOL_RESUME)
rename_existing: RESUME_BASE
variable_last_extruder_temp: {'restore': False, 'temp': 0}
# restore_idle_timeout stays 0: nothing sets it any more, but TOOL_RESUME still reads it
variable_restore_idle_timeout: 0
variable_idle_state: False
gcode:
  {% set velocity = printer.configfile.settings.pause_resume.recover_velocity %}
  {% set can_extrude = printer.toolhead.extruder == '' or printer[printer.toolhead.extruder].can_extrude %}
  {% set do_resume = False %}
  {% set prompt_txt = [] %}
  #### the printer timed out while paused ####
  {% if printer.idle_timeout.state|upper == "IDLE" or idle_state %}
    SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=idle_state VALUE=False
    {% if last_extruder_temp.restore %}
      RESPOND TYPE=echo MSG='{"Restoring \"%s\" temperature to %3.1f°C, this may take some time" % (printer.toolhead.extruder, last_extruder_temp.temp) }'
      M109 S{last_extruder_temp.temp}
      {% set do_resume = True %}
    {% elif can_extrude %}
      {% set do_resume = True %}
    {% else %}
      RESPOND TYPE=error MSG='{"Resume aborted !!! \"%s\" not hot enough, please heat up again and press RESUME" % printer.toolhead.extruder}'
      {% set _d = prompt_txt.append("\"%s\" not hot enough, please heat up again and press RESUME" % printer.toolhead.extruder) %}
    {% endif %}
  #### a regular pause ####
  {% elif can_extrude %}
    {% set do_resume = True %}
  {% else %}
    RESPOND TYPE=error MSG='{"Resume aborted !!! \"%s\" not hot enough, please heat up again and press RESUME" % printer.toolhead.extruder}'
    {% set _d = prompt_txt.append("\"%s\" not hot enough, please heat up again and press RESUME" % printer.toolhead.extruder) %}
  {% endif %}
  {% if do_resume %}
    _RHINO_RESUME_HOOK
    _RHINO_EXTRUDE
    RESUME_BASE VELOCITY={params.VELOCITY|default(velocity)}
  {% else %}
    RESPOND TYPE=command MSG="action:prompt_begin RESUME aborted !!!"
    {% for element in prompt_txt %}
      RESPOND TYPE=command MSG='{"action:prompt_text %s" % element}'
    {% endfor %}
    RESPOND TYPE=command MSG="action:prompt_footer_button Ok|RESPOND TYPE=command MSG=action:prompt_end|info"
    RESPOND TYPE=command MSG="action:prompt_show"
  {% endif %}


# Usage: SET_PAUSE_NEXT_LAYER [ENABLE=[0|1]] [MACRO=<name>]
[gcode_macro SET_PAUSE_NEXT_LAYER]
description: Enable a pause if the next layer is reached
gcode:
  {% set pause_next_layer = printer['gcode_macro SET_PRINT_STATS_INFO'].pause_next_layer %}
  {% set ENABLE = params.ENABLE|default(1)|int != 0 %}
  {% set MACRO = params.MACRO|default(pause_next_layer.call, True) %}
  SET_GCODE_VARIABLE MACRO=SET_PRINT_STATS_INFO VARIABLE=pause_next_layer VALUE="{{ 'enable': ENABLE, 'call': MACRO }}"


# Usage: SET_PAUSE_AT_LAYER [ENABLE=[0|1]] [LAYER=<number>] [MACRO=<name>]
[gcode_macro SET_PAUSE_AT_LAYER]
description: Enable/disable a pause if a given layer number is reached
gcode:
  {% set pause_at_layer = printer['gcode_macro SET_PRINT_STATS_INFO'].pause_at_layer %}
  {% set ENABLE = (params.ENABLE|int != 0) if params.ENABLE is defined else (params.LAYER is defined) %}
  {% set LAYER = params.LAYER|default(pause_at_layer.layer)|int %}
  {% set MACRO = params.MACRO|default(pause_at_layer.call, True) %}
  SET_GCODE_VARIABLE MACRO=SET_PRINT_STATS_INFO VARIABLE=pause_at_layer VALUE="{{ 'enable': ENABLE, 'layer': LAYER, 'call': MACRO }}"


# Slicers send SET_PRINT_STATS_INFO TOTAL_LAYER=.. CURRENT_LAYER=.. ; this adds the layer pauses in front of Klipper's own.
# Usage: SET_PRINT_STATS_INFO [TOTAL_LAYER=<total_layer_count>] [CURRENT_LAYER= <current_layer>]
[gcode_macro SET_PRINT_STATS_INFO]
rename_existing: SET_PRINT_STATS_INFO_BASE
description: Overwrite, to get pause_next_layer and pause_at_layer feature
variable_pause_next_layer: { 'enable': False, 'call': "PAUSE" }
variable_pause_at_layer  : { 'enable': False, 'layer': 0, 'call': "PAUSE" }
gcode:
  {% if pause_next_layer.enable %}
    RESPOND TYPE=echo MSG='{"%s, forced by pause_next_layer" % pause_next_layer.call}'
    {pause_next_layer.call} ; execute the given gcode to pause, should be either M600 or PAUSE
    SET_PAUSE_NEXT_LAYER ENABLE=0
  {% elif pause_at_layer.enable and params.CURRENT_LAYER is defined and params.CURRENT_LAYER|int == pause_at_layer.layer %}
    RESPOND TYPE=echo MSG='{"%s, forced by pause_at_layer [%d]" % (pause_at_layer.call, pause_at_layer.layer)}'
    {pause_at_layer.call} ; execute the given gcode to pause, should be either M600 or PAUSE
    SET_PAUSE_AT_LAYER ENABLE=0
  {% endif %}
  SET_PRINT_STATS_INFO_BASE {rawparams}


##### used by the macros above #####

[gcode_macro _RHINO_PAUSE_PARK]
description: Pull back a little, lift, then park the head at the Rhino's park spot (myrhino/positions.cfg). Used by PAUSE.
gcode:
  {% set s = printer["gcode_macro _RHINO_PAUSE_SETTINGS"] %}
  {% set pos = printer["gcode_macro RHINO_POSITIONS"] %}
  {% set velocity = printer.configfile.settings.pause_resume.recover_velocity %}
  {% set sp_hop = s.speed_hop * 60 %}
  {% set sp_move = velocity * 60 %}
  {% set origin = printer.gcode_move.homing_origin %}
  {% set act = printer.gcode_move.gcode_position %}
  {% set max = printer.toolhead.axis_maximum %}
  {% set z_min = params.Z_MIN|default(0)|float %}
  {% set z_park = [[(act.z + s.park_dz|abs), z_min]|max, (max.z - origin.z)]|min %}
  {% set x_park = params.X if params.X is defined else pos.park_x %}
  {% set y_park = params.Y if params.Y is defined else pos.park_y %}
  _RHINO_RETRACT
  {% if "xyz" in printer.toolhead.homed_axes %}
    G90
    G1 Z{z_park} F{sp_hop}
    G1 X{x_park} Y{y_park} F{sp_move}
    {% if not printer.gcode_move.absolute_coordinates %} G91 {% endif %}
  {% else %}
    RESPOND TYPE=echo MSG='Printer not homed'
  {% endif %}


[gcode_macro _RHINO_EXTRUDE]
description: Push filament (or pull it back, with a negative LENGTH) if the extruder is hot enough. RESUME uses it to unretract.
gcode:
  {% set s = printer["gcode_macro _RHINO_PAUSE_SETTINGS"] %}
  {% set length = params.LENGTH|default(s.unretract)|float %}
  {% set speed = params.SPEED|default(s.speed_unretract) %}
  {% set absolute_extrude = printer.gcode_move.absolute_extrude %}
  {% if printer.toolhead.extruder != '' %}
    {% if printer[printer.toolhead.extruder].can_extrude %}
      M83
      G1 E{length} F{(speed|float|abs) * 60}
      {% if absolute_extrude %}
        M82
      {% endif %}
    {% else %}
      RESPOND TYPE=echo MSG='{"\"%s\" not hot enough" % printer.toolhead.extruder}'
    {% endif %}
  {% endif %}


[gcode_macro _RHINO_RETRACT]
description: Pull filament back if the extruder is hot enough.
gcode:
  {% set s = printer["gcode_macro _RHINO_PAUSE_SETTINGS"] %}
  {% set length = params.LENGTH|default(s.retract)|float %}
  {% set speed = params.SPEED|default(s.speed_retract) %}
  _RHINO_EXTRUDE LENGTH=-{length|float|abs} SPEED={speed|float|abs}
