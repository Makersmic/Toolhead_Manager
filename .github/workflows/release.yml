# Build a release: rhino-config-<VERSION>.zip with Rhino Studio inside, and its SHA256, attached to a GitHub release.
# Studio's Settings > Software > Update installs the newest release from here (Tool Manager 1.5.8+).
#
# How to release:  set VERSION (and rhino/__init__.py), commit, push, then
#     git tag v1.5.8 && git push origin v1.5.8
# or run this workflow by hand (Actions > Release > Run workflow).
# STUDIO_REF says which Rhino Studio to build in (a branch or tag of Makersmic/rhino-studio; main by default).
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      studio_ref:
        description: "Rhino Studio branch or tag to build in"
        default: main

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: tm
      - uses: actions/checkout@v4
        with:
          repository: Makersmic/rhino-studio
          ref: ${{ github.event.inputs.studio_ref || 'main' }}
          path: rhino-studio
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: rhino-studio/package-lock.json
      - name: Versions agree
        run: |
          V=$(cat tm/VERSION)
          grep -q "__version__ = \"$V\"" tm/rhino/__init__.py || { echo "rhino/__init__.py doesn't say $V"; exit 1; }
          if [ "${GITHUB_REF_TYPE}" = tag ] && [ "${GITHUB_REF_NAME}" != "v$V" ]; then echo "tag ${GITHUB_REF_NAME} but VERSION is $V"; exit 1; fi
          echo "VERSION=$V" >> "$GITHUB_ENV"
      - name: Build Studio and the zip
        run: |
          (cd rhino-studio && npm ci)
          sudo apt-get install -y zip >/dev/null
          sh tm/dev/make_zip.sh "$PWD/rhino-studio"
          ( cd "$PWD" && sha256sum "rhino-config-$VERSION.zip" > "rhino-config-$VERSION.zip.sha256" )
          cat "rhino-config-$VERSION.zip.sha256"
          echo "STUDIO=$(cat tm/studio/VERSION)" >> "$GITHUB_ENV"
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes=$(awk -v v="## $VERSION" 'index($0, v) == 1 {on=1; next} on && /^## / {exit} on' tm/CHANGES.md)
          printf '%s\n\nRhino Studio %s is inside. Install: Studio > Settings > Software > Update, or drop the zip on Install from zip.\n' "$notes" "$STUDIO" > notes.md
          gh release create "v$VERSION" "rhino-config-$VERSION.zip" "rhino-config-$VERSION.zip.sha256" \
            --repo "$GITHUB_REPOSITORY" --title "Rhino Tool Manager $VERSION (Studio $STUDIO)" --notes-file notes.md \
            || gh release upload "v$VERSION" "rhino-config-$VERSION.zip" "rhino-config-$VERSION.zip.sha256" --repo "$GITHUB_REPOSITORY" --clobber
