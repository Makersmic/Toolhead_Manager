# ADD_NEW_TOOL_RESPONSE / EDIT_TOOL_RESPONSE / DELETE_TOOL_RESPONSE were removed.
# They used "action:prompt_input" (Mainsail has no text-input prompt, so the wizard
# could never advance) and RUN_SHELL_COMMAND CMD=update_toolheads (no such shell command
# was ever defined). Replaced by guided/add_toolhead.cfg: ADD_TOOLHEAD / EDIT_TOOLHEAD /
# REMOVE_TOOLHEAD / LIST_TOOLHEADS.

[gcode_macro CONFIRM_TOOL_INSTALL]
description: Guided tool swap - Stage 2: Sensor Validation & Machine Initialization
gcode:
  {% set _tm = {} %}
  {% set _ = _tm.update(printer["gcode_macro VARIABLES"].tool_mapping) %}
  {% set _ = _tm.update(printer["gcode_macro CUSTOM_TOOLS"].tool_mapping) %}
  {% set _th = {} %}
  {% set _ = _th.update(printer["gcode_macro VARIABLES"].toolheads) %}
  {% set _ = _th.update(printer["gcode_macro CUSTOM_TOOLS"].toolheads) %}
  RESPOND TYPE=command MSG="action:prompt_end"

  {% set new_tool = printer["gcode_macro SWAP_TOOL"].pending_tool|int %}
  {% set tool_mapping = _tm %}
  {% set toolheads = _th %}
  
  {% if new_tool == -1 %}
    { action_raise_error("No tool swap is currently pending.") }
  {% endif %}

  {% set new_name = tool_mapping.get(new_tool, "Unknown") %}
  {% if new_name == "Unknown" %}
    { action_raise_error("Slot " ~ new_tool ~ " is not a defined toolhead.") }
  {% endif %}
  {% set new_type = toolheads.get(new_name, {}).get("type", "UNKNOWN") %}
  {% set new_is_deposition = new_type == "DEPOSITION" %}

  {% if new_is_deposition %}
    SET_STEPPER_ENABLE STEPPER=extruder ENABLE=1
  {% endif %}

  # Check universal shared thermistor line connectivity (PF4 circuit protection)
  {% if printer.extruder.temperature < -50 or printer.extruder.temperature > 350 %}
    RESPOND TYPE=command MSG="action:prompt_begin ❌ THERMISTOR FAULT ERROR"
    RESPOND TYPE=command MSG="action:prompt_text Critical reading error detected on the shared PF4 thermistor line!"
    RESPOND TYPE=command MSG="action:prompt_text Check that your 21-pin umbilical cable is fully seated and click verify to retry."
    RESPOND TYPE=command MSG="action:prompt_button 🔄 Retry Verification|CONFIRM_TOOL_INSTALL|warning"
    RESPOND TYPE=command MSG="action:prompt_show"
    { action_raise_error("Thermistor line open or faulted. Fix umbilical connection before trying again.") }
  {% endif %}

  # Update active tracking slot indexes cleanly
  SET_GCODE_VARIABLE MACRO=SWAP_TOOL VARIABLE=current_tool VALUE={new_tool}
  SET_GCODE_VARIABLE MACRO=SWAP_TOOL VARIABLE=pending_tool VALUE=-1
  # SWAP_TOOL.current_tool is a macro variable and resets to 0 on every Klipper restart, so
  # also record it on disk (restored, after a confirmation prompt, by _RESTORE_TOOL_PROMPT).
  # Re-point the saved "last job" state at the tool that is now actually mounted, so the
  # SwitchFly E-reversal in G0/G1 can never apply to a different tool.
  SAVE_VARIABLE VARIABLE=current_tool VALUE={new_tool}
  SAVE_VARIABLE VARIABLE=set_material_toolhead VALUE="'{new_name}'"
  SAVE_VARIABLE VARIABLE=set_material_extruder_index VALUE=0

  RESTORE_GCODE_STATE NAME=tool_swap_state
  RESUME_BASE
  RESPOND MSG="✅ Physical tool change finalized. Hardware tracking updated to slot {new_tool} ({new_name})."
  # After a restart answered with "No - run the swap wizard", this is where the start-up
  # maintenance reminder gets its turn (it shows once per Klipper start, never mid-job).
  {% if printer.print_stats.state not in ["printing", "paused"] %}
    _PM_BOOT_REMINDER
  {% endif %}



[delayed_gcode TRIGGER_PHYSICAL_SWAP_PROMPT]
gcode:
  {% set _tm = {} %}
  {% set _ = _tm.update(printer["gcode_macro VARIABLES"].tool_mapping) %}
  {% set _ = _tm.update(printer["gcode_macro CUSTOM_TOOLS"].tool_mapping) %}
  {% set tool_mapping = _tm %}
  {% set current_tool = printer["gcode_macro SWAP_TOOL"].current_tool|int %}
  {% set new_tool = printer["gcode_macro SWAP_TOOL"].pending_tool|int %}
  
  {% set current_name = tool_mapping.get(current_tool, "Unknown") %}
  {% set new_name = tool_mapping.get(new_tool, "Unknown") %}

  RESPOND TYPE=command MSG="action:prompt_begin 🛑 MACHINE PAUSED - SWAP TOOLHEAD"
  RESPOND TYPE=command MSG="action:prompt_text 1. Unplug and remove old toolhead: Slot {current_tool} ({current_name})"
  RESPOND TYPE=command MSG="action:prompt_text 2. Mount and plug in umbilical for new toolhead: Slot {new_tool} ({new_name})"
  RESPOND TYPE=command MSG="action:prompt_text "
  RESPOND TYPE=command MSG="action:prompt_text 👇 Press the confirmation button below only after the new toolhead is secured."
  
  RESPOND TYPE=command MSG="action:prompt_button ✅ CONFIRM TOOL INSTALLATION|CONFIRM_TOOL_INSTALL|primary"
  # Clean, explicit user cancel button built into the hardware swap prompt loop
  RESPOND TYPE=command MSG="action:prompt_button ❌ CANCEL / ABORT SWAP|ABORT_TOOL_SWAP|error"
  RESPOND TYPE=command MSG="action:prompt_show"


[gcode_macro SWAP_TOOL]
description: Guided tool swap with graphical windowed menu and active execution protection
variable_current_tool: 0      # 👈 THE TRUE PHYSICAL SOURCE OF TRUTH TRACKER
variable_pending_tool: -1
gcode:
  {% set _tm = {} %}
  {% set _ = _tm.update(printer["gcode_macro VARIABLES"].tool_mapping) %}
  {% set _ = _tm.update(printer["gcode_macro CUSTOM_TOOLS"].tool_mapping) %}
  {% set _th = {} %}
  {% set _ = _th.update(printer["gcode_macro VARIABLES"].toolheads) %}
  {% set _ = _th.update(printer["gcode_macro CUSTOM_TOOLS"].toolheads) %}
  # Corrected to check if a file is actively running OR temporarily paused
  {% if printer.print_stats.state in ["printing", "paused"] %}
    { action_raise_error("CRITICAL SAFETY BLOCK: Tool swaps are strictly forbidden while a print job is active or paused!") }
  {% endif %}

  {% set tool_mapping = _tm %}
  {% set toolheads = _th %}
  {% set requested_tool = params.TOOL|default(-1)|int %}

  # Menu View: If no tool number was picked, show selection panel
  {% if requested_tool == -1 or requested_tool not in tool_mapping %}
    
    RESPOND TYPE=command MSG="action:prompt_begin 🔧 Select a New Toolhead"
    RESPOND TYPE=command MSG="action:prompt_text Currently Installed: Slot {current_tool} ({tool_mapping.get(current_tool, 'Unknown')})"
    RESPOND TYPE=command MSG="action:prompt_text Choose a tool below to begin the cooldown and parking sequence:"
    
    {% for slot, name in tool_mapping.items()|sort %}
      {% set t_type = toolheads.get(name, {}).get("type", "UNKNOWN") %}
      RESPOND TYPE=command MSG="action:prompt_button Slot {slot}: {name} ({t_type})|SWAP_TOOL TOOL={slot}|info"
    {% endfor %}
    
    RESPOND TYPE=command MSG="action:prompt_footer_button Cancel Tool Swap|action:prompt_end|error"
    RESPOND TYPE=command MSG="action:prompt_show"

  {% else %}
    # Execution Mode: A valid tool slot was chosen
    {% set new_tool = requested_tool %}
    {% set park_x = printer["gcode_macro VARIABLES"].tool_swap_park_x|float %}
    {% set park_y = printer["gcode_macro VARIABLES"].tool_swap_park_y|float %}
    {% set homed = printer.toolhead.homed_axes %}
    {% set z_was_safe = printer.save_variables.variables.rhino_z_safe|default(0)|int == 1 %}
    {% set cleared = params.CLEAR|default(0)|int == 1 %}

    {% set current_name = tool_mapping.get(current_tool, "") %}
    {% set current_type = toolheads.get(current_name, {}).get("type", "") %}
    {% set current_is_deposition = current_type == "DEPOSITION" %}
    {% set new_name = tool_mapping.get(new_tool, "") %}

    {% if "z" not in homed and not z_was_safe and not cleared %}
      # Z is not homed (e.g. after a restart) and the last thing Klipper saw was NOT the bed at
      # the safe park height (a job ended in an error, shutdown or power cut). Homing X/Y could
      # drag the tool across the bed or the stock, so ask the person to look first.
      RESPOND TYPE=command MSG="action:prompt_end"
      RESPOND TYPE=command MSG="action:prompt_begin Check the tool is clear of the bed"
      RESPOND TYPE=command MSG="action:prompt_text Z is not homed, and the last job did not finish with the bed at the safe park height."
      RESPOND TYPE=command MSG="action:prompt_text The swap will home X and Y only (Z is never homed here). Make sure the tool tip is well clear of the bed and any stock first."
      RESPOND TYPE=command MSG="action:prompt_button It is clear - home X/Y and continue|SWAP_TOOL TOOL={new_tool} CLEAR=1|warning"
      RESPOND TYPE=command MSG="action:prompt_footer_button Cancel|_CLOSE_PROMPT|info"
      RESPOND TYPE=command MSG="action:prompt_show"
    {% else %}
      SET_GCODE_VARIABLE MACRO=SWAP_TOOL VARIABLE=pending_tool VALUE={new_tool}

      # Safe cooldown prep
      SAVE_GCODE_STATE NAME=tool_swap_state
      M104 S0
      M140 S0
      M106 S0
      _TOOL_SAFE_OFF ; power rails off before anyone touches the umbilical

      RESPOND TYPE=command MSG="action:prompt_end"
      RESPOND TYPE=command MSG="action:prompt_begin ❄️ Cooling Down & Parking"
      RESPOND TYPE=command MSG="action:prompt_text Preparing machine for safe hot-swap. Waiting for heaters to reach 40°C..."
      RESPOND TYPE=command MSG="action:prompt_show"

      TEMPERATURE_WAIT SENSOR=extruder MAXIMUM=40
      TEMPERATURE_WAIT SENSOR=heater_bed MAXIMUM=40

      # Park. Z is NEVER homed here (homing Z drives the bed up to the tool, which crashes
      # anything that is not a print head). Z homed: lower the bed to the safe height first.
      # Z not homed: the bed is known (or confirmed) to be clear, so only X/Y are homed.
      {% if "z" in homed %}
        _RHINO_PARK
      {% endif %}
      {% if "x" not in homed or "y" not in homed %}
        G28 X Y
      {% endif %}
      G90
      G1 X{park_x} Y{park_y} F6000

      {% if current_tool != 0 and current_is_deposition %}
        SET_STEPPER_ENABLE STEPPER=extruder ENABLE=0
      {% endif %}

      RESPOND TYPE=command MSG="action:prompt_end"

      # Fire secondary window generation cleanly
      UPDATE_DELAYED_GCODE ID=TRIGGER_PHYSICAL_SWAP_PROMPT DURATION=0.1
      PAUSE_BASE
    {% endif %}
  {% endif %}

[gcode_macro ABORT_TOOL_SWAP]
description: Safely exits tool swap pause loop without saving state overrides
gcode:
  RESPOND TYPE=command MSG="action:prompt_end"
  SET_GCODE_VARIABLE MACRO=SWAP_TOOL VARIABLE=pending_tool VALUE=-1
  RESTORE_GCODE_STATE NAME=tool_swap_state
  RESUME_BASE
  RESPOND MSG="⚠️ Tool swap sequence aborted by user. Original tracking state retained."






#######################################################################
#  RESTORE LAST MOUNTED TOOL AFTER A KLIPPER RESTART
#######################################################################
# SWAP_TOOL.current_tool is the source of truth every safety gate reads, but a macro
# variable does not survive a restart (and ADD/EDIT/REMOVE_TOOLHEAD end in one), which
# left every gate failing closed until SWAP_TOOL was run again. The last mounted slot is
# now also saved on disk. It is NOT trusted blindly - tools can be swapped while Klipper
# is down - so after a restart you confirm it with one click.
[delayed_gcode _RESTORE_TOOL_PROMPT]
initial_duration: 8.0
gcode:
  RESTORE_TOOL

[gcode_macro RESTORE_TOOL]
description: After a restart, confirm which toolhead is mounted (re-arms the tool-mounted safety gates).
gcode:
  {% set saved = printer.save_variables.variables.current_tool|default(0)|int %}
  {% set now = printer["gcode_macro SWAP_TOOL"].current_tool|int %}
  {% set _tm = {} %}
  {% set _ = _tm.update(printer["gcode_macro VARIABLES"].tool_mapping) %}
  {% set _ = _tm.update(printer["gcode_macro CUSTOM_TOOLS"].tool_mapping) %}
  {% set name = _tm.get(saved, "") %}
  {% if now != 0 %}
    RESPOND MSG="Tool already tracked: slot {now} ({_tm.get(now, 'Unknown')})"
    _PM_BOOT_REMINDER
  {% elif saved == 0 or name == "" %}
    # Nothing recorded yet (first start after an install, or no swap has finished): ask.
    RESPOND TYPE=command MSG="action:prompt_begin Klipper started - which toolhead is mounted?"
    RESPOND TYPE=command MSG="action:prompt_text No toolhead has been recorded yet. Pick the one on the machine now."
    RESPOND TYPE=command MSG="action:prompt_text Tool-mounted safety gates stay locked until you choose."
    RESPOND TYPE=command MSG="action:prompt_button_group_start"
    {% for slot, n in _tm.items()|sort %}
      RESPOND TYPE=command MSG="action:prompt_button {n}|_RESTORE_TOOL_CONFIRM SLOT={slot}|primary"
    {% endfor %}
    RESPOND TYPE=command MSG="action:prompt_button_group_end"
    RESPOND TYPE=command MSG="action:prompt_footer_button Dismiss|_RESTORE_TOOL_DISMISS|info"
    RESPOND TYPE=command MSG="action:prompt_show"
  {% else %}
    RESPOND TYPE=command MSG="action:prompt_begin Klipper restarted - which toolhead is mounted?"
    RESPOND TYPE=command MSG="action:prompt_text Last recorded toolhead: slot {saved} ({name})."
    RESPOND TYPE=command MSG="action:prompt_text Tool-mounted safety gates stay locked until you confirm."
    RESPOND TYPE=command MSG="action:prompt_button Yes - {name} is mounted|_RESTORE_TOOL_CONFIRM SLOT={saved}|primary"
    RESPOND TYPE=command MSG="action:prompt_button No - run the swap wizard|START_TOOL_SWAP|warning"
    RESPOND TYPE=command MSG="action:prompt_footer_button Dismiss|_RESTORE_TOOL_DISMISS|info"
    RESPOND TYPE=command MSG="action:prompt_show"
  {% endif %}

[gcode_macro _RESTORE_TOOL_DISMISS]
description: Close the restore question without confirming a tool, then show any maintenance reminder.
gcode:
  RESPOND TYPE=command MSG="action:prompt_end"
  _PM_BOOT_REMINDER

[gcode_macro _RESTORE_TOOL_CONFIRM]
gcode:
  {% set slot = params.SLOT|int %}
  RESPOND TYPE=command MSG="action:prompt_end"
  SET_GCODE_VARIABLE MACRO=SWAP_TOOL VARIABLE=current_tool VALUE={slot}
  SAVE_VARIABLE VARIABLE=current_tool VALUE={slot}
  M117 Mounted tool confirmed: slot {slot}
  _PM_BOOT_REMINDER


#######################################################################
#  SAFE PARK HEIGHT  (crash-free start-up for every tool)
#######################################################################
# Every job end, cancel and tool swap lowers the bed to at least safe_z, which clears the
# lowest point of every tool (longest spindle bit included). A 5 s watcher records on disk
# whether the bed is at or below that height, so after a restart - when Z is not homed and
# Klipper cannot know where the bed is - SWAP_TOOL knows whether homing X/Y alone is safe.
# Z is homed only with a print head mounted; never by the swap or the laser/CNC/knife flows.
[gcode_macro _RHINO_PARK]
description: Lower the bed to the safe park height (never raises it toward the tool). Needs Z homed.
variable_safe_z: 150.0   # bed clear of every tool's lowest point (measured by Mike)
gcode:
  {% set s = printer["gcode_macro _RHINO_PARK"] %}
  {% if "z" in printer.toolhead.homed_axes %}
    {% set z = printer.toolhead.position.z %}
    {% set target = [z, s.safe_z]|max %}
    # G1 works in G-code coordinates; convert so offsets (G54, SET_GCODE_OFFSET) cannot shift it.
    {% set delta = z - printer.gcode_move.gcode_position.z %}
    SAVE_GCODE_STATE NAME=_rhino_park
    G90
    G1 Z{target - delta} F1200
    M400
    RESTORE_GCODE_STATE NAME=_rhino_park
    SAVE_VARIABLE VARIABLE=rhino_z_safe VALUE=1
  {% else %}
    RESPOND MSG="Safe park skipped: Z is not homed."
  {% endif %}

[delayed_gcode _RHINO_PARK_WATCH]
initial_duration: 5.0
gcode:
  {% if "z" in printer.toolhead.homed_axes %}
    {% set now = 1 if printer.toolhead.position.z >= printer["gcode_macro _RHINO_PARK"].safe_z - 0.01 else 0 %}
    {% if now != printer.save_variables.variables.rhino_z_safe|default(0)|int %}
      SAVE_VARIABLE VARIABLE=rhino_z_safe VALUE={now}
    {% endif %}
  {% endif %}
  UPDATE_DELAYED_GCODE ID=_RHINO_PARK_WATCH DURATION=5

[gcode_macro _RHINO_HOME_SAFE]
description: Homing for laser / CNC / drag knife / added tools: needs Z already homed; lowers the bed to the safe height, then homes only X/Y if needed.
gcode:
  {% set h = printer.toolhead.homed_axes %}
  {% if "z" not in h %}
    { action_raise_error("Z is not homed. Z is homed with a print head (BlockOne or SwitchFly) mounted - homing it with this tool could drive the bed into it. Swap to a print head, home (G28), then swap back: Z stays homed through a tool swap.") }
  {% endif %}
  {% if "x" not in h or "y" not in h %}
    _RHINO_PARK
    G28 X Y
  {% endif %}
