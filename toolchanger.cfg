# ADD_NEW_TOOL_RESPONSE / EDIT_TOOL_RESPONSE / DELETE_TOOL_RESPONSE were removed.
# They used "action:prompt_input" (Mainsail has no text-input prompt, so the wizard
# could never advance) and RUN_SHELL_COMMAND CMD=update_toolheads (no such shell command
# was ever defined). Replaced by guided/add_toolhead.cfg: ADD_TOOLHEAD / EDIT_TOOLHEAD /
# REMOVE_TOOLHEAD / LIST_TOOLHEADS.

[gcode_macro CONFIRM_TOOL_INSTALL]
description: Guided tool swap - Stage 2: Sensor Validation & Machine Initialization
gcode:
  {% set _tm = {} %}
  {% set _ = _tm.update(printer["gcode_macro VARIABLES"].tool_mapping) %}
  {% set _ = _tm.update(printer["gcode_macro CUSTOM_TOOLS"].tool_mapping) %}
  {% set _th = {} %}
  {% set _ = _th.update(printer["gcode_macro VARIABLES"].toolheads) %}
  {% set _ = _th.update(printer["gcode_macro CUSTOM_TOOLS"].toolheads) %}
  RESPOND TYPE=command MSG="action:prompt_end"

  {% set new_tool = printer["gcode_macro SWAP_TOOL"].pending_tool|int %}
  {% set tool_mapping = _tm %}
  {% set toolheads = _th %}
  
  {% if new_tool == -1 %}
    { action_raise_error("No tool swap is currently pending.") }
  {% endif %}

  {% set new_name = tool_mapping.get(new_tool, "Unknown") %}
  {% if new_name == "Unknown" %}
    { action_raise_error("Slot " ~ new_tool ~ " is not a defined toolhead.") }
  {% endif %}
  {% set new_type = toolheads.get(new_name, {}).get("type", "UNKNOWN") %}
  {% set new_is_deposition = new_type == "DEPOSITION" %}

  {% if new_is_deposition %}
    SET_STEPPER_ENABLE STEPPER=extruder ENABLE=1
  {% endif %}

  # Check universal shared thermistor line connectivity (PF4 circuit protection)
  {% if printer.extruder.temperature < -50 or printer.extruder.temperature > 350 %}
    RESPOND TYPE=command MSG="action:prompt_begin Toolhead not detected"
    RESPOND TYPE=command MSG="action:prompt_text The toolhead's thermistor (contacts 3-4) reads open."
    RESPOND TYPE=command MSG="action:prompt_text Push the umbilical connector fully home, then check again."
    RESPOND TYPE=command MSG="action:prompt_button Check again|CONFIRM_TOOL_INSTALL|warning"
    RESPOND TYPE=command MSG="action:prompt_show"
    { action_raise_error("Thermistor line open or faulted. Fix umbilical connection before trying again.") }
  {% endif %}

  # Update active tracking slot indexes cleanly
  SET_GCODE_VARIABLE MACRO=SWAP_TOOL VARIABLE=current_tool VALUE={new_tool}
  SET_GCODE_VARIABLE MACRO=SWAP_TOOL VARIABLE=pending_tool VALUE=-1
  # SWAP_TOOL.current_tool is a macro variable and resets to 0 on every Klipper restart, so
  # also record it on disk (restored, after a confirmation prompt, by _RESTORE_TOOL_PROMPT).
  # Re-point the saved "last job" state at the tool that is now actually mounted, so the
  # SwitchFly E-reversal in G0/G1 can never apply to a different tool.
  SAVE_VARIABLE VARIABLE=current_tool VALUE={new_tool}
  SAVE_VARIABLE VARIABLE=set_material_toolhead VALUE="'{new_name}'"
  SAVE_VARIABLE VARIABLE=set_material_extruder_index VALUE=0

  RESTORE_GCODE_STATE NAME=tool_swap_state
  RESUME_BASE
  RESPOND MSG="✅ Physical tool change finalized. Hardware tracking updated to slot {new_tool} ({new_name})."
  # After a restart answered with "No - run the swap wizard", this is where the start-up
  # maintenance reminder gets its turn (it shows once per Klipper start, never mid-job).
  {% if printer.print_stats.state not in ["printing", "paused"] %}
    _PM_BOOT_REMINDER
  {% endif %}



[delayed_gcode TRIGGER_PHYSICAL_SWAP_PROMPT]
gcode:
  {% set _tm = {} %}
  {% set _ = _tm.update(printer["gcode_macro VARIABLES"].tool_mapping) %}
  {% set _ = _tm.update(printer["gcode_macro CUSTOM_TOOLS"].tool_mapping) %}
  {% set tool_mapping = _tm %}
  {% set current_tool = printer["gcode_macro SWAP_TOOL"].current_tool|int %}
  {% set new_tool = printer["gcode_macro SWAP_TOOL"].pending_tool|int %}
  
  {% set current_name = tool_mapping.get(current_tool, "Unknown") %}
  {% set new_name = tool_mapping.get(new_tool, "Unknown") %}

  RESPOND TYPE=command MSG="action:prompt_begin Swap the toolhead"
  RESPOND TYPE=command MSG="action:prompt_text 1. Unplug and remove {current_name} (slot {current_tool})."
  RESPOND TYPE=command MSG="action:prompt_text 2. Mount {new_name} (slot {new_tool}) and plug in its umbilical."
  RESPOND TYPE=command MSG="action:prompt_text 3. When the bolt is tight and the umbilical is plugged in, confirm."
  
  RESPOND TYPE=command MSG="action:prompt_button Confirm - {new_name} is installed|CONFIRM_TOOL_INSTALL|primary"
  # Clean, explicit user cancel button built into the hardware swap prompt loop
  RESPOND TYPE=command MSG="action:prompt_button Cancel the swap|ABORT_TOOL_SWAP|error"
  RESPOND TYPE=command MSG="action:prompt_show"


[gcode_macro SWAP_TOOL]
description: Guided tool swap with graphical windowed menu and active execution protection
variable_current_tool: 0      # 👈 THE TRUE PHYSICAL SOURCE OF TRUTH TRACKER
variable_pending_tool: -1
gcode:
  {% set _tm = {} %}
  {% set _ = _tm.update(printer["gcode_macro VARIABLES"].tool_mapping) %}
  {% set _ = _tm.update(printer["gcode_macro CUSTOM_TOOLS"].tool_mapping) %}
  {% set _th = {} %}
  {% set _ = _th.update(printer["gcode_macro VARIABLES"].toolheads) %}
  {% set _ = _th.update(printer["gcode_macro CUSTOM_TOOLS"].toolheads) %}
  # Corrected to check if a file is actively running OR temporarily paused
  {% if printer.print_stats.state in ["printing", "paused"] %}
    { action_raise_error("CRITICAL SAFETY BLOCK: Tool swaps are strictly forbidden while a print job is active or paused!") }
  {% endif %}

  {% set tool_mapping = _tm %}
  {% set toolheads = _th %}
  {% set requested_tool = params.TOOL|default(-1)|int %}

  # Menu View: If no tool number was picked, show selection panel
  {% if requested_tool == -1 or requested_tool not in tool_mapping %}
    
    RESPOND TYPE=command MSG="action:prompt_begin Swap toolhead"
    RESPOND TYPE=command MSG="action:prompt_text Installed now: slot {current_tool} ({tool_mapping.get(current_tool, 'Unknown')})"
    RESPOND TYPE=command MSG="action:prompt_text Pick the toolhead to install. The machine cools down and lowers the bed first."
    
    {% for slot, name in tool_mapping.items()|sort %}
      {% set t_type = toolheads.get(name, {}).get("type", "UNKNOWN") %}
      RESPOND TYPE=command MSG="action:prompt_button Slot {slot}: {name} ({t_type})|SWAP_TOOL TOOL={slot}|info"
    {% endfor %}
    
    RESPOND TYPE=command MSG="action:prompt_footer_button Cancel|action:prompt_end|error"
    RESPOND TYPE=command MSG="action:prompt_show"

  {% else %}
    # Execution Mode: A valid tool slot was chosen
    {% set new_tool = requested_tool %}
    {% set park_x = printer["gcode_macro RHINO_POSITIONS"].swap_x|float %}
    {% set park_y = printer["gcode_macro RHINO_POSITIONS"].swap_y|float %}
    {% set homed = printer.toolhead.homed_axes %}
    {% set z_was_safe = printer.save_variables.variables.rhino_z_safe|default(0)|int == 1 %}
    {% set cleared = params.CLEAR|default(0)|int == 1 %}

    {% set current_name = tool_mapping.get(current_tool, "") %}
    {% set current_type = toolheads.get(current_name, {}).get("type", "") %}
    {% set current_is_deposition = current_type == "DEPOSITION" %}
    {% set new_name = tool_mapping.get(new_tool, "") %}

    {% if "z" not in homed and not z_was_safe and not cleared %}
      # Z is not homed (e.g. after a restart) and the last thing Klipper saw was NOT the bed at
      # the safe park height (a job ended in an error, shutdown or power cut). Homing X/Y could
      # drag the tool across the bed or the stock, so ask the person to look first.
      RESPOND TYPE=command MSG="action:prompt_end"
      RESPOND TYPE=command MSG="action:prompt_begin Check the tool is clear of the bed"
      RESPOND TYPE=command MSG="action:prompt_text Z is not homed, and the last job did not finish with the bed at the safe park height."
      RESPOND TYPE=command MSG="action:prompt_text The swap will home X and Y only (Z is never homed here). Make sure the tool tip is well clear of the bed and any stock first."
      RESPOND TYPE=command MSG="action:prompt_button It is clear - home X/Y and continue|SWAP_TOOL TOOL={new_tool} CLEAR=1|warning"
      RESPOND TYPE=command MSG="action:prompt_footer_button Cancel|_CLOSE_PROMPT|info"
      RESPOND TYPE=command MSG="action:prompt_show"
    {% else %}
      SET_GCODE_VARIABLE MACRO=SWAP_TOOL VARIABLE=pending_tool VALUE={new_tool}

      # Safe cooldown prep
      SAVE_GCODE_STATE NAME=tool_swap_state
      M104 S0
      M140 S0
      M106 S0
      _TOOL_SAFE_OFF ; power rails off before anyone touches the umbilical

      RESPOND TYPE=command MSG="action:prompt_end"
      RESPOND TYPE=command MSG="action:prompt_begin Cooling down"
      RESPOND TYPE=command MSG="action:prompt_text Waiting for the hotend and bed to cool below 40°C before the swap..."
      RESPOND TYPE=command MSG="action:prompt_show"

      TEMPERATURE_WAIT SENSOR=extruder MAXIMUM=40
      TEMPERATURE_WAIT SENSOR=heater_bed MAXIMUM=40

      # Park. Z is NEVER homed here (homing Z drives the bed up to the tool, which crashes
      # anything that is not a print head). Z homed: lower the bed to the safe height first.
      # Z not homed: the bed is known (or confirmed) to be clear, so only X/Y are homed.
      {% if "z" in homed %}
        _RHINO_PARK
      {% endif %}
      {% if "x" not in homed or "y" not in homed %}
        G28 X Y
      {% endif %}
      G90
      G1 X{park_x} Y{park_y} F6000

      {% if current_tool != 0 and current_is_deposition %}
        SET_STEPPER_ENABLE STEPPER=extruder ENABLE=0
      {% endif %}

      RESPOND TYPE=command MSG="action:prompt_end"

      # Fire secondary window generation cleanly
      UPDATE_DELAYED_GCODE ID=TRIGGER_PHYSICAL_SWAP_PROMPT DURATION=0.1
      PAUSE_BASE
    {% endif %}
  {% endif %}

[gcode_macro _RHINO_NEED_PRINT_HEAD]
description: Helper - stop unless a print head (BlockOne, SwitchFly or an added print head) is confirmed mounted. FOR=<command> names it in the message; HOMED=1 also needs X, Y and Z homed.
gcode:
  {% set _tm = {} %}
  {% set _ = _tm.update(printer["gcode_macro VARIABLES"].tool_mapping) %}
  {% set _ = _tm.update(printer["gcode_macro CUSTOM_TOOLS"].tool_mapping) %}
  {% set _th = {} %}
  {% set _ = _th.update(printer["gcode_macro VARIABLES"].toolheads) %}
  {% set _ = _th.update(printer["gcode_macro CUSTOM_TOOLS"].toolheads) %}
  {% set what = params.FOR|default("This") %}
  {% set name = _tm.get(printer["gcode_macro SWAP_TOOL"].current_tool|int, "") %}
  {% if name == "" %}
    { action_raise_error(what ~ ": no toolhead confirmed. Answer the 'which toolhead is mounted?' question first (or run RESTORE_TOOL).") }
  {% elif _th.get(name, {}).get("type", "") != "DEPOSITION" %}
    { action_raise_error(what ~ " is for print heads, and " ~ name ~ " is mounted - it would heat the nozzle output and move the bed toward the tool. Swap to BlockOne or SwitchFly first.") }
  {% elif params.HOMED|default(0)|int == 1 and printer.toolhead.homed_axes != "xyz" %}
    { action_raise_error(what ~ ": home the printer first (G28) - it moves to the park spot.") }
  {% endif %}

[gcode_macro _RHINO_LIFT]
description: Helper - lower the bed DZ mm (Z up, away from the tool), never past the end of Z travel. Does nothing if Z isn't homed.
gcode:
  {% set dz = params.DZ|default(10)|float %}
  {% set f = params.F|default(600)|float %}
  {% if "z" in printer.toolhead.homed_axes %}
    {% set up = [dz, printer.toolhead.axis_maximum.z - printer.toolhead.position.z]|min %}
    {% if up > 0 %}
      G91
      G1 Z{'%.3f' % up} F{f}
      G90
    {% endif %}
  {% else %}
    RESPOND MSG="Z isn't homed - the bed was not moved."
  {% endif %}

[gcode_macro G28]
description: Homing with the Rhino's rules - Z only with a print head confirmed (the probe is on the print heads); X/Y alone always. Mainsail's Home buttons come through here too.
rename_existing: G28.1
gcode:
  {% set _tm = {} %}
  {% set _ = _tm.update(printer["gcode_macro VARIABLES"].tool_mapping) %}
  {% set _ = _tm.update(printer["gcode_macro CUSTOM_TOOLS"].tool_mapping) %}
  {% set _th = {} %}
  {% set _ = _th.update(printer["gcode_macro VARIABLES"].toolheads) %}
  {% set _ = _th.update(printer["gcode_macro CUSTOM_TOOLS"].toolheads) %}
  {% set name = _tm.get(printer["gcode_macro SWAP_TOOL"].current_tool|int, "") %}
  {% set print_head = _th.get(name, {}).get("type", "") == "DEPOSITION" %}
  # "G28" homes everything; "G28 X Y" (or X, or Y) homes only those axes
  {% set want_z = params.Z is defined or not (params.X is defined or params.Y is defined) %}
  {% if want_z and not print_head %}
    {% if name == "" %}
      { action_raise_error("Homing Z needs a confirmed print head. Answer the 'which toolhead is mounted?' question first (or run RESTORE_TOOL). G28 X Y homes only X and Y.") }
    {% else %}
      { action_raise_error(name ~ " is mounted, and Z is only homed with a print head (BlockOne or SwitchFly) - the probe is on the print heads, so homing Z now would drive the bed into the tool. Use SET_Z_ZERO to set Z for this tool, or G28 X Y to home only X and Y.") }
    {% endif %}
  {% endif %}
  # Homing X/Y while Z is not homed: Klipper's [safe_z_home] first lowers the bed z_hop mm without
  # knowing where it is. If the bed's height was saved when it was parked, keep that record true.
  {% set sv = printer.save_variables.variables %}
  {% set hop = printer.configfile.settings.get("safe_z_home", {}).get("z_hop", 0)|float %}
  {% set parked = sv.rhino_z_safe|default(0)|int == 1 and sv.rhino_park_z is defined %}
  {% if not want_z and "z" not in printer.toolhead.homed_axes and parked and hop > 0 %}
    {% set new_z = sv.rhino_park_z|float + hop %}
    {% if new_z > printer.toolhead.axis_maximum.z %}
      { action_raise_error("The bed is parked within " ~ hop ~ " mm of the bottom of its travel, and homing X/Y with Z not homed would lower it that far. Run SET_Z_ZERO and answer the Bed position question - it sets Z first, so the bed doesn't move.") }
    {% endif %}
    G28.1 {rawparams}
    SAVE_VARIABLE VARIABLE=rhino_park_z VALUE={'%.3f' % new_z}
    RESPOND MSG="Z isn't homed, so homing X/Y lowered the bed {hop} mm first (Klipper's safe_z_home). Saved park height updated to {'%.3f' % new_z}."
  {% else %}
    G28.1 {rawparams}
  {% endif %}

[gcode_macro ABORT_TOOL_SWAP]
description: Safely exits tool swap pause loop without saving state overrides
gcode:
  RESPOND TYPE=command MSG="action:prompt_end"
  {% if printer["gcode_macro SWAP_TOOL"].pending_tool|int == -1 %}
    RESPOND MSG="No tool swap is running - nothing to cancel."
  {% else %}
    SET_GCODE_VARIABLE MACRO=SWAP_TOOL VARIABLE=pending_tool VALUE=-1
    RESTORE_GCODE_STATE NAME=tool_swap_state
    RESUME_BASE
    RESPOND MSG="⚠️ Tool swap sequence aborted by user. Original tracking state retained."
  {% endif %}






#######################################################################
#  RESTORE LAST MOUNTED TOOL AFTER A KLIPPER RESTART
#######################################################################
# SWAP_TOOL.current_tool is the source of truth every safety gate reads, but a macro
# variable does not survive a restart (and ADD/EDIT/REMOVE_TOOLHEAD end in one), which
# left every gate failing closed until SWAP_TOOL was run again. The last mounted slot is
# now also saved on disk. It is NOT trusted blindly - tools can be swapped while Klipper
# is down - so after a restart you confirm it with one click.
[delayed_gcode _RESTORE_TOOL_PROMPT]
initial_duration: 8.0
gcode:
  RESTORE_TOOL

[gcode_macro RESTORE_TOOL]
description: After a restart, confirm which toolhead is mounted (re-arms the tool-mounted safety gates).
gcode:
  {% set saved = printer.save_variables.variables.current_tool|default(0)|int %}
  {% set now = printer["gcode_macro SWAP_TOOL"].current_tool|int %}
  {% set _tm = {} %}
  {% set _ = _tm.update(printer["gcode_macro VARIABLES"].tool_mapping) %}
  {% set _ = _tm.update(printer["gcode_macro CUSTOM_TOOLS"].tool_mapping) %}
  {% set name = _tm.get(saved, "") %}
  {% if now != 0 %}
    RESPOND MSG="Tool already tracked: slot {now} ({_tm.get(now, 'Unknown')})"
    _PM_BOOT_REMINDER
  {% elif saved == 0 or name == "" %}
    # Nothing recorded yet (first start after an install, or no swap has finished): ask.
    RESPOND TYPE=command MSG="action:prompt_begin Klipper started - which toolhead is mounted?"
    RESPOND TYPE=command MSG="action:prompt_text No toolhead has been recorded yet. Pick the one on the machine now."
    RESPOND TYPE=command MSG="action:prompt_text Tool commands stay locked until you choose."
    RESPOND TYPE=command MSG="action:prompt_button_group_start"
    {% for slot, n in _tm.items()|sort %}
      RESPOND TYPE=command MSG="action:prompt_button {n}|_RESTORE_TOOL_CONFIRM SLOT={slot}|primary"
    {% endfor %}
    RESPOND TYPE=command MSG="action:prompt_button_group_end"
    RESPOND TYPE=command MSG="action:prompt_footer_button Dismiss|_RESTORE_TOOL_DISMISS|info"
    RESPOND TYPE=command MSG="action:prompt_show"
  {% else %}
    RESPOND TYPE=command MSG="action:prompt_begin Klipper restarted - which toolhead is mounted?"
    RESPOND TYPE=command MSG="action:prompt_text Last recorded toolhead: slot {saved} ({name})."
    RESPOND TYPE=command MSG="action:prompt_text Tool commands stay locked until you confirm."
    RESPOND TYPE=command MSG="action:prompt_button Yes - {name} is mounted|_RESTORE_TOOL_CONFIRM SLOT={saved}|primary"
    RESPOND TYPE=command MSG="action:prompt_button No - run the swap wizard|START_TOOL_SWAP|warning"
    RESPOND TYPE=command MSG="action:prompt_footer_button Dismiss|_RESTORE_TOOL_DISMISS|info"
    RESPOND TYPE=command MSG="action:prompt_show"
  {% endif %}

[gcode_macro _RESTORE_TOOL_DISMISS]
description: Close the restore question without confirming a tool, then show any maintenance reminder.
gcode:
  RESPOND TYPE=command MSG="action:prompt_end"
  _PM_BOOT_REMINDER

[gcode_macro _RESTORE_TOOL_CONFIRM]
gcode:
  {% set slot = params.SLOT|int %}
  RESPOND TYPE=command MSG="action:prompt_end"
  SET_GCODE_VARIABLE MACRO=SWAP_TOOL VARIABLE=current_tool VALUE={slot}
  SAVE_VARIABLE VARIABLE=current_tool VALUE={slot}
  M117 Mounted tool confirmed: slot {slot}
  _PM_BOOT_REMINDER


#######################################################################
#  SAFE PARK HEIGHT  (crash-free start-up for every tool)
#######################################################################
# Every job end, cancel and tool swap lowers the bed to at least safe_z (myrhino/positions.cfg), which clears the
# lowest point of every tool (longest spindle bit included). A 5 s watcher records on disk
# whether the bed is at or below that height, so after a restart - when Z is not homed and
# Klipper cannot know where the bed is - SWAP_TOOL knows whether homing X/Y alone is safe.
# Z is homed only with a print head mounted; never by the swap or the laser/CNC/knife flows.
[gcode_macro _RHINO_PARK]
description: Lower the bed to the safe park height (never raises it toward the tool). Needs Z homed.
gcode:
  {% if "z" in printer.toolhead.homed_axes %}
    {% set z = printer.toolhead.position.z %}
    {% set target = [z, printer["gcode_macro RHINO_POSITIONS"].safe_z|float]|max %}
    # G1 works in G-code coordinates; convert so offsets (G54, SET_GCODE_OFFSET) cannot shift it.
    {% set delta = z - printer.gcode_move.gcode_position.z %}
    SAVE_GCODE_STATE NAME=_rhino_park
    G90
    G1 Z{target - delta} F1200
    M400
    RESTORE_GCODE_STATE NAME=_rhino_park
    _RHINO_PARK_MARK
  {% else %}
    RESPOND MSG="Safe park skipped: Z is not homed."
  {% endif %}

[delayed_gcode _RHINO_PARK_WATCH]
initial_duration: 5.0
gcode:
  {% if "z" in printer.toolhead.homed_axes %}
    {% set sv = printer.save_variables.variables %}
    {% set z = printer.toolhead.position.z %}
    {% set now = 1 if z >= printer["gcode_macro RHINO_POSITIONS"].safe_z - 0.01 else 0 %}
    {% if now != sv.rhino_z_safe|default(0)|int %}
      SAVE_VARIABLE VARIABLE=rhino_z_safe VALUE={now}
    {% endif %}
    # keep the exact parked height, so Z can be restored after a restart (_RHINO_Z_ASK)
    {% if now and (z - sv.rhino_park_z|default(-1)|float)|abs > 0.01 %}
      SAVE_VARIABLE VARIABLE=rhino_park_z VALUE={'%.3f' % z}
    {% endif %}
  {% endif %}
  UPDATE_DELAYED_GCODE ID=_RHINO_PARK_WATCH DURATION=5

[gcode_macro _RHINO_PARK_MARK]
description: Helper - after the park move, record that the bed is parked and exactly where.
gcode:
  SAVE_VARIABLE VARIABLE=rhino_z_safe VALUE=1
  SAVE_VARIABLE VARIABLE=rhino_park_z VALUE={'%.3f' % printer.toolhead.position.z}

# SET_KINEMATIC_POSITION (used by _RHINO_Z_RESTORE to take Z from the saved park height after a
# restart) is part of Klipper's force_move module, which is off unless enabled here.
[force_move]
enable_force_move: True

[gcode_macro _RHINO_HOME_SAFE]
description: Homing for laser / CNC / drag knife / added tools. Never homes Z. If Z isn't homed but the bed was parked, asks to restore Z from the park height (RESUME=<macro> runs again after). Then lowers the bed to the safe height and homes only X/Y if needed.
gcode:
  {% set h = printer.toolhead.homed_axes %}
  {% set sv = printer.save_variables.variables %}
  {% if "z" not in h %}
    {% if sv.rhino_z_safe|default(0)|int == 1 and sv.rhino_park_z is defined %}
      # Klipper renders a whole macro before running it, so the question is shown first and the
      # stop comes from a separate macro (_TOOL_REJECT) - the caller does not carry on without Z.
      _RHINO_Z_ASK RESUME={params.RESUME|default("")}
      _TOOL_REJECT MSG="Z is not homed - answer the Bed position question to carry on."
    {% else %}
      { action_raise_error("Z is not homed, and the bed was not left parked, so its height is unknown. Z is homed with a print head (BlockOne or SwitchFly) mounted - homing it with this tool could drive the bed into it. Swap to a print head, home (G28), then swap back: Z stays homed through a tool swap.") }
    {% endif %}
  {% endif %}
  {% if "x" not in h or "y" not in h %}
    _RHINO_PARK
    G28 X Y
  {% endif %}

[gcode_macro _RHINO_Z_ASK]
description: Helper - Z isn't homed but the bed was left parked: ask before taking the saved park height as Z.
gcode:
  {% set sv = printer.save_variables.variables %}
  {% if sv.rhino_z_safe|default(0)|int == 1 and sv.rhino_park_z is defined %}
    {% set resume = params.RESUME|default("") %}
    RESPOND TYPE=command MSG="action:prompt_begin Bed position"
    RESPOND TYPE=command MSG="action:prompt_text Z isn't homed (Klipper was restarted). The bed was last parked at Z {'%.1f' % sv.rhino_park_z|float} - lowered well clear of the tool."
    RESPOND TYPE=command MSG="action:prompt_text Is the bed still down where it was parked? If it was moved by hand while the power was off, choose No."
    RESPOND TYPE=command MSG="action:prompt_button Yes - the bed is still parked|_RHINO_Z_RESTORE RESUME={resume}|primary"
    RESPOND TYPE=command MSG="action:prompt_button No - I'll home Z with a print head|_RHINO_Z_NO|error"
    RESPOND TYPE=command MSG="action:prompt_show"
  {% endif %}

[gcode_macro _RHINO_Z_RESTORE]
description: Helper - take the saved park height as Z (no movement), home X/Y, then run RESUME if given.
gcode:
  {% set sv = printer.save_variables.variables %}
  {% set h = printer.toolhead.homed_axes %}
  {% set resume = params.RESUME|default("") %}
  RESPOND TYPE=command MSG="action:prompt_end"
  {% if "z" not in h %}
    {% if sv.rhino_z_safe|default(0)|int != 1 or sv.rhino_park_z is not defined %}
      { action_raise_error("No parked bed height saved - home Z with a print head mounted.") }
    {% endif %}
    SET_KINEMATIC_POSITION Z={sv.rhino_park_z} SET_HOMED=Z
    RESPOND MSG="Z set from the park height: {sv.rhino_park_z}. X/Y home next."
    # SET_KINEMATIC_POSITION marks X/Y as homed too on older Klipper, so home them for real
    G28 X Y
  {% endif %}
  {% if resume %}
    {resume}
  {% endif %}

[gcode_macro _RHINO_Z_NO]
gcode:
  RESPOND TYPE=command MSG="action:prompt_end"
  RESPOND MSG="OK - Z stays unhomed. Swap to a print head, home (G28), then swap back: Z stays homed through a tool swap."

# =====================================================================
#  SET_Z_ZERO - set the work Z zero by eye (laser, CNC, drag knife, added tools)
# =====================================================================
[gcode_macro SET_Z_ZERO]
description: Set Z0 by eye for the laser, spindle, drag knife or an added tool - move the bed up/down, then SET. Laser - set it at the focus point.
variable_next: ''
gcode:
  {% set _tm = {} %}
  {% set _ = _tm.update(printer["gcode_macro VARIABLES"].tool_mapping) %}
  {% set _ = _tm.update(printer["gcode_macro CUSTOM_TOOLS"].tool_mapping) %}
  {% set _th = {} %}
  {% set _ = _th.update(printer["gcode_macro VARIABLES"].toolheads) %}
  {% set _ = _th.update(printer["gcode_macro CUSTOM_TOOLS"].toolheads) %}
  {% set name = _tm.get(printer["gcode_macro SWAP_TOOL"].current_tool|int, "") %}
  {% if printer.print_stats.state in ["printing", "paused"] %}
    { action_raise_error("SET_Z_ZERO: a job is running. Finish or cancel it first.") }
  {% endif %}
  {% if name == "" %}
    { action_raise_error("SET_Z_ZERO: no toolhead confirmed. Answer the 'which toolhead is mounted?' question (RESTORE_TOOL) first.") }
  {% endif %}
  {% if _th.get(name, {}).get("type", "") == "DEPOSITION" %}
    { action_raise_error("SET_Z_ZERO is for the laser, spindle, drag knife and added tools. For a print head use NOZZLE_HEIGHT_CALIBRATE.") }
  {% endif %}
  SET_GCODE_VARIABLE MACRO=SET_Z_ZERO VARIABLE=next VALUE="'{params.NEXT|default("")}'"
  _RHINO_HOME_SAFE RESUME=_SET_Z_ZERO_RESUME
  _Z_ZERO_PROMPT

[gcode_macro _SET_Z_ZERO_RESUME]
description: Helper - reopen SET_Z_ZERO after Z was restored, keeping its NEXT step.
gcode:
  SET_Z_ZERO NEXT={printer["gcode_macro SET_Z_ZERO"].next}

[gcode_macro _Z_ZERO_PROMPT]
description: The Set Z zero window (redrawn after every move).
gcode:
  {% set _tm = {} %}
  {% set _ = _tm.update(printer["gcode_macro VARIABLES"].tool_mapping) %}
  {% set _ = _tm.update(printer["gcode_macro CUSTOM_TOOLS"].tool_mapping) %}
  {% set name = _tm.get(printer["gcode_macro SWAP_TOOL"].current_tool|int, "") %}
  {% set z = printer.toolhead.position.z %}
  {% set c = printer["gcode_macro SET_Z_ZERO"] %}
  RESPOND TYPE=command MSG="action:prompt_begin Set Z zero - {name}"
  {% if name == "LightSaber" %}
    RESPOND TYPE=command MSG="action:prompt_text Move the bed until the laser is in focus on the material (smallest, sharpest dot), then press SET. Wear laser glasses before turning the focus dot on."
  {% else %}
    RESPOND TYPE=command MSG="action:prompt_text Move the bed up until the tool tip just touches the top of the material, then press SET."
  {% endif %}
  RESPOND TYPE=command MSG="action:prompt_text Bed at Z {'%.2f' % z}. Bed up moves the material toward the tool - use small steps when it gets close."
  {% if z <= printer.toolhead.axis_minimum.z|float + 0.01 %}
    RESPOND TYPE=command MSG="action:prompt_text The bed is at its highest allowed position (position_min)."
  {% elif z >= printer["gcode_macro RHINO_POSITIONS"].zero_max_z - 0.01 %}
    RESPOND TYPE=command MSG="action:prompt_text The bed is at its lowest allowed position (Z {printer['gcode_macro RHINO_POSITIONS'].zero_max_z}, set in myrhino/positions.cfg)."
  {% endif %}
  RESPOND TYPE=command MSG="action:prompt_button_group_start"
  RESPOND TYPE=command MSG="action:prompt_button Bed up 10 mm|_Z_ZERO_MOVE D=-10|warning"
  RESPOND TYPE=command MSG="action:prompt_button Bed up 1 mm|_Z_ZERO_MOVE D=-1|warning"
  RESPOND TYPE=command MSG="action:prompt_button Bed up 0.1 mm|_Z_ZERO_MOVE D=-0.1|warning"
  RESPOND TYPE=command MSG="action:prompt_button_group_end"
  RESPOND TYPE=command MSG="action:prompt_button_group_start"
  RESPOND TYPE=command MSG="action:prompt_button Bed down 10 mm|_Z_ZERO_MOVE D=10|info"
  RESPOND TYPE=command MSG="action:prompt_button Bed down 1 mm|_Z_ZERO_MOVE D=1|info"
  RESPOND TYPE=command MSG="action:prompt_button Bed down 0.1 mm|_Z_ZERO_MOVE D=0.1|info"
  RESPOND TYPE=command MSG="action:prompt_button_group_end"
  {% if name == "LightSaber" %}
    RESPOND TYPE=command MSG="action:prompt_button_group_start"
    RESPOND TYPE=command MSG="action:prompt_button Focus dot ON (1%)|_Z_ZERO_DOT ON=1|warning"
    RESPOND TYPE=command MSG="action:prompt_button Focus dot OFF|_Z_ZERO_DOT ON=0|secondary"
    RESPOND TYPE=command MSG="action:prompt_button_group_end"
  {% endif %}
  RESPOND TYPE=command MSG="action:prompt_button SET - Z zero here|_Z_ZERO_SAVE|primary"
  RESPOND TYPE=command MSG="action:prompt_footer_button Cancel|_Z_ZERO_CANCEL|error"
  RESPOND TYPE=command MSG="action:prompt_show"

[gcode_macro _Z_ZERO_MOVE]
description: Set Z zero - move the bed by D mm (negative = up toward the tool), kept inside the travel limits.
gcode:
  {% set d = params.D|float %}
  {% set z = printer.toolhead.position.z %}
  {% set zmin = printer.toolhead.axis_minimum.z|float %}
  {% set zmax = [printer.toolhead.axis_maximum.z|float, printer["gcode_macro RHINO_POSITIONS"].zero_max_z|float]|min %}
  # only ever move in the direction asked, and never past the limits
  {% if d > 0 %}
    {% set nz = [z, [z + d, zmax]|min]|max %}
  {% else %}
    {% set nz = [z, [z + d, zmin]|max]|min %}
  {% endif %}
  # leaving the park height: forget it now, not 5 s later, so a restart can't offer a stale height
  {% if nz < printer["gcode_macro RHINO_POSITIONS"].safe_z - 0.01 and printer.save_variables.variables.rhino_z_safe|default(0)|int == 1 %}
    SAVE_VARIABLE VARIABLE=rhino_z_safe VALUE=0
  {% endif %}
  # relative move by the clamped amount: work offsets cannot shift it
  SAVE_GCODE_STATE NAME=_z_zero
  G91
  G1 Z{'%.3f' % (nz - z)} F{600 if d|abs >= 5 else 300}
  M400
  RESTORE_GCODE_STATE NAME=_z_zero
  _Z_ZERO_PROMPT

[gcode_macro _Z_ZERO_DOT]
description: Set Z zero - LightSaber focus dot at 1% (ON=1) or off (ON=0).
gcode:
  {% if params.ON|default(0)|int == 1 %}
    SET_PIN PIN=LASER_INITIALIZE VALUE=1.0 PWM_CYCLE_TIME=0.0001
    SET_PIN PIN=SERVO_LASER VALUE=0.01 PWM_CYCLE_TIME=0.0001
    RESPOND MSG="Focus dot ON at 1% - laser glasses on."
  {% else %}
    SET_PIN PIN=SERVO_LASER VALUE=0.0 PWM_CYCLE_TIME=0.0001
  {% endif %}
  _Z_ZERO_PROMPT

[gcode_macro _Z_ZERO_LASER_OFF]
description: Helper - focus dot and laser rail off (LightSaber only; other tools' outputs are left alone).
gcode:
  {% set name = printer["gcode_macro VARIABLES"].tool_mapping.get(printer["gcode_macro SWAP_TOOL"].current_tool|int, "") %}
  {% if name == "LightSaber" %}
    SET_PIN PIN=SERVO_LASER VALUE=0.0 PWM_CYCLE_TIME=0.0001
    SET_PIN PIN=LASER_INITIALIZE VALUE=0.0 PWM_CYCLE_TIME=0.0001
  {% endif %}

[gcode_macro _Z_ZERO_SAVE]
description: Set Z zero - the current bed height becomes the work Z0 (no movement), then the next step runs.
gcode:
  {% set z = printer.toolhead.position.z %}
  {% set nxt = printer["gcode_macro SET_Z_ZERO"].next %}
  RESPOND TYPE=command MSG="action:prompt_end"
  _Z_ZERO_LASER_OFF
  SAVE_VARIABLE VARIABLE=cnc_g54_z VALUE={'%.3f' % z}
  SET_GCODE_OFFSET Z={'%.3f' % z}
  M117 Z zero set
  RESPOND MSG="Z zero set at bed height Z {'%.3f' % z}. G-code Z0 is now this height."
  {% if nxt %}
    {nxt}
  {% endif %}

[gcode_macro _Z_ZERO_CANCEL]
description: Set Z zero - close without changing the zero.
gcode:
  RESPOND TYPE=command MSG="action:prompt_end"
  _Z_ZERO_LASER_OFF
  RESPOND MSG="Set Z zero cancelled - the Z zero was not changed."
