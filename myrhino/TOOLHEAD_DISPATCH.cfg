#######################################################################
#  RESET STATE
#######################################################################
[gcode_macro RESET_PRINTER_STATE]
description: Reset printer state to standby
gcode:
  M117 Resetting printer state...
  RESPOND TYPE=command MSG="action:notify Resetting printer state"
  CLEAR_PAUSE
  CANCEL_PRINT_BASE
  M117 Printer in standby
  RESPOND TYPE=command MSG="action:notify Printer in standby"


#######################################################################
#  JOB START (ENTRY POINT)
#######################################################################
[gcode_macro START_JOB]
description: Prepare and start a job - Corrected logic validation tracking loop
gcode:
  {% set _tm = {} %}
  {% set _ = _tm.update(printer["gcode_macro VARIABLES"].tool_mapping) %}
  {% set _ = _tm.update(printer["gcode_macro CUSTOM_TOOLS"].tool_mapping) %}
  # 🔍 COHESIVE CHECK: READ THE ACTUAL SLOT INDEX TRACKED BY THE PHYSICAL WIZARD
  {% set physical_slot = printer["gcode_macro SWAP_TOOL"].current_tool|int %}
  {% set tool_mapping = _tm %}
  {% set physical_name = tool_mapping.get(physical_slot, "Unknown") %}
  
  # Parameters passed down directly from your OrcaSlicer profile execution call
  {% set requested_toolhead = params.TOOLHEAD|default("BlockOne") %}
  {% set MATERIAL = params.MATERIAL|default("PLA") %}
  {% set NOZZLE_SIZE = params.NOZZLE_SIZE|default(0.4)|float %}
  {% set EXTRUDER = params.EXTRUDER|default(0)|int %}

  # ====================================================================
  # 🔒 VERIFIED HARDWARE MATCH LOCKOUT GUARD
  # ====================================================================
  {% if requested_toolhead != physical_name %}
    RESPOND TYPE=error MSG="❌ HARDWARE MISMATCH SAFETY INTERCEPT!"
    RESPOND TYPE=error MSG="Sliced file demands: {requested_toolhead} | Physical Mount records: {physical_name}"
    RESPOND TYPE=error MSG="Please change tools using the SWAP_TOOL wizard before hitting print."
    { action_raise_error("Aborting job setup: Sliced file tool requirement does not match physically mounted toolhead.") }
  {% endif %}

  # Secure verification cleared, proceed with job movements safely
  G28
  SET_GCODE_VARIABLE MACRO=_START_JOB_FILE VARIABLE=file VALUE="'{params.FILE|default("")}'"

  M117 Preparing {requested_toolhead} with {MATERIAL}...
  RESPOND TYPE=command MSG="action:notify Preparing {requested_toolhead} with {MATERIAL}"

  CONFIRM_TOOLHEAD TOOLHEAD={requested_toolhead} MATERIAL={MATERIAL} NOZZLE_SIZE={NOZZLE_SIZE} EXTRUDER={EXTRUDER}

#######################################################################
#  CONFIRM TOOLHEAD (popup with auto-continue)
#######################################################################
[gcode_macro CONFIRM_TOOLHEAD]
description: Show popup confirmation. Pauses file execution if a print is already running (e.g. called from a sliced file's own start G-code), since RESPOND alone does not block - without this, the rest of the file would run unattended past an unanswered prompt.
gcode:
  {% set _th = {} %}
  {% set _ = _th.update(printer["gcode_macro VARIABLES"].toolheads) %}
  {% set _ = _th.update(printer["gcode_macro CUSTOM_TOOLS"].toolheads) %}
  {% set TOOLHEAD = params.TOOLHEAD %}
  {% set MATERIAL = params.MATERIAL %}
  {% set NOZZLE_SIZE = params.NOZZLE_SIZE %}
  {% set EXTRUDER = params.EXTRUDER %}
  {% set tool_type = _th[TOOLHEAD].type %}

  # Hold the file while the question is open. PAUSE_BASE, not PAUSE: Mainsail's PAUSE also parks the head
  # (by default at the back-right corner, X/Y max minus 5 mm), which is not wanted - nothing has printed yet.
  {% if printer.print_stats.state == "printing" and not printer.pause_resume.is_paused %}
    PAUSE_BASE
  {% endif %}

  RESPOND TYPE=command MSG="action:prompt_begin Confirm toolhead and material"
  RESPOND TYPE=command MSG="action:prompt_text Toolhead: {TOOLHEAD}"
  RESPOND TYPE=command MSG="action:prompt_text Material: {MATERIAL}"
  {% if tool_type == "DEPOSITION" %}
    RESPOND TYPE=command MSG="action:prompt_text Extruder: {EXTRUDER}"
    RESPOND TYPE=command MSG="action:prompt_text Nozzle: {NOZZLE_SIZE} mm"
 {% endif %}
  RESPOND TYPE=command MSG="action:prompt_button Proceed|_CONFIRM_TOOLHEAD_RESPONSE RESPONSE=proceed TOOLHEAD={TOOLHEAD} MATERIAL={MATERIAL} NOZZLE_SIZE={NOZZLE_SIZE} EXTRUDER={EXTRUDER}|primary"
  RESPOND TYPE=command MSG="action:prompt_button Cancel|_CONFIRM_TOOLHEAD_RESPONSE RESPONSE=cancel|error"
  RESPOND TYPE=command MSG="action:prompt_show"


[gcode_macro _CONFIRM_TOOLHEAD_RESPONSE]
description: Handle confirmation popup
gcode:
  {% set RESPONSE = params.RESPONSE %}
  {% set TOOLHEAD = params.TOOLHEAD %}
  {% set MATERIAL = params.MATERIAL %}
  {% set NOZZLE_SIZE = params.NOZZLE_SIZE %}
  {% set EXTRUDER = params.EXTRUDER %}
  RESPOND TYPE=command MSG="action:prompt_end"

  {% if RESPONSE == "proceed" %}
    M117 Proceeding with {TOOLHEAD}/{MATERIAL}
    RESPOND TYPE=command MSG="action:notify Proceeding with {TOOLHEAD}/{MATERIAL}"
    LEDFLASH
    # The file stays held (PAUSE_BASE) through the whole start sequence - including the preheat question -
    # and is released by _RHINO_JOB_GO once everything is ready.
    SET_TOOLHEAD TOOLHEAD={TOOLHEAD} MATERIAL={MATERIAL} NOZZLE_SIZE={NOZZLE_SIZE} EXTRUDER={EXTRUDER} SKIP_PROMPT=true
    START_SEQUENCE
  {% else %}
    M117 Job canceled by user
    RESPOND TYPE=command MSG="action:notify Job canceled by user"
    LEDFLASH
    {% if printer.print_stats.state == "printing" or printer.pause_resume.is_paused %}
      CANCEL_PRINT
    {% endif %}
  {% endif %}


#######################################################################
#  SEQUENCE WRAPPER (runs PreCheck, then print)
#######################################################################
[gcode_macro _START_JOB_FILE]
description: Start the job file if nothing is running. SDCARD_PRINT_FILE always needs FILENAME - there is no "current file" form - so this only calls it when a file name was given.
variable_file: ''
gcode:
  {% set f = printer["gcode_macro _START_JOB_FILE"].file %}
  # A job is starting: the bed will come up to the tool, so it is no longer at the safe park height.
  SAVE_VARIABLE VARIABLE=rhino_z_safe VALUE=0
  {% if printer.print_stats.state in ["printing", "paused"] %}
    # Job already running (started from Mainsail's Print button) - nothing to start.
    M117 Job already running
  {% elif f != "" %}
    SET_GCODE_VARIABLE MACRO=_START_JOB_FILE VARIABLE=file VALUE="''"
    SDCARD_PRINT_FILE FILENAME="{f}"
  {% else %}
    RESPOND TYPE=error MSG="Nothing was started: no job is running and no FILE was given. Start the job from Mainsail's Print button, or re-run with FILE=<name.gcode>."
  {% endif %}


[gcode_macro START_SEQUENCE]
description: Run safety/prep before file execution
gcode:
  M117 Running PreCheck...
  RESPOND TYPE=command MSG="action:notify Running PreCheck"
  # PreCheck ends by calling _RHINO_JOB_GO - straight away, or (print heads with PLA) after the preheat
  # question is answered. Klipper macros do not wait for a pop-up, so nothing may follow PreCheck here.
  PreCheck


[gcode_macro _RHINO_JOB_GO]
description: Last step of the start sequence - let the job run (release the held file, or start FILE=).
gcode:
  SAVE_VARIABLE VARIABLE=rhino_z_safe VALUE=0
  M117 Job starting...
  RESPOND TYPE=command MSG="action:notify Job starting"
  {% if printer.pause_resume.is_paused %}
    RESUME_BASE
  {% else %}
    _START_JOB_FILE
  {% endif %}


#######################################################################
#  TOOLHEAD DISPATCHER
#######################################################################
[gcode_macro SET_TOOLHEAD]
description: Setup toolhead and delegate
gcode:
  {% set _th = {} %}
  {% set _ = _th.update(printer["gcode_macro VARIABLES"].toolheads) %}
  {% set _ = _th.update(printer["gcode_macro CUSTOM_TOOLS"].toolheads) %}
  {% set TOOLHEAD = params.TOOLHEAD %}
  {% set MATERIAL = params.MATERIAL %}
  {% set NOZZLE_SIZE = params.NOZZLE_SIZE %}
  {% set EXTRUDER = params.EXTRUDER %}
  {% set tool_type = _th[TOOLHEAD].type %}

  {% if tool_type == "DEPOSITION" %}
    SET_PRINT TOOLHEAD={TOOLHEAD} MATERIAL={MATERIAL} NOZZLE_SIZE={NOZZLE_SIZE} EXTRUDER={EXTRUDER}
  {% elif tool_type == "LASER" %}
    SET_LASER TOOLHEAD={TOOLHEAD} MATERIAL={MATERIAL}
  {% elif tool_type == "CNC" %}
    SET_SPINDLE TOOLHEAD={TOOLHEAD} MATERIAL={MATERIAL}
  {% elif tool_type == "DRAG_KNIFE" %}
    SET_DRAG_KNIFE TOOLHEAD={TOOLHEAD} MATERIAL={MATERIAL}
  {% elif tool_type == "POWERED" %}
    SET_POWERED_TOOL TOOLHEAD={TOOLHEAD} MATERIAL={MATERIAL}
  {% elif tool_type == "PASSIVE" %}
    SET_PASSIVE_TOOL TOOLHEAD={TOOLHEAD} MATERIAL={MATERIAL}
  {% else %}
    RESPOND TYPE=error MSG="Unsupported tool type: {tool_type}"
    { action_raise_error("Unsupported tool type: " ~ tool_type) }
  {% endif %}


#######################################################################
#  DEPOSITION TOOL
#######################################################################
[gcode_macro SET_PRINT]
description: Configure deposition (extruder-based) toolhead with acceleration, square corner velocity, and Z-offset
gcode:
  {% set _th = {} %}
  {% set _ = _th.update(printer["gcode_macro VARIABLES"].toolheads) %}
  {% set _ = _th.update(printer["gcode_macro CUSTOM_TOOLS"].toolheads) %}
  {% set TOOLHEAD = params.TOOLHEAD|default("BlockOne") %}
  {% set MATERIAL = params.MATERIAL|default("PLA") %}
  {% set NOZZLE_SIZE = params.NOZZLE_SIZE|default(0.4)|float %}
  {% set EXTRUDER = params.EXTRUDER|default(0)|int %}

  # Validate toolhead exists
  {% if TOOLHEAD not in _th %}
    RESPOND TYPE=error MSG="Toolhead {TOOLHEAD} not defined in VARIABLES"
    { action_raise_error("Toolhead " ~ TOOLHEAD ~ " not defined in VARIABLES") }
  {% endif %}

  {% set toolhead_data = _th[TOOLHEAD] %}
  {% set extruder_count = toolhead_data.extruder_count|default(1)|int %}

  # Construct material key based on extruder count
  {% set NOZZLE_SIZE_STR = "0_4" if NOZZLE_SIZE|float == 0.4 else "0_8" if NOZZLE_SIZE|float == 0.8 else NOZZLE_SIZE|replace(".", "_") %}
  {% set material_key = MATERIAL ~ "_" ~ NOZZLE_SIZE_STR %}
  {% if extruder_count > 1 %}
    {% set material_key = material_key ~ "_T" ~ EXTRUDER %}
  {% endif %}

  # Validate material exists
  {% if 'materials' in toolhead_data and material_key in toolhead_data.materials %}
    {% set mat_settings = toolhead_data.materials[material_key] %}
    # Save material settings to variables.cfg
    SAVE_VARIABLE VARIABLE=set_material_toolhead VALUE="'{TOOLHEAD}'"
    SAVE_VARIABLE VARIABLE=set_material_material VALUE="'{MATERIAL}'"
    SAVE_VARIABLE VARIABLE=set_material_nozzle_size VALUE={NOZZLE_SIZE}
    SAVE_VARIABLE VARIABLE=set_material_extruder_index VALUE={EXTRUDER}
    SAVE_VARIABLE VARIABLE=set_material_bed_temp VALUE={mat_settings.bed_temp|default(60)}
    SAVE_VARIABLE VARIABLE=set_material_extruder_temp VALUE={mat_settings.extruder_temp|default(200)}

    # Set acceleration
    {% set acceleration = mat_settings.accel|default(1000)|float %}
    SET_VELOCITY_LIMIT ACCEL={acceleration}
    RESPOND TYPE=command MSG="SET_PRINT: Set acceleration to {acceleration} mm/s^2 for {TOOLHEAD}/{material_key}"

    # Set square corner velocity
    {% set square_corner_velocity = mat_settings.square_corner_velocity|default(5)|float %}
    SET_VELOCITY_LIMIT SQUARE_CORNER_VELOCITY={square_corner_velocity}
    RESPOND TYPE=command MSG="SET_PRINT: Set square corner velocity to {square_corner_velocity} mm/s for {TOOLHEAD}/{material_key}"

    # Z offset: this head's paper test (NOZZLE_HEIGHT_CALIBRATE) plus any per-material fine-tune
    SET_GCODE_OFFSET X=0 Y=0 ; a CNC / knife / added-tool work zero must not shift a print
    _RHINO_APPLY_Z TOOLHEAD={TOOLHEAD} KEY={material_key}

    M117 {TOOLHEAD}/{MATERIAL} ready
  {% else %}
    RESPOND TYPE=error MSG="Material {material_key} not defined for toolhead {TOOLHEAD}"
    { action_raise_error("Material " ~ material_key ~ " not defined for toolhead " ~ TOOLHEAD) }
  {% endif %}



#######################################################################
#  LASER TOOL
#######################################################################
[gcode_macro SET_LASER]
description: Configure laser toolhead - feed rate, power, accel, Z-offset from variables.cfg
gcode:
  {% set _th = {} %}
  {% set _ = _th.update(printer["gcode_macro VARIABLES"].toolheads) %}
  {% set _ = _th.update(printer["gcode_macro CUSTOM_TOOLS"].toolheads) %}
  {% set TOOLHEAD = params.TOOLHEAD %}
  {% set MATERIAL = params.MATERIAL %}

  {% if TOOLHEAD not in _th %}
    RESPOND TYPE=error MSG="Toolhead {TOOLHEAD} not defined in VARIABLES"
    { action_raise_error("Toolhead " ~ TOOLHEAD ~ " not defined in VARIABLES") }
  {% endif %}
  {% set toolhead_data = _th[TOOLHEAD] %}
  {% if 'materials' not in toolhead_data or MATERIAL not in toolhead_data.materials %}
    RESPOND TYPE=error MSG="Material {MATERIAL} not defined for toolhead {TOOLHEAD}"
    { action_raise_error("Material " ~ MATERIAL ~ " not defined for toolhead " ~ TOOLHEAD) }
  {% endif %}
  {% set mat = toolhead_data.materials[MATERIAL] %}

  SAVE_VARIABLE VARIABLE=set_material_toolhead VALUE="'{TOOLHEAD}'"
  SAVE_VARIABLE VARIABLE=set_material_material VALUE="'{MATERIAL}'"
  SAVE_VARIABLE VARIABLE=set_material_laser_power VALUE={mat.laser_power|default(0.5)}
  SAVE_VARIABLE VARIABLE=set_material_feed_rate VALUE={mat.feed_rate|default(600)}

  {% set accel = mat.accel|default(1000)|float %}
  SET_VELOCITY_LIMIT ACCEL={accel}
  {% set scv = mat.square_corner_velocity|default(5)|float %}
  SET_VELOCITY_LIMIT SQUARE_CORNER_VELOCITY={scv}
  # Z work zero is set by eye with SET_Z_ZERO before the job - left alone here, so a job's own
  # START_JOB line (or choosing the material again) cannot wipe it.

  # Ensure the laser is off and at a safe starting power - the job's
  # own G-code (M3/M4 SPower) sets the working power once cutting/
  # engraving actually starts.
  M5

  M117 {TOOLHEAD}/{MATERIAL} ready - power {mat.laser_power|default(0.5)}, feed {mat.feed_rate|default(600)} mm/min
  RESPOND TYPE=command MSG="action:notify {TOOLHEAD}/{MATERIAL} ready (laser)"


#######################################################################
#  SPINDLE (CNC) TOOL
#######################################################################
[gcode_macro SET_SPINDLE]
description: Configure spindle toolhead - feed rate, spindle speed, accel, Z-offset from variables.cfg
gcode:
  {% set _th = {} %}
  {% set _ = _th.update(printer["gcode_macro VARIABLES"].toolheads) %}
  {% set _ = _th.update(printer["gcode_macro CUSTOM_TOOLS"].toolheads) %}
  {% set TOOLHEAD = params.TOOLHEAD %}
  {% set MATERIAL = params.MATERIAL %}

  {% if TOOLHEAD not in _th %}
    RESPOND TYPE=error MSG="Toolhead {TOOLHEAD} not defined in VARIABLES"
    { action_raise_error("Toolhead " ~ TOOLHEAD ~ " not defined in VARIABLES") }
  {% endif %}
  {% set toolhead_data = _th[TOOLHEAD] %}
  {% if 'materials' not in toolhead_data or MATERIAL not in toolhead_data.materials %}
    RESPOND TYPE=error MSG="Material {MATERIAL} not defined for toolhead {TOOLHEAD}"
    { action_raise_error("Material " ~ MATERIAL ~ " not defined for toolhead " ~ TOOLHEAD) }
  {% endif %}
  {% set mat = toolhead_data.materials[MATERIAL] %}

  SAVE_VARIABLE VARIABLE=set_material_toolhead VALUE="'{TOOLHEAD}'"
  SAVE_VARIABLE VARIABLE=set_material_material VALUE="'{MATERIAL}'"
  SAVE_VARIABLE VARIABLE=set_material_spindle_speed VALUE={mat.spindle_speed|default(10000)}
  SAVE_VARIABLE VARIABLE=set_material_feed_rate VALUE={mat.feed_rate|default(500)}

  {% set accel = mat.accel|default(800)|float %}
  SET_VELOCITY_LIMIT ACCEL={accel}
  {% set scv = mat.square_corner_velocity|default(5)|float %}
  SET_VELOCITY_LIMIT SQUARE_CORNER_VELOCITY={scv}
  # Z work zero is set by eye with SET_Z_ZERO before the job - left alone here, so a job's own
  # START_JOB line (or choosing the material again) cannot wipe it.

  # Ensure spindle is stopped - CNC_JOB_SETUP handles the guided
  # warmup/ramp-up once workholding and work-zero are confirmed.
  Spindle_DEACTIVATE

  M117 {TOOLHEAD}/{MATERIAL} ready - {mat.spindle_speed|default(10000)} RPM, feed {mat.feed_rate|default(500)} mm/min
  RESPOND TYPE=command MSG="action:notify {TOOLHEAD}/{MATERIAL} ready (spindle)"


#######################################################################
#  DRAG KNIFE TOOL
#######################################################################
[gcode_macro SET_DRAG_KNIFE]
description: Configure drag-knife toolhead - feed rate, blade pressure, accel, Z-offset from variables.cfg
gcode:
  {% set _th = {} %}
  {% set _ = _th.update(printer["gcode_macro VARIABLES"].toolheads) %}
  {% set _ = _th.update(printer["gcode_macro CUSTOM_TOOLS"].toolheads) %}
  {% set TOOLHEAD = params.TOOLHEAD %}
  {% set MATERIAL = params.MATERIAL %}

  {% if TOOLHEAD not in _th %}
    RESPOND TYPE=error MSG="Toolhead {TOOLHEAD} not defined in VARIABLES"
    { action_raise_error("Toolhead " ~ TOOLHEAD ~ " not defined in VARIABLES") }
  {% endif %}
  {% set toolhead_data = _th[TOOLHEAD] %}
  {% if 'materials' not in toolhead_data or MATERIAL not in toolhead_data.materials %}
    RESPOND TYPE=error MSG="Material {MATERIAL} not defined for toolhead {TOOLHEAD}"
    { action_raise_error("Material " ~ MATERIAL ~ " not defined for toolhead " ~ TOOLHEAD) }
  {% endif %}
  {% set mat = toolhead_data.materials[MATERIAL] %}

  SAVE_VARIABLE VARIABLE=set_material_toolhead VALUE="'{TOOLHEAD}'"
  SAVE_VARIABLE VARIABLE=set_material_material VALUE="'{MATERIAL}'"
  SAVE_VARIABLE VARIABLE=set_material_blade_pressure VALUE={mat.pressure|default(150)}
  SAVE_VARIABLE VARIABLE=set_material_feed_rate VALUE={mat.feed_rate|default(800)}

  {% set accel = mat.accel|default(1200)|float %}
  SET_VELOCITY_LIMIT ACCEL={accel}
  {% set scv = mat.square_corner_velocity|default(5)|float %}
  SET_VELOCITY_LIMIT SQUARE_CORNER_VELOCITY={scv}
  # Z work zero is set by eye with SET_Z_ZERO before the job - left alone here, so a job's own
  # START_JOB line (or choosing the material again) cannot wipe it.

  M117 {TOOLHEAD}/{MATERIAL} ready - {mat.pressure|default(150)}g pressure, feed {mat.feed_rate|default(800)} mm/min
  RESPOND TYPE=command MSG="action:notify {TOOLHEAD}/{MATERIAL} ready (drag knife)"


#######################################################################
#  PRECHECK
#######################################################################
[gcode_macro PreCheck]
description: Safety checks before job
gcode:
  {% set _th = {} %}
  {% set _ = _th.update(printer["gcode_macro VARIABLES"].toolheads) %}
  {% set _ = _th.update(printer["gcode_macro CUSTOM_TOOLS"].toolheads) %}
  {% set TOOLHEAD = printer.save_variables.variables.set_material_toolhead %}
  {% set MATERIAL = printer.save_variables.variables.set_material_material %}
  {% set NOZZLE_SIZE = printer.save_variables.variables.set_material_nozzle_size|default(0.4)|float %}
  {% set EXTRUDER = printer.save_variables.variables.set_material_extruder_index|default(0)|int %}
  {% set tool_type = _th[TOOLHEAD].type %}

  SET_STEPPER_PARAMETERS

  {% if tool_type == "DEPOSITION" %}
    PREHEAT CONTINUE=1    ; heats (after the PLA bed question, if asked), then PRIME_LINE and _RHINO_JOB_GO
  {% elif tool_type == "LASER" %}
    M5
  {% elif tool_type == "CNC" %}
    M5
  {% elif tool_type == "DRAG_KNIFE" %}
    # nothing to switch off; the Z zero set with SET_Z_ZERO stays
  {% elif tool_type == "POWERED" %}
    M5
  {% endif %}
  {% if tool_type != "DEPOSITION" %}
    _RHINO_JOB_GO
  {% endif %}


[gcode_macro SET_STEPPER_PARAMETERS]
description: Set TMC stepper currents for the toolhead/material (any tool type, built-in or user-added)
gcode:
  {% set _th = {} %}
  {% set _ = _th.update(printer["gcode_macro VARIABLES"].toolheads) %}
  {% set _ = _th.update(printer["gcode_macro CUSTOM_TOOLS"].toolheads) %}
  {% set sv = printer.save_variables.variables %}

  {% set MATERIAL = params.MATERIAL|default(sv.set_material_material|default("PLA"))|string %}
  {% set TOOLHEAD = params.TOOLHEAD|default(sv.set_material_toolhead|default("BlockOne"))|string %}
  {% set NOZZLE_SIZE = params.NOZZLE_SIZE|default(sv.set_material_nozzle_size|default(0.4))|float %}
  {% set EXTRUDER = params.EXTRUDER|default(sv.set_material_extruder_index|default(0))|int %}

  {% if TOOLHEAD not in _th %}
    { action_raise_error("SET_STEPPER_PARAMETERS: toolhead " ~ TOOLHEAD ~ " not found") }
  {% endif %}
  {% set tool = _th[TOOLHEAD] %}
  {% set tool_type = tool.type %}

  # Only deposition tools key their materials by nozzle size (PLA_0_4, PETG_0_8_T1, ...).
  # Laser / CNC / drag-knife / user-added powered and passive tools key by the bare material
  # name. The old code applied the deposition key to every tool, so PreCheck failed for them.
  {% if tool_type == "DEPOSITION" %}
    {% set material_key = MATERIAL ~ "_" ~ (NOZZLE_SIZE|string|replace(".", "_")) %}
    {% if tool.extruder_count|default(1)|int > 1 %}
      {% if EXTRUDER >= tool.extruder_count|int %}
        { action_raise_error("SET_STEPPER_PARAMETERS: invalid extruder " ~ EXTRUDER ~ " for " ~ TOOLHEAD) }
      {% endif %}
      {% set material_key = material_key ~ "_T" ~ EXTRUDER %}
    {% endif %}
  {% else %}
    {% set material_key = MATERIAL %}
  {% endif %}

  {% if material_key not in tool.materials %}
    { action_raise_error("SET_STEPPER_PARAMETERS: material " ~ material_key ~ " not defined for " ~ TOOLHEAD) }
  {% endif %}
  {% set mat = tool.materials[material_key] %}

  SET_TMC_CURRENT STEPPER=stepper_x CURRENT={mat.stepper_x_current|float}
  SET_TMC_CURRENT STEPPER=stepper_y CURRENT={mat.stepper_y_current|float}
  SET_TMC_CURRENT STEPPER=stepper_z CURRENT={mat.stepper_z_current|float}

  {% if tool_type == "DEPOSITION" %}
    SET_TMC_CURRENT STEPPER=extruder CURRENT={mat.extruder_current|float}
    RESPOND TYPE=command MSG="SET_STEPPER_PARAMETERS: Extruder={mat.extruder_current|float}"
  {% endif %}

  M117 Stepper currents set for {TOOLHEAD}/{material_key}
  RESPOND TYPE=command MSG="action:notify Stepper currents set for {TOOLHEAD}/{material_key}"


#######################################################################
#  PREHEAT
#######################################################################
[gcode_macro PREHEAT]
description: Preheat sequence with PLA bed-bypass option (CONTINUE=1 from the job start: then prime line and start the job)
gcode:
  {% set cont = params.CONTINUE|default(0)|int %}
  {% set bed_temp = printer.save_variables.variables.set_material_bed_temp|default(60)|float %}
  {% set MATERIAL = printer.save_variables.variables.set_material_material|default("PLA") %}
  {% set TOOLHEAD = printer.save_variables.variables.set_material_toolhead|default("BlockOne") %}

  # Check if the active material is PLA to determine if we show the option
  {% if MATERIAL|upper == "PLA" %}
    RESPOND TYPE=command MSG="action:prompt_begin PLA - heat the bed?"
    RESPOND TYPE=command MSG="action:prompt_text This job is PLA."
    RESPOND TYPE=command MSG="action:prompt_text Heat the bed to {bed_temp}°C, or print on a cold bed?"
    
    # Buttons to route the decision to Stage 2
    RESPOND TYPE=command MSG="action:prompt_button Heat the bed|_PREHEAT_STAGE2 BYPASS_BED=0 CONTINUE={cont}|primary"
    RESPOND TYPE=command MSG="action:prompt_button Bypass - cold bed|_PREHEAT_STAGE2 BYPASS_BED=1 CONTINUE={cont}|warning"
    RESPOND TYPE=command MSG="action:prompt_show"
    # Hold the file until a button is pressed (it is usually already held by the start question).
    # Nothing else runs meanwhile: the rest of the start sequence continues from _PREHEAT_STAGE2.
    {% if printer.print_stats.state == "printing" and not printer.pause_resume.is_paused %}
      PAUSE_BASE
    {% endif %}
  {% else %}
    # If it's NOT PLA, bypass the screen prompt entirely and heat normally
    _PREHEAT_STAGE2 BYPASS_BED=0 CONTINUE={cont}
  {% endif %}

[gcode_macro _PREHEAT_STAGE2]
description: Internal execution for preheat routine
gcode:
  RESPOND TYPE=command MSG="action:prompt_end"
  
  {% set bypass_bed = params.BYPASS_BED|default(0)|int %}
  {% set MATERIAL = printer.save_variables.variables.set_material_material|default("PLA") %}
  {% set TOOLHEAD = printer.save_variables.variables.set_material_toolhead|default("BlockOne") %}
  {% set current_bed_temp = printer.heater_bed.temperature|default(20)|float %}
  {% set extruder_temp = printer.save_variables.variables.set_material_extruder_temp|default(200)|float %}

  # Calculate target bed temperature based on user selection
  {% if bypass_bed == 1 %}
    {% set bed_temp = 0.0 %}
    RESPOND MSG="❄️ PLA Bed heating bypassed by user request."
  {% else %}
    {% set bed_temp = printer.save_variables.variables.set_material_bed_temp|default(60)|float %}
  {% endif %}

  M117 Preheating...
  RESPOND TYPE=command MSG="action:notify Preheating {TOOLHEAD} for {MATERIAL}"

  # Heat extruder immediately
  M109 S{extruder_temp}

  # Only run the heatsoak if bed heating is NOT bypassed AND current bed temperature is low
  {% if bypass_bed == 0 and current_bed_temp < 65 %}
    M117 Heatsoak at 65°C for 2 minutes
    RESPOND TYPE=command MSG="action:notify Heatsoak at 65°C for 2 minutes"
    M190 S65  
    G4 P120000  

    M117 Heatsoak at 80°C for 2 minutes
    RESPOND TYPE=command MSG="action:notify Heatsoak at 80°C for 2 minutes"
    M190 S80  
    G4 P120000      
    
    M117 Heatsoak at {bed_temp} for 1 minute.
    RESPOND TYPE=command MSG="action:notify Heatsoak at {bed_temp} for 1 minute."
    M190 S{bed_temp}
    G4 P60000  
    M117 Heatsoak complete. Calibrating Z-tilt...
    RESPOND TYPE=command MSG="action:notify Heatsoak complete. Calibrating Z-tilt"
    Z_TILT_ADJUST
  {% endif %}

  # Commit final bed temperature target (will be 0 if bypassed, or your normal temp)
  M190 S{bed_temp}

  M117 {TOOLHEAD} Preheat complete
  RESPOND TYPE=command MSG="action:notify {TOOLHEAD} Preheat complete"

  # Part of a job start: prime, then let the job run
  {% if params.CONTINUE|default(0)|int == 1 %}
    PRIME_LINE
    _RHINO_JOB_GO
  {% endif %}
  
  RESUME_BASE # Unfreeze the print job queue to seamlessly start printing

#######################################################################
#  JOB END
#######################################################################
[gcode_macro END_PRINT]
description: End job safely - shuts down whichever tool is active (deposition/laser/CNC/drag knife), not just heaters.
gcode:
  {% set _th = {} %}
  {% set _ = _th.update(printer["gcode_macro VARIABLES"].toolheads) %}
  {% set _ = _th.update(printer["gcode_macro CUSTOM_TOOLS"].toolheads) %}
  {% set TOOLHEAD = printer.save_variables.variables.set_material_toolhead|default("BlockOne") %}
  {% set tool_type = _th.get(TOOLHEAD, {}).get("type", "DEPOSITION") %}

  {% if tool_type == "DEPOSITION" %}
    M104 S0
    BED_COOLDOWN
    M107
  {% elif tool_type == "LASER" %}
    M5
    DEACTIVATE_LASER
  {% elif tool_type == "CNC" %}
    Spindle_DEACTIVATE
  {% elif tool_type == "DRAG_KNIFE" %}
    # No heater/spindle/laser to stop - just clear Z-offset below.
  {% elif tool_type == "POWERED" %}
    _TOOL_SAFE_OFF
    # TOOL_JOB_SETUP zeroes X/Y for custom tools; put the work offset back before the park move.
    SET_GCODE_OFFSET X=0 Y=0
  {% elif tool_type == "PASSIVE" %}
    SET_GCODE_OFFSET X=0 Y=0
  {% endif %}

  SET_GCODE_OFFSET X=0 Y=0 Z=0 ; every tool: no work offset carries into the next job
  _RHINO_PARK ; bed down to the safe park height, so a restart can always home X/Y safely
  G90
  G1 X0 Y200 F6000
  {% if tool_type == "DEPOSITION" %}
    M84
  {% endif %}
  M117 Job finished
  RESPOND TYPE=command MSG="action:notify Job finished"
  RESET_PRINTER_STATE

  # ====================================================================
  # 👉 DESIGNER AUTOMATED BACKUP TRIGGER (ADDED HERE)
  # ====================================================================
  # Check total time spent executing the print job (measured in seconds)
  {% set total_seconds = printer.print_stats.total_duration|float %}
  
  # 2 Hours = 7200 Seconds
  {% if total_seconds >= 7200 %}
    RESPOND MSG="📊 Print time exceeded 2 hours ({ (total_seconds / 3600)|round(2) } hrs). Launching automatic metric backup..."
    BACKUP_CONFIG
  {% else %}
    RESPOND MSG="📊 Print job completed under 2 hours ({ (total_seconds / 60)|round(1) } mins). Skipping scheduled backup."
  {% endif %}
