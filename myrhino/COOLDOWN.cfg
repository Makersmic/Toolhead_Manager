# =====================================================================
# MATERIAL-AWARE STAGED BED COOLDOWN
# =====================================================================
# END_PRINT used to switch the bed heater off at once (M140 S0). This steps
# the bed SETPOINT down instead, so the glass follows a staircase rather than
# being left to fall as fast as it can. The stages come from
# variable_bed_cooldown in variables.cfg (per material family):
#   step    degrees C the setpoint drops per stage (0 = heater off immediately)
#   dwell   seconds between stages
#   release temperature at which the heater is finally switched off
# ABS/ASA use the same 10C / 3 min / 50C staircase as the old ABSOFF macro.
# PETG/DEFAULT values are STARTING POINTS - tune them on your own bed.
#
# Non-blocking: END_PRINT returns immediately and a delayed_gcode walks the
# stages in the background, so the printer is not held "printing" for 15 min.
# The ramp stands down by itself if a new job starts or the bed target is
# changed by anything else.
#
# NOTE: Klipper's default [idle_timeout] (600 s) calls TURN_OFF_HEATERS, which
# ends a ramp longer than 10 minutes early. Add  [idle_timeout] timeout: 1800
# to printer.cfg if you want the full ABS/ASA ramp (your call - it also keeps
# heaters on longer after any idle preheat).
# =====================================================================

[gcode_macro _BED_COOLDOWN_STATE]
description: State holder for an in-progress bed cooldown ramp (do not run).
variable_last_target: 0.0
variable_step: 10.0
variable_dwell: 120
variable_release: 40.0
gcode:
  RESPOND MSG="_BED_COOLDOWN_STATE only holds state - use BED_COOLDOWN"


[gcode_macro BED_COOLDOWN]
description: Staged, material-aware bed cooldown (non-blocking). Optional MATERIAL=PETG to override the saved material.
gcode:
  {% set material = (params.MATERIAL|default(printer.save_variables.variables.set_material_material|default("PLA")))|string|upper %}
  {% set table = printer["gcode_macro VARIABLES"].bed_cooldown %}
  {% set prof = table.get(material, table["DEFAULT"]) %}
  {% set current = printer.heater_bed.target|float %}
  {% set step = prof.step|float %}
  {% set release = prof.release|float %}
  {% if step <= 0 or current <= release %}
    M140 S0
    RESPOND MSG="Bed cooldown ({material}): heater off, no ramp needed"
  {% else %}
    {% set first = [current - step, release]|max %}
    M140 S{first}
    SET_GCODE_VARIABLE MACRO=_BED_COOLDOWN_STATE VARIABLE=last_target VALUE={first}
    SET_GCODE_VARIABLE MACRO=_BED_COOLDOWN_STATE VARIABLE=step VALUE={step}
    SET_GCODE_VARIABLE MACRO=_BED_COOLDOWN_STATE VARIABLE=dwell VALUE={prof.dwell|int}
    SET_GCODE_VARIABLE MACRO=_BED_COOLDOWN_STATE VARIABLE=release VALUE={release}
    UPDATE_DELAYED_GCODE ID=BED_COOLDOWN_TICK DURATION={prof.dwell|int}
    RESPOND MSG="Bed cooldown ({material}): {current} -> {first} C, then -{step} C every {prof.dwell|int} s until {release} C"
  {% endif %}


[delayed_gcode BED_COOLDOWN_TICK]
gcode:
  {% set s = printer["gcode_macro _BED_COOLDOWN_STATE"] %}
  {% set target = printer.heater_bed.target|float %}
  {% if printer.print_stats.state in ["printing", "paused"] or (target - s.last_target)|abs > 0.5 %}
    RESPOND MSG="Bed cooldown ramp stopped - a job started or the bed target was changed elsewhere"
  {% elif target <= s.release %}
    M140 S0
    RESPOND MSG="Bed cooldown complete - heater off"
  {% else %}
    {% set nxt = [target - s.step, s.release]|max %}
    M140 S{nxt}
    SET_GCODE_VARIABLE MACRO=_BED_COOLDOWN_STATE VARIABLE=last_target VALUE={nxt}
    UPDATE_DELAYED_GCODE ID=BED_COOLDOWN_TICK DURATION={s.dwell|int}
  {% endif %}
