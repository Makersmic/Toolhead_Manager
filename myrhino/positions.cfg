# =====================================================================================
#  THE RHINO'S POSITIONS - the one place to change them
# =====================================================================================
#  Every macro reads its positions from here. Change a number, save, then FIRMWARE_RESTART.
#  Type RHINO_POSITIONS in the console to list them and check them against the travel limits.
#
#  The installer puts this file in place only if you don't have one yet and never overwrites
#  it, so your numbers survive updates.
#
#  X and Y: where the head goes, in machine coordinates (mm).
#  Z: the bed's height. Bigger Z = bed lower, further from the tool.
#
#  Set elsewhere, because Klipper itself needs them:
#    - travel limits (X 0-576, Y 0-406, Z -10 to 400): position_min / position_max in printer.cfg
#    - where Z homes (287.5, 203) and the probe offset (20, 5): [safe_z_home] and [probe] in
#      printer.cfg. The paper test (NOZZLE_HEIGHT_CALIBRATE) goes to the probe's spot, worked out
#      from those two, so it follows them by itself.
# =====================================================================================
[gcode_macro RHINO_POSITIONS]
description: The Rhino's positions (edit myrhino/positions.cfg, then FIRMWARE_RESTART). Run it to list them and check them.

# Park - where the head waits after a cancel, a pause and a canceled job (Mainsail's pause
# park uses it too). Keep it clear of the frame.
variable_park_x: 551.0
variable_park_y: 381.0

# Tool swap - where the head goes so you can change the toolhead. Filament change uses it too.
variable_swap_x: 100.0
variable_swap_y: 100.0

# Safe height - before a swap, a park or the end of a job the bed is lowered to at least this,
# which clears every tool's lowest point (measured: 150).
variable_safe_z: 150.0

# The lowest the Set Z zero window will lower the bed (Klipper's own limit is position_max, 400).
variable_zero_max_z: 380.0

# Prime line (print heads) - where it starts and how long it is. It runs straight toward +Y.
variable_prime_x: 5.0
variable_prime_y: 10.0
variable_prime_length: 120.0

gcode:
  {% set p = printer["gcode_macro RHINO_POSITIONS"] %}
  {% set lo = printer.toolhead.axis_minimum %}
  {% set hi = printer.toolhead.axis_maximum %}
  {% set checks = [
       ("Park", "x", p.park_x), ("Park", "y", p.park_y),
       ("Tool swap", "x", p.swap_x), ("Tool swap", "y", p.swap_y),
       ("Safe height", "z", p.safe_z), ("Set Z zero lowest bed", "z", p.zero_max_z),
       ("Prime line start", "x", p.prime_x), ("Prime line start", "y", p.prime_y),
       ("Prime line end", "y", p.prime_y + p.prime_length)] %}
  {% set bad = [] %}
  {% for name, ax, v in checks %}
    {% if v < lo[ax] or v > hi[ax] %}
      {% set _ = bad.append(name ~ " " ~ ax|upper ~ v ~ " is outside " ~ ax|upper ~ " " ~ lo[ax] ~ "-" ~ hi[ax]) %}
    {% endif %}
  {% endfor %}
  {% if params.QUIET|default(0)|int == 0 %}
    RESPOND MSG="Rhino positions (myrhino/positions.cfg): park X{p.park_x} Y{p.park_y} | tool swap X{p.swap_x} Y{p.swap_y} | safe height Z{p.safe_z} | Set Z zero lowest Z{p.zero_max_z} | prime line X{p.prime_x} Y{p.prime_y}, {p.prime_length} mm"
  {% endif %}
  {% for b in bad %}
    RESPOND TYPE=error MSG="myrhino/positions.cfg: {b} (travel limits in printer.cfg). Fix the number, then FIRMWARE_RESTART."
  {% endfor %}
  {% if not bad and params.QUIET|default(0)|int == 0 %}
    RESPOND MSG="All positions are inside the travel limits."
  {% endif %}

# At start-up: Mainsail's own pause/cancel park reads _CLIENT_VARIABLE, so give it the park spot
# from above, then check every position against the travel limits (errors show in the console).
[delayed_gcode _RHINO_POSITIONS_APPLY]
initial_duration: 0.5
gcode:
  {% set p = printer["gcode_macro RHINO_POSITIONS"] %}
  SET_GCODE_VARIABLE MACRO=_CLIENT_VARIABLE VARIABLE=custom_park_x VALUE={p.park_x}
  SET_GCODE_VARIABLE MACRO=_CLIENT_VARIABLE VARIABLE=custom_park_y VALUE={p.park_y}
  RHINO_POSITIONS QUIET=1
