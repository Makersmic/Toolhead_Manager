[gcode_macro TURN_ON_MOTORS]
description: Initialize the stepper motors.
gcode:
  SET_STEPPER_ENABLE STEPPER=stepper_y ENABLE=1
  SET_STEPPER_ENABLE STEPPER=stepper_x ENABLE=1
  SET_STEPPER_ENABLE STEPPER=stepper_z ENABLE=1
  #SET_STEPPER_ENABLE STEPPER=extruder ENABLE=1

# SET_SERVO_ANGLE moves the SwitchFly filament-path servo (_SWITCHFLY_SET_PATH uses it).
[gcode_macro SET_SERVO_ANGLE]
#set the servo angle or the laser intensity depending on how it is specified in the gcode
description: Set the angle of the servo.
variable_min_pulse: 0.0005
variable_max_pulse: 0.0025
gcode:
  {% set _slot = printer["gcode_macro SWAP_TOOL"].current_tool|int %}
  {% if printer["gcode_macro VARIABLES"].tool_mapping.get(_slot, "") == "LightSaber" %}
    { action_raise_error("Servo command blocked: SERVO_LASER is the LightSaber intensity channel and LightSaber is mounted.") }
  {% endif %}
  {% if params.ANGLE is defined %}
    {% set angle = params.ANGLE|float %}
    {% if angle >= 0 and angle <= 180 %}
      {% set pulse = min_pulse + (max_pulse - min_pulse) * (angle / 180.0) %}
      {% set duty = pulse / 0.02 %}
      SET_PIN PIN=SERVO_LASER VALUE={duty} PWM_CYCLE_TIME=0.02
      LEDFLASH
    {% else %}
      M117 Error: ANGLE must be 0-180
    {% endif %}
  {% else %}
    M117 Error: ANGLE parameter missing
  {% endif %}

[gcode_macro EMERGENCY_STOP]
description: Kill power to laser, spindle and any custom tool; spindle ESC to arm value; servo shaft to 90 degrees.
gcode:
  # Power rails first, unconditionally - this must work whatever tool is recorded as mounted.
  _TOOL_SAFE_OFF
  # Centre the SwitchFly path servo only when SwitchFly is the mounted tool; on any other tool the
  # same pin is the laser intensity signal and must stay at 0.
  {% if printer["gcode_macro VARIABLES"].tool_mapping.get(printer["gcode_macro SWAP_TOOL"].current_tool|int, "") == "SwitchFly" %}
    SET_PIN PIN=SERVO_LASER VALUE=0.075
  {% endif %}
  LEDFLASH

[gcode_macro M0]
gcode:
    PAUSE
