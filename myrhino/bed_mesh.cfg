#######################################################################
#  BED MESH (1.6.0)
#######################################################################
# The probe is on the print heads, so a mesh is only made with BlockOne, SwitchFly or an added print head.
#
# Every mesh made here is recorded in variables.save as mesh_meta: {profile: {bed, tool, when}} - the bed
# temperature it was made at, the head that probed it, and the time (seconds since 1970; 0 when not known).
# Klipper keeps none of that. With it:
#   - a print loads the saved mesh made at its own bed temperature (the bed changes shape as it heats),
#   - Rhino Studio can say how old a mesh is and warn when a mesh made hot is used cold.
#
# A new profile lives only until Klipper restarts. SAVE_CONFIG writes it into printer.cfg (and restarts
# Klipper; Klipper keeps a dated copy of the old printer.cfg). Never during a job.
#
# Spindle (CNC): its Z zero is set on the material, so a bed mesh would change the cut depth.
# SET_Z_ZERO switches the mesh off for the spindle, and a spindle job will not start with one loaded.
# Laser and drag knife keep the mesh (it keeps focus and blade depth even across the bed).

[gcode_macro RHINO_MESH]
description: Bed mesh status: the mesh in use and the saved meshes, with the bed temperature each was made at.
variable_match_c: 5          # a print uses a saved mesh made within this many °C of its bed temperature
variable_cold_c: 40          # bed targets below this count as a cold bed (PLA with the bed bypassed)
variable_soak_min: 5         # minutes the bed soaks at temperature before probing (RHINO_MESH_CALIBRATE)
gcode:
  {% if "bed_mesh" not in printer.configfile.settings %}
    RESPOND MSG="Bed mesh is not set up: there is no [bed_mesh] section in printer.cfg."
  {% else %}
    {% set meta = printer.save_variables.variables.mesh_meta|default({}) %}
    {% set cur = printer.bed_mesh.profile_name %}
    RESPOND MSG="Bed mesh in use: {cur if cur else 'none - moves are not compensated'}"
    {% for name in printer.bed_mesh.profiles %}
      {% if name in meta %}
        RESPOND MSG="  {name}: made at {meta[name].bed|float|round(0)|int}°C with {meta[name].tool}"
      {% else %}
        RESPOND MSG="  {name}: bed temperature not recorded"
      {% endif %}
    {% endfor %}
  {% endif %}


[gcode_macro RHINO_MESH_CALIBRATE]
description: Make a bed mesh with a print head - home if needed, heat the bed and let it soak, level the gantry, probe, and record the bed temperature, head and time. PROFILE=<name> BED=<°C, 0 = cold> SOAK=<minutes> TILT=<1 or 0>
gcode:
  {% set cfg = printer["gcode_macro RHINO_MESH"] %}
  {% set sv = printer.save_variables.variables %}
  {% set profile = params.PROFILE|default("")|string %}
  {% set bed = params.BED|default(sv.set_material_bed_temp|default(60))|float %}
  {% set soak = params.SOAK|default(cfg.soak_min)|float %}
  {% set tilt = params.TILT|default(1)|int %}
  {% set when = params.WHEN|default(0)|int %}
  {% set bed_max = printer.configfile.settings.heater_bed.max_temp|default(130)|float %}
  {% set allowed = "abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789-_." %}
  {% set ns = namespace(bad=false) %}
  {% for ch in profile %}{% if ch not in allowed %}{% set ns.bad = true %}{% endif %}{% endfor %}
  {% if "bed_mesh" not in printer.configfile.settings %}
    { action_raise_error("RHINO_MESH_CALIBRATE: bed mesh is not set up (no [bed_mesh] section in printer.cfg).") }
  {% elif printer.print_stats.state in ["printing", "paused"] %}
    { action_raise_error("RHINO_MESH_CALIBRATE: a job is running. A print makes its own mesh at the start when it needs one.") }
  {% elif profile == "" or profile|length > 32 or ns.bad %}
    { action_raise_error("RHINO_MESH_CALIBRATE: PROFILE must be 1-32 letters, digits, - _ or . (for example PROFILE=bed-60).") }
  {% elif profile.startswith("adaptive-") %}
    { action_raise_error("RHINO_MESH_CALIBRATE: names starting adaptive- are Klipper's one-print meshes. Choose another name.") }
  {% elif bed < 0 or bed > bed_max %}
    { action_raise_error("RHINO_MESH_CALIBRATE: BED must be 0 (cold) to " ~ bed_max|int ~ "°C, not " ~ bed ~ ".") }
  {% elif soak < 0 or soak > 60 %}
    { action_raise_error("RHINO_MESH_CALIBRATE: SOAK must be 0 to 60 minutes.") }
  {% endif %}
  {% set _tm = {} %}
  {% set _ = _tm.update(printer["gcode_macro VARIABLES"].tool_mapping) %}
  {% set _ = _tm.update(printer["gcode_macro CUSTOM_TOOLS"].tool_mapping) %}
  {% set tool = _tm.get(printer["gcode_macro SWAP_TOOL"].current_tool|int, "") %}
  _RHINO_NEED_PRINT_HEAD FOR=RHINO_MESH_CALIBRATE
  {% if printer.toolhead.homed_axes != "xyz" %}
    G28
  {% endif %}
  {% if bed > 0 %}
    M117 Mesh: heating the bed to {bed|int}°C
    RESPOND TYPE=command MSG="action:notify Mesh: heating the bed to {bed|int}°C"
    M190 S{bed}
    {% if soak > 0 %}
      M117 Mesh: bed soaking {soak|round(1)} min
      RESPOND TYPE=command MSG="action:notify Mesh: the bed soaks {soak|round(1)} min so it settles into shape"
      G4 P{(soak * 60000)|int}
    {% endif %}
  {% else %}
    M140 S0
  {% endif %}
  {% if tilt == 1 %}
    M117 Mesh: levelling the gantry
    Z_TILT_ADJUST
  {% endif %}
  M117 Mesh: probing
  RESPOND TYPE=command MSG="action:notify Mesh: probing the bed"
  BED_MESH_CALIBRATE PROFILE={profile}
  _RHINO_MESH_RECORD PROFILE={profile} BED={bed} TOOL={tool} WHEN={when}
  M117 Mesh {profile} made
  RESPOND MSG="Mesh {profile} made at {bed|int}°C with {tool} and loaded. Klipper keeps it until it restarts: save it (Studio, or SAVE_CONFIG) to keep it."


[gcode_macro _RHINO_MESH_RECORD]
description: Helper - record the bed temperature, head and time of a mesh in variables.save (mesh_meta). Drops meshes Klipper no longer has.
gcode:
  {% set p = params.PROFILE|string %}
  {% set meta = printer.save_variables.variables.mesh_meta|default({}) %}
  {% set have = printer.bed_mesh.profiles %}
  {% set m = {} %}
  {% for k in meta %}
    {% if k != p and k in have %}{% set _ = m.update({k: meta[k]}) %}{% endif %}
  {% endfor %}
  {% set _ = m.update({p: {"bed": params.BED|float|round(1), "tool": params.TOOL|default("")|string, "when": params.WHEN|default(0)|int}}) %}
  SAVE_VARIABLE VARIABLE=mesh_meta VALUE="{m}"


[gcode_macro RHINO_MESH_REMOVE]
description: Remove a saved bed mesh and its record. PROFILE=<name>. Like BED_MESH_PROFILE REMOVE, it is gone from printer.cfg after SAVE_CONFIG.
gcode:
  {% set p = params.PROFILE|default("")|string %}
  {% if printer.print_stats.state in ["printing", "paused"] %}
    { action_raise_error("RHINO_MESH_REMOVE: a job is running. Remove meshes when it has finished.") }
  {% elif "bed_mesh" not in printer.configfile.settings or p not in printer.bed_mesh.profiles %}
    { action_raise_error("RHINO_MESH_REMOVE: there is no mesh called " ~ p ~ ".") }
  {% endif %}
  BED_MESH_PROFILE REMOVE={p}
  _RHINO_MESH_FORGET PROFILE={p}
  RESPOND MSG="Mesh {p} removed. Save (SAVE_CONFIG) to take it out of printer.cfg too."

[gcode_macro _RHINO_MESH_FORGET]
description: Helper - drop one mesh's record from mesh_meta.
gcode:
  {% set p = params.PROFILE|string %}
  {% set meta = printer.save_variables.variables.mesh_meta|default({}) %}
  {% set m = {} %}
  {% for k in meta %}
    {% if k != p %}{% set _ = m.update({k: meta[k]}) %}{% endif %}
  {% endfor %}
  SAVE_VARIABLE VARIABLE=mesh_meta VALUE="{m}"


#######################################################################
#  The mesh at the start of a print (from _PREHEAT_STAGE2, bed already at temperature)
#######################################################################
[gcode_macro _RHINO_JOB_MESH]
description: Part of a print start - load the saved mesh made at this bed temperature; with none, ask (probe one now, use the closest, print without, or cancel). Then prime and let the job run.
gcode:
  {% set bed = params.BED|default(0)|float %}
  {% if "bed_mesh" not in printer.configfile.settings %}
    _RHINO_JOB_MESH_GO CHOICE=keep BED={bed}
  {% else %}
    {% set cfg = printer["gcode_macro RHINO_MESH"] %}
    {% set meta = printer.save_variables.variables.mesh_meta|default({}) %}
    {% set cold = bed < cfg.cold_c|float %}
    {% set ns = namespace(best="", diff=999.0, when=-1, near="", neardiff=999.0, nearbed=0.0, plain="") %}
    {% for name in printer.bed_mesh.profiles %}
      {% if not name.startswith("adaptive-") %}
        {% if name in meta %}
          {% set mb = meta[name].bed|float %}
          {% set d = 0.0 if (cold and mb < cfg.cold_c|float) else (mb - bed)|abs %}
          {% set w = meta[name].when|default(0)|int %}
          {% if d <= cfg.match_c|float and (d < ns.diff or (d == ns.diff and w > ns.when)) %}
            {% set ns.best = name %}{% set ns.diff = d %}{% set ns.when = w %}
          {% endif %}
          {% if d < ns.neardiff %}
            {% set ns.near = name %}{% set ns.neardiff = d %}{% set ns.nearbed = mb %}
          {% endif %}
        {% elif ns.plain == "" %}
          {% set ns.plain = name %}
        {% endif %}
      {% endif %}
    {% endfor %}
    {% if ns.best %}
      _RHINO_JOB_MESH_GO CHOICE=load NAME={ns.best} BED={bed}
    {% else %}
      {% set label = "a cold bed" if cold else bed|int ~ "°C" %}
      RESPOND TYPE=command MSG="action:prompt_begin No bed mesh for {label}"
      RESPOND TYPE=command MSG="action:prompt_text None of the saved meshes was made at this bed temperature, and the bed changes shape as it heats."
      RESPOND TYPE=command MSG="action:prompt_text Probing a new one takes a few minutes: the bed and head move. Nothing has been probed yet - you can still say no."
      RESPOND TYPE=command MSG="action:prompt_button Probe a new mesh now|_RHINO_JOB_MESH_GO CHOICE=probe BED={bed}|primary"
      {% if ns.near %}
        RESPOND TYPE=command MSG="action:prompt_button Use {ns.near} (made at {ns.nearbed|int}°C)|_RHINO_JOB_MESH_GO CHOICE=load NAME={ns.near} BED={bed}|secondary"
      {% elif ns.plain %}
        RESPOND TYPE=command MSG="action:prompt_button Use {ns.plain} (temperature not recorded)|_RHINO_JOB_MESH_GO CHOICE=load NAME={ns.plain} BED={bed}|secondary"
      {% endif %}
      RESPOND TYPE=command MSG="action:prompt_button Print without a mesh|_RHINO_JOB_MESH_GO CHOICE=none BED={bed}|warning"
      RESPOND TYPE=command MSG="action:prompt_footer_button Cancel job|_RHINO_JOB_MESH_GO CHOICE=cancel BED={bed}|error"
      RESPOND TYPE=command MSG="action:prompt_show"
      # Hold the file until a button is pressed (it is normally already held by the start sequence).
      {% if printer.print_stats.state == "printing" and not printer.pause_resume.is_paused %}
        PAUSE_BASE
      {% endif %}
    {% endif %}
  {% endif %}

[gcode_macro _RHINO_JOB_MESH_GO]
description: Part of a print start - CHOICE=load (NAME=), probe, none, keep or cancel; then prime and let the job run.
gcode:
  {% set choice = params.CHOICE|default("keep")|string|lower %}
  {% set bed = params.BED|default(0)|float %}
  {% set name = params.NAME|default("")|string %}
  RESPOND TYPE=command MSG="action:prompt_end"
  {% if choice == "cancel" %}
    M117 Job canceled by user
    RESPOND TYPE=command MSG="action:notify Job canceled by user (no bed mesh)"
    {% if printer.print_stats.state == "printing" or printer.pause_resume.is_paused %}
      CANCEL_PRINT
    {% endif %}
  {% else %}
    {% if choice == "load" %}
      {% if name not in printer.bed_mesh.profiles %}
        { action_raise_error("Bed mesh " ~ name ~ " is no longer saved. Start the job again.") }
      {% endif %}
      {% set meta = printer.save_variables.variables.mesh_meta|default({}) %}
      BED_MESH_PROFILE LOAD={name}
      RESPOND TYPE=command MSG="action:notify Bed mesh {name}{' (made at ' ~ meta[name].bed|int ~ '°C)' if name in meta else ''}"
    {% elif choice == "probe" %}
      {% set cold = bed < printer["gcode_macro RHINO_MESH"].cold_c|float %}
      {% set p = "bed-cold" if cold else "bed-" ~ bed|int %}
      {% set _tm = {} %}
      {% set _ = _tm.update(printer["gcode_macro VARIABLES"].tool_mapping) %}
      {% set _ = _tm.update(printer["gcode_macro CUSTOM_TOOLS"].tool_mapping) %}
      {% set tool = _tm.get(printer["gcode_macro SWAP_TOOL"].current_tool|int, "") %}
      _RHINO_NEED_PRINT_HEAD FOR=BED_MESH HOMED=1
      M117 Probing the bed mesh
      RESPOND TYPE=command MSG="action:notify Probing a bed mesh at {bed|int}°C"
      BED_MESH_CALIBRATE PROFILE={p}
      _RHINO_MESH_RECORD PROFILE={p} BED={bed} TOOL={tool} WHEN=0
      RESPOND MSG="Mesh {p} made and loaded. It is kept until Klipper restarts: save it after the job (Studio, or SAVE_CONFIG) to use it again."
    {% elif choice == "none" %}
      BED_MESH_CLEAR
      RESPOND TYPE=command MSG="action:notify Printing without a bed mesh"
    {% endif %}
    PRIME_LINE
    _RHINO_JOB_GO
    RESUME_BASE # Unfreeze the print job queue (as the preheat always did)
  {% endif %}


#######################################################################
#  Spindle: never cut with a bed mesh loaded
#######################################################################
[gcode_macro _RHINO_MESH_CNC_CHECK]
description: Helper - with a spindle mounted and a bed mesh loaded, switch every tool output off and stop. The mesh would change the cut depth (SET_Z_ZERO switches it off; it was loaded again since).
gcode:
  {% set _tm = {} %}
  {% set _ = _tm.update(printer["gcode_macro VARIABLES"].tool_mapping) %}
  {% set _ = _tm.update(printer["gcode_macro CUSTOM_TOOLS"].tool_mapping) %}
  {% set _th = {} %}
  {% set _ = _th.update(printer["gcode_macro VARIABLES"].toolheads) %}
  {% set _ = _th.update(printer["gcode_macro CUSTOM_TOOLS"].toolheads) %}
  {% set name = _tm.get(printer["gcode_macro SWAP_TOOL"].current_tool|int, "") %}
  {% if _th.get(name, {}).get("type", "") == "CNC" and "bed_mesh" in printer and printer.bed_mesh.profile_name != "" %}
    _TOOL_SAFE_OFF
    _RHINO_MESH_CNC_REFUSE NAME={printer.bed_mesh.profile_name}
  {% endif %}

[gcode_macro _RHINO_MESH_CNC_REFUSE]
description: Helper - stop a spindle job that has a bed mesh loaded (outputs are already off).
gcode:
  { action_raise_error("Bed mesh " ~ params.NAME|default("") ~ " is loaded, and the spindle's Z zero is set on the material: the mesh would change the cut depth. The spindle is off. Run SET_Z_ZERO again (it switches the mesh off), then start the job.") }

[gcode_macro _RHINO_MESH_OFF_FOR_CNC]
description: Helper - switch the bed mesh off before the spindle's Z zero is set (from SET_Z_ZERO).
gcode:
  {% if "bed_mesh" in printer and printer.bed_mesh.profile_name != "" %}
    BED_MESH_CLEAR
    RESPOND MSG="Bed mesh {printer.bed_mesh.profile_name} switched off for the spindle: its Z zero is set on the material, so a bed mesh would change the cut depth."
  {% endif %}
