# =====================================================================
# TOOL POWER: ONE M3/M4/M5, SAFE-OFF, AND GENERIC POWERED/PASSIVE TOOLS
# =====================================================================
# * M3/M4/M5 used to be defined in BOTH spindle_macros.cfg and laser_macros.cfg. Klipper
#   merges duplicate sections and the later include (laser) won, so a CNC file's M3/M5
#   hit the laser lockout. There is now exactly one of each; it looks at which tool is
#   mounted and does the right thing for it.
# * _TOOL_SAFE_OFF cuts every tool output. It never raises, so it is safe to call from
#   anywhere (SWAP_TOOL, CANCEL_PRINT, EMERGENCY_STOP, END_PRINT).
# * Klipper renders a whole macro BEFORE running any of its lines, so an
#   action_raise_error() inside a template aborts it before any SET_PIN above it runs.
#   Rejections therefore use  _TOOL_SAFE_OFF  followed by  _TOOL_REJECT  (a separate
#   macro that raises when it is reached), so the pins really do go off first.
# * SET_TOOL_POWER drives user-added POWERED tools (hot wire, needle cutter, ...) with
#   a hard power cap and a watchdog timer.
# =====================================================================

[gcode_macro _TOOL_REJECT]
description: Raise an error at run time (after any power-off commands queued before it).
gcode:
  { action_raise_error(params.MSG|default("Tool command rejected")) }


[gcode_macro TOOL_POWER_STATE]
description: State holder for the powered-tool watchdog (do not run).
variable_active: 0
variable_level: 0.0
variable_suspended: 0
variable_elapsed: 0
gcode:
  RESPOND MSG="TOOL_POWER_STATE only holds state"


[gcode_macro _TOOL_OUTPUT_OFF]
description: Drive every tool output to its safe level (pins only - keeps the watchdog state). Never raises.
gcode:
  {% set _tm = {} %}
  {% set _ = _tm.update(printer["gcode_macro VARIABLES"].tool_mapping) %}
  {% set _ = _tm.update(printer["gcode_macro CUSTOM_TOOLS"].tool_mapping) %}
  {% set _th = printer["gcode_macro CUSTOM_TOOLS"].toolheads %}
  {% set mounted = _tm.get(printer["gcode_macro SWAP_TOOL"].current_tool|int, "") %}

  SET_PIN PIN=Spindle_power VALUE=0
  SET_PIN PIN=SPINDLE_SPEED VALUE=0.3
  SET_PIN PIN=LASER_INITIALIZE VALUE=0
  {% if mounted != "SwitchFly" %}
    # SERVO_LASER is also SwitchFly's filament-path servo; leave it alone when SwitchFly is mounted.
    SET_PIN PIN=SERVO_LASER VALUE=0
  {% endif %}

  {% for tname, t in _th.items() %}
    {% if t.get("type") == "POWERED" and t.get("power_pin", "") != "" %}
      # Pins this tool created are always safe to idle. A shared channel (e.g. SPINDLE_SPEED)
      # is only set to this tool's idle value while this tool is the mounted one.
      {% if t.get("owns_power_pin", False) or tname == mounted %}
        SET_PIN PIN={t.power_pin} VALUE={t.get("power_idle", 0.0)|float}
      {% endif %}
      {% if t.get("enable_pin", "") != "" and (t.get("owns_enable_pin", False) or tname == mounted) %}
        SET_PIN PIN={t.enable_pin} VALUE=0
      {% endif %}
      {% for o in t.get("also_on", []) %}
        {% if o in t.get("also_on_owned", []) or tname == mounted %}
          SET_PIN PIN={o} VALUE=0
        {% endif %}
      {% endfor %}
    {% endif %}
  {% endfor %}


[gcode_macro _TOOL_SAFE_OFF]
description: Cut every tool output AND stand the powered-tool watchdog down. Never raises, so it is safe from anywhere (SWAP_TOOL, CANCEL_PRINT, EMERGENCY_STOP, END_PRINT).
gcode:
  _TOOL_OUTPUT_OFF
  # Extra tool controls ticked "switch off when the machine is made safe" (generated in custom_tools.cfg).
  {% if "gcode_macro _RHINO_CONTROLS_OFF" in printer %}
    _RHINO_CONTROLS_OFF
  {% endif %}
  UPDATE_DELAYED_GCODE ID=TOOL_POWER_WATCHDOG DURATION=0
  SET_GCODE_VARIABLE MACRO=TOOL_POWER_STATE VARIABLE=active VALUE=0
  SET_GCODE_VARIABLE MACRO=TOOL_POWER_STATE VARIABLE=suspended VALUE=0
  SET_GCODE_VARIABLE MACRO=TOOL_POWER_STATE VARIABLE=elapsed VALUE=0


# ---------------------------------------------------------------------
# M3 / M4 / M5
# ---------------------------------------------------------------------
[gcode_macro M3]
description: Tool ON for whichever tool is mounted (laser, spindle, or user-added powered tool). S is scaled per tool.
gcode:
  {% set _tm = {} %}
  {% set _ = _tm.update(printer["gcode_macro VARIABLES"].tool_mapping) %}
  {% set _ = _tm.update(printer["gcode_macro CUSTOM_TOOLS"].tool_mapping) %}
  {% set _th = {} %}
  {% set _ = _th.update(printer["gcode_macro VARIABLES"].toolheads) %}
  {% set _ = _th.update(printer["gcode_macro CUSTOM_TOOLS"].toolheads) %}
  {% set name = _tm.get(printer["gcode_macro SWAP_TOOL"].current_tool|int, "Unknown") %}
  {% set t = _th.get(name, {}) %}

  {% if name == "LightSaber" %}
    {% set s_max = printer["gcode_macro VARIABLES"].laser_s_max|float %}
    {% if params.S is defined %}
      {% set power = [[params.S|float / s_max, 0.0]|max, 1.0]|min %}
    {% else %}
      {% set power = 1.0 %}
    {% endif %}
    SET_LASER_POWER POWER={power}
  {% elif name == "HotJoe" %}
    # The CNC wizard has already ramped the ESC to the chosen throttle. Re-arming here would drop
    # it back to neutral mid-job, so only arm the spindle if it is not already running.
    {% if printer["output_pin Spindle_power"].value|float > 0.5 %}
      RESPOND MSG="M3: spindle already running - speed is set from CNC_JOB_SETUP"
    {% else %}
      Spindle_ACTIVATE
    {% endif %}
  {% elif t.get("type") == "POWERED" %}
    {% if params.S is defined %}
      {% set power = [[params.S|float / t.get("s_max", 1000)|float, 0.0]|max, 1.0]|min %}
    {% else %}
      {% set power = t.get("default_power", 1.0)|float %}
    {% endif %}
    SET_TOOL_POWER POWER={power}
  {% else %}
    _TOOL_SAFE_OFF
    _TOOL_REJECT MSG="M3 rejected: {name} has no power output (mounted tool is not a laser, spindle or powered tool)."
  {% endif %}


[gcode_macro M4]
description: Same as M3 (no reverse direction on these tools).
gcode:
  M3 {rawparams}


[gcode_macro M5]
description: Tool OFF. Never raises; with an unknown or non-powered tool mounted everything is switched off.
gcode:
  {% set _tm = {} %}
  {% set _ = _tm.update(printer["gcode_macro VARIABLES"].tool_mapping) %}
  {% set _ = _tm.update(printer["gcode_macro CUSTOM_TOOLS"].tool_mapping) %}
  {% set _th = {} %}
  {% set _ = _th.update(printer["gcode_macro VARIABLES"].toolheads) %}
  {% set _ = _th.update(printer["gcode_macro CUSTOM_TOOLS"].toolheads) %}
  {% set name = _tm.get(printer["gcode_macro SWAP_TOOL"].current_tool|int, "Unknown") %}
  {% set t = _th.get(name, {}) %}

  {% if name == "LightSaber" %}
    SET_LASER_POWER POWER=0.0
  {% elif name == "HotJoe" %}
    Spindle_DEACTIVATE
  {% elif t.get("type") == "POWERED" %}
    SET_TOOL_POWER POWER=0
  {% else %}
    _TOOL_SAFE_OFF
  {% endif %}


# ---------------------------------------------------------------------
# User-added POWERED tools (hot wire, needle cutter, other PWM-driven tools)
# ---------------------------------------------------------------------
[gcode_macro SET_TOOL_POWER]
description: Set the output of the mounted powered custom tool. POWER=0..1 is a fraction of that tool's power_cap.
gcode:
  {% set _tm = {} %}
  {% set _ = _tm.update(printer["gcode_macro VARIABLES"].tool_mapping) %}
  {% set _ = _tm.update(printer["gcode_macro CUSTOM_TOOLS"].tool_mapping) %}
  {% set name = _tm.get(printer["gcode_macro SWAP_TOOL"].current_tool|int, "Unknown") %}
  {% set t = printer["gcode_macro CUSTOM_TOOLS"].toolheads.get(name, {}) %}

  {% if t.get("type") != "POWERED" %}
    _TOOL_SAFE_OFF
    _TOOL_REJECT MSG="SET_TOOL_POWER rejected: {name} is not a powered custom tool."
  {% endif %}

  {% set cap = t.get("power_cap", 0.0)|float %}
  {% set pmin = t.get("power_min", 0.0)|float %}
  {% set idle = t.get("power_idle", 0.0)|float %}
  {% set req = [[params.POWER|default(0)|float, 0.0]|max, 1.0]|min %}

  {% if t.get("type") == "POWERED" and req <= 0 %}
    SET_PIN PIN={t.power_pin} VALUE={idle}
    {% if t.get("enable_pin", "") != "" %}
      SET_PIN PIN={t.enable_pin} VALUE=0
    {% endif %}
    {% for o in t.get("also_on", []) %}
      SET_PIN PIN={o} VALUE=0
    {% endfor %}
    UPDATE_DELAYED_GCODE ID=TOOL_POWER_WATCHDOG DURATION=0
    SET_GCODE_VARIABLE MACRO=TOOL_POWER_STATE VARIABLE=active VALUE=0
    SET_GCODE_VARIABLE MACRO=TOOL_POWER_STATE VARIABLE=suspended VALUE=0
    SET_GCODE_VARIABLE MACRO=TOOL_POWER_STATE VARIABLE=elapsed VALUE=0
  {% elif t.get("type") == "POWERED" %}
    {% set duty = pmin + req * (cap - pmin) %}
    {% if t.get("enable_pin", "") != "" %}
      SET_PIN PIN={t.enable_pin} VALUE=1
    {% endif %}
    {% for o in t.get("also_on", []) %}
      SET_PIN PIN={o} VALUE=1
    {% endfor %}
    SET_PIN PIN={t.power_pin} VALUE={"%.4f"|format(duty)}
    UPDATE_DELAYED_GCODE ID=TOOL_POWER_WATCHDOG DURATION=5
    SET_GCODE_VARIABLE MACRO=TOOL_POWER_STATE VARIABLE=active VALUE=1
    SET_GCODE_VARIABLE MACRO=TOOL_POWER_STATE VARIABLE=level VALUE={req}
    SET_GCODE_VARIABLE MACRO=TOOL_POWER_STATE VARIABLE=suspended VALUE=0
    SET_GCODE_VARIABLE MACRO=TOOL_POWER_STATE VARIABLE=elapsed VALUE=0
  {% endif %}


[delayed_gcode TOOL_POWER_WATCHDOG]
# 5 s tick while a powered custom tool is ON. Cuts power if it is left on with no job running for max_on_s; cuts it while a job is paused.
gcode:
  {% set st = printer["gcode_macro TOOL_POWER_STATE"] %}
  {% set ps = printer.print_stats.state %}
  {% set _tm = {} %}
  {% set _ = _tm.update(printer["gcode_macro CUSTOM_TOOLS"].tool_mapping) %}
  {% set mounted = _tm.get(printer["gcode_macro SWAP_TOOL"].current_tool|int, "") %}
  {% set t = printer["gcode_macro CUSTOM_TOOLS"].toolheads.get(mounted, {}) %}
  {% set limit = t.get("max_on_s", 600)|int %}

  {% if st.active|int == 1 %}
    {% if t.get("type") != "POWERED" %}
      _TOOL_SAFE_OFF
      RESPOND TYPE=error MSG="Powered-tool watchdog: the powered tool is no longer mounted. Everything switched off."
    {% elif ps == "paused" %}
      # A paused job must not leave a hot wire / cutter energised.
      {% if st.suspended|int == 0 %}
        TOOL_POWER_PAUSE
      {% endif %}
      UPDATE_DELAYED_GCODE ID=TOOL_POWER_WATCHDOG DURATION=5
    {% elif ps == "printing" %}
      # A running job supervises the tool (the file decides how long a cut takes), so no time limit
      # applies - but if power was cut by a pause and the pause hook did not restore it, do so now.
      {% if st.suspended|int == 1 %}
        TOOL_POWER_RESTORE
      {% endif %}
      UPDATE_DELAYED_GCODE ID=TOOL_POWER_WATCHDOG DURATION=5
    {% else %}
      # No job: the tool was switched on by hand (or by TOOL_JOB_SETUP) and nobody is feeding it commands.
      {% if st.elapsed|int + 5 >= limit %}
        _TOOL_SAFE_OFF
        RESPOND TYPE=error MSG="Powered-tool watchdog: {mounted} was on for {limit} s with no job running. Everything switched off."
      {% else %}
        SET_GCODE_VARIABLE MACRO=TOOL_POWER_STATE VARIABLE=elapsed VALUE={st.elapsed|int + 5}
        UPDATE_DELAYED_GCODE ID=TOOL_POWER_WATCHDOG DURATION=5
      {% endif %}
    {% endif %}
  {% endif %}


[gcode_macro TOOL_POWER_PAUSE]
description: Cut a powered tool's output but remember its level (called by PAUSE via _RHINO_PAUSE_HOOK).
gcode:
  {% if printer["gcode_macro TOOL_POWER_STATE"].active|int == 1 %}
    _TOOL_OUTPUT_OFF
    SET_GCODE_VARIABLE MACRO=TOOL_POWER_STATE VARIABLE=suspended VALUE=1
    RESPOND MSG="Tool power cut for the pause - it comes back on at RESUME"
  {% endif %}


[gcode_macro TOOL_POWER_RESTORE]
description: Put a paused powered tool back to the level it had before the pause (called by TOOL_RESUME after the return move).
gcode:
  {% set st = printer["gcode_macro TOOL_POWER_STATE"] %}
  {% if st.active|int == 1 and st.suspended|int == 1 %}
    SET_TOOL_POWER POWER={st.level|float}
  {% endif %}


# ---------------------------------------------------------------------
# PAUSE / RESUME for laser, CNC, drag knife and user-added tools
# ---------------------------------------------------------------------
# Mainsail's RESUME refuses to resume while the extruder is cold ("not hot enough"). With any
# non-print tool mounted the extruder IS cold, so those jobs resume with TOOL_RESUME instead
# (the "Resume job" button in the pop-up that appears when such a job pauses).
# Print-head jobs are untouched: they pause and resume with Mainsail's own buttons as before.

[gcode_macro _RHINO_PAUSE_HOOK]
description: Mainsail user_pause_macro (after PAUSE_BASE, before the park move). Non-print tools - lift clear, tool off, offer TOOL_RESUME.
variable_lift: 10.0
variable_tool_pause: 0
variable_tool: ""
variable_px: 0.0
variable_py: 0.0
variable_pz: 0.0
variable_laser_level: 0.0
variable_spindle_duty: 0.0
gcode:
  {% set _tm = {} %}
  {% set _ = _tm.update(printer["gcode_macro VARIABLES"].tool_mapping) %}
  {% set _ = _tm.update(printer["gcode_macro CUSTOM_TOOLS"].tool_mapping) %}
  {% set _th = {} %}
  {% set _ = _th.update(printer["gcode_macro VARIABLES"].toolheads) %}
  {% set _ = _th.update(printer["gcode_macro CUSTOM_TOOLS"].toolheads) %}
  {% set mounted = _tm.get(printer["gcode_macro SWAP_TOOL"].current_tool|int, "") %}
  {% set ttype = _th.get(mounted, {}).get("type", "") %}

  {% if ttype != "DEPOSITION" and mounted != "" %}
    {% if tool_pause|int == 0 %}
      # Remember exactly where the job stopped (G-code coordinates, same as RESUME restores).
      {% set pos = printer.gcode_move.gcode_position %}
      SET_GCODE_VARIABLE MACRO=_RHINO_PAUSE_HOOK VARIABLE=tool_pause VALUE=1
      SET_GCODE_VARIABLE MACRO=_RHINO_PAUSE_HOOK VARIABLE=tool VALUE="'{mounted}'"
      SET_GCODE_VARIABLE MACRO=_RHINO_PAUSE_HOOK VARIABLE=px VALUE={pos.x}
      SET_GCODE_VARIABLE MACRO=_RHINO_PAUSE_HOOK VARIABLE=py VALUE={pos.y}
      SET_GCODE_VARIABLE MACRO=_RHINO_PAUSE_HOOK VARIABLE=pz VALUE={pos.z}

      # 1. Lift straight up out of the work first (Mainsail's park only lifts 2 mm, then
      #    travels to the corner - a bit or blade still in the stock would be dragged across it).
      {% set room = printer.toolhead.axis_maximum.z - printer.toolhead.position.z - 1.0 %}
      {% set up = [lift|float, room]|min %}
      {% if up > 0 %}
        G91
        G1 Z{up} F600
        G90
      {% endif %}

      # 2. Tool off, levels remembered for TOOL_RESUME.
      {% if mounted == "LightSaber" %}
        {% set lvl = printer["output_pin SERVO_LASER"].value|float %}
        SET_GCODE_VARIABLE MACRO=_RHINO_PAUSE_HOOK VARIABLE=laser_level VALUE={lvl}
        SET_PIN PIN=SERVO_LASER VALUE=0
      {% elif mounted == "HotJoe" %}
        {% set duty = printer["output_pin SPINDLE_SPEED"].value|float if printer["output_pin Spindle_power"].value|float > 0.5 else 0.0 %}
        SET_GCODE_VARIABLE MACRO=_RHINO_PAUSE_HOOK VARIABLE=spindle_duty VALUE={duty}
        Spindle_DEACTIVATE
      {% endif %}
      TOOL_POWER_PAUSE
    {% endif %}
    _RHINO_PAUSE_PROMPT
  {% endif %}


[gcode_macro _RHINO_PAUSE_PROMPT]
description: The pop-up shown while a non-print-tool job is paused.
gcode:
  {% set st = printer["gcode_macro _RHINO_PAUSE_HOOK"] %}
  RESPOND TYPE=command MSG="action:prompt_begin {st.tool} job paused"
  RESPOND TYPE=command MSG="action:prompt_text The tool is off and lifted clear. Use the Resume job button here (or type TOOL_RESUME)."
  RESPOND TYPE=command MSG="action:prompt_text Mainsail's own Resume button is for print jobs and will refuse because the extruder is cold."
  RESPOND TYPE=command MSG="action:prompt_footer_button Cancel job|CANCEL_PRINT|error"
  RESPOND TYPE=command MSG="action:prompt_footer_button Resume job|TOOL_RESUME|primary"
  RESPOND TYPE=command MSG="action:prompt_show"


[gcode_macro _RHINO_RESUME_HOOK]
description: Mainsail user_resume_macro (runs before RESUME_BASE). Stops Mainsail's RESUME for non-print-tool jobs - they need TOOL_RESUME.
gcode:
  {% if printer["gcode_macro _RHINO_PAUSE_HOOK"].tool_pause|int == 1 %}
    # Mainsail's RESUME would go straight back with no spindle spin-up and a diagonal plunge.
    # The error stops the rest of Mainsail's RESUME (RESUME_BASE never runs).
    _RHINO_PAUSE_PROMPT
    _TOOL_REJECT MSG="This job was paused with a non-print tool - resume it with TOOL_RESUME (the Resume job button)."
  {% endif %}


[gcode_macro TOOL_RESUME]
description: Resume a paused laser / CNC / drag-knife / user-added-tool job (print jobs use Mainsail's RESUME).
gcode:
  {% set st = printer["gcode_macro _RHINO_PAUSE_HOOK"] %}
  {% set _tm = {} %}
  {% set _ = _tm.update(printer["gcode_macro VARIABLES"].tool_mapping) %}
  {% set _ = _tm.update(printer["gcode_macro CUSTOM_TOOLS"].tool_mapping) %}
  {% set mounted = _tm.get(printer["gcode_macro SWAP_TOOL"].current_tool|int, "") %}
  {% set velocity = printer.configfile.settings.pause_resume.recover_velocity|default(50)|float %}

  {% if not printer.pause_resume.is_paused %}
    _TOOL_REJECT MSG="TOOL_RESUME: nothing is paused."
  {% elif st.tool_pause|int == 0 %}
    RESPOND MSG="TOOL_RESUME: this is a print job - handing over to Mainsail's RESUME."
    RESUME
  {% elif mounted != st.tool %}
    _TOOL_REJECT MSG="TOOL_RESUME refused: the job was paused with {st.tool} but {mounted} is recorded as mounted. Check the machine and cancel the job."
  {% else %}
    RESPOND TYPE=command MSG="action:prompt_end"
    # Same housekeeping Mainsail's RESUME does.
    {% if printer["gcode_macro RESUME"].restore_idle_timeout > 0 %}
      SET_IDLE_TIMEOUT TIMEOUT={printer["gcode_macro RESUME"].restore_idle_timeout}
    {% endif %}
    SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=idle_state VALUE=False

    # 1. Travel above the paused spot at the current (lifted) height.
    G90
    G1 X{st.px} Y{st.py} F{velocity * 60}

    # 2. Spindle back up to speed BEFORE going back into the cut (same ramp as the CNC wizard).
    {% if st.tool == "HotJoe" and st.spindle_duty|float > 0.3 %}
      Spindle_ACTIVATE
      SET_PIN PIN=SPINDLE_SPEED VALUE=0.4 PWM_CYCLE_TIME=0.0025
      G4 P2000
      SET_PIN PIN=SPINDLE_SPEED VALUE={st.spindle_duty} PWM_CYCLE_TIME=0.0025
      G4 P2000
    {% endif %}

    # 3. Down to 2 mm above the cut, then the last 2 mm slowly. RESUME_BASE restores the saved
    #    position and G-code state (absolute/relative, feed rate) exactly as PAUSE left them.
    G1 Z{st.pz + 2.0} F{velocity * 60}
    RESUME_BASE VELOCITY=5

    # 4. Laser / user-added tool back to the level it had. Klipper applies pin changes in move
    #    order, so this takes effect once the head is back on the paused spot.
    {% if st.tool == "LightSaber" and st.laser_level|float > 0 %}
      SET_LASER_POWER POWER={st.laser_level}
    {% endif %}
    TOOL_POWER_RESTORE
    _RHINO_PAUSE_CLEAR
    RESPOND MSG="{st.tool} job resumed"
  {% endif %}


[gcode_macro _RHINO_PAUSE_CLEAR]
description: Forget the remembered pause (after TOOL_RESUME or CANCEL_PRINT).
gcode:
  SET_GCODE_VARIABLE MACRO=_RHINO_PAUSE_HOOK VARIABLE=tool_pause VALUE=0
  SET_GCODE_VARIABLE MACRO=_RHINO_PAUSE_HOOK VARIABLE=tool VALUE="''"
  SET_GCODE_VARIABLE MACRO=_RHINO_PAUSE_HOOK VARIABLE=laser_level VALUE=0.0
  SET_GCODE_VARIABLE MACRO=_RHINO_PAUSE_HOOK VARIABLE=spindle_duty VALUE=0.0


# ---------------------------------------------------------------------
# Per-job setup for user-added tools (what SET_LASER / SET_SPINDLE / SET_DRAG_KNIFE do for built-ins)
# ---------------------------------------------------------------------
[gcode_macro SET_POWERED_TOOL]
description: Configure a user-added POWERED toolhead for a material (accel, z-offset, saved defaults), output off.
gcode:
  {% set _th = {} %}
  {% set _ = _th.update(printer["gcode_macro VARIABLES"].toolheads) %}
  {% set _ = _th.update(printer["gcode_macro CUSTOM_TOOLS"].toolheads) %}
  {% set TOOLHEAD = params.TOOLHEAD %}
  {% set MATERIAL = params.MATERIAL %}
  {% if TOOLHEAD not in _th or MATERIAL not in _th[TOOLHEAD].materials %}
    { action_raise_error("SET_POWERED_TOOL: " ~ TOOLHEAD ~ "/" ~ MATERIAL ~ " is not defined") }
  {% endif %}
  {% set mat = _th[TOOLHEAD].materials[MATERIAL] %}
  SAVE_VARIABLE VARIABLE=set_material_toolhead VALUE="'{TOOLHEAD}'"
  SAVE_VARIABLE VARIABLE=set_material_material VALUE="'{MATERIAL}'"
  SAVE_VARIABLE VARIABLE=set_material_power VALUE={mat.power|default(0.5)|float}
  SAVE_VARIABLE VARIABLE=set_material_feed_rate VALUE={mat.feed_rate|default(600)|float}
  SET_VELOCITY_LIMIT ACCEL={mat.accel|default(800)|float}
  SET_VELOCITY_LIMIT SQUARE_CORNER_VELOCITY={mat.square_corner_velocity|default(5)|float}
  SET_GCODE_OFFSET Z={mat.z_offset|default(0)|float}
  M5
  M117 {TOOLHEAD}/{MATERIAL} ready - power {"%.0f"|format(mat.power|default(0.5)|float * 100)}% of cap
  RESPOND TYPE=command MSG="action:notify {TOOLHEAD}/{MATERIAL} ready (powered tool)"


[gcode_macro SET_PASSIVE_TOOL]
description: Configure a user-added PASSIVE toolhead (pen, blade, probe...) for a material.
gcode:
  {% set _th = {} %}
  {% set _ = _th.update(printer["gcode_macro VARIABLES"].toolheads) %}
  {% set _ = _th.update(printer["gcode_macro CUSTOM_TOOLS"].toolheads) %}
  {% set TOOLHEAD = params.TOOLHEAD %}
  {% set MATERIAL = params.MATERIAL %}
  {% if TOOLHEAD not in _th or MATERIAL not in _th[TOOLHEAD].materials %}
    { action_raise_error("SET_PASSIVE_TOOL: " ~ TOOLHEAD ~ "/" ~ MATERIAL ~ " is not defined") }
  {% endif %}
  {% set mat = _th[TOOLHEAD].materials[MATERIAL] %}
  SAVE_VARIABLE VARIABLE=set_material_toolhead VALUE="'{TOOLHEAD}'"
  SAVE_VARIABLE VARIABLE=set_material_material VALUE="'{MATERIAL}'"
  SAVE_VARIABLE VARIABLE=set_material_feed_rate VALUE={mat.feed_rate|default(800)|float}
  SET_VELOCITY_LIMIT ACCEL={mat.accel|default(1000)|float}
  SET_VELOCITY_LIMIT SQUARE_CORNER_VELOCITY={mat.square_corner_velocity|default(5)|float}
  SET_GCODE_OFFSET Z={mat.z_offset|default(0)|float}
  M117 {TOOLHEAD}/{MATERIAL} ready
  RESPOND TYPE=command MSG="action:notify {TOOLHEAD}/{MATERIAL} ready (passive tool)"
