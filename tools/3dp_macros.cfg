######--- -- - 3d Printing - -- -- ########
###########################################

#######################################################################
#  SWITCHFLY FILAMENT-PATH SELECT (keeps servo + E-reversal in sync)
#######################################################################
# The G0/G1 overrides below reverse the extruder direction for path T1 by
# reading set_material_extruder_index. That value used to be written only
# by SET_PRINT at job start, so after any mid-print SWITCH_T0/SWITCH_T1
# (or a filament change) it was stale and E moves ran the wrong way. Every
# servo move to a filament path now goes through this helper, which moves
# the selector servo AND records the path in the same step.
[gcode_macro _SWITCHFLY_SET_PATH]
description: Move the SwitchFly selector servo to filament path 0 or 1 and record it for the G0/G1 E-reversal.
gcode:
  {% set PATH = params.PATH|default(0)|int %}
  {% if PATH not in [0, 1] %}
    { action_raise_error("_SWITCHFLY_SET_PATH: PATH must be 0 or 1") }
  {% endif %}
  SET_SERVO_ANGLE ANGLE={0 if PATH == 0 else 180}
  G4 P1000
  SAVE_VARIABLE VARIABLE=set_material_extruder_index VALUE={PATH}


#This macro accomodates too libraries that include Switchfly and BlockOne.
[gcode_macro SWITCH_T0]
description: Switch to filament 1 (T0) on SwitchFly
gcode:
  {% set _th = {} %}
  {% set _ = _th.update(printer["gcode_macro VARIABLES"].toolheads) %}
  {% set _ = _th.update(printer["gcode_macro CUSTOM_TOOLS"].toolheads) %}
    {% set MATERIAL = params.MATERIAL|default("PLA_0_4")|string %}
    {% set toolhead = "SwitchFly" %}

    # Debug: Log entry
    RESPOND MSG="Debug: SWITCH_T0 called with MATERIAL={MATERIAL}"

    # Access toolheads
    {% set toolheads = _th %}
    {% if toolhead not in toolheads %}
        RESPOND MSG="Error: Toolhead {toolhead} not found in toolheads"
        { action_raise_error("Invalid toolhead: " ~ toolhead) }
    {% endif %}
    {% set vars = toolheads[toolhead].materials.get(MATERIAL, {}) %}
    {% if vars == {} %}
        {% set MATERIAL = "PLA_0_4" %}
        {% set vars = toolheads[toolhead].materials["PLA_0_4"] %}
        RESPOND MSG="Debug: Invalid MATERIAL, defaulting to PLA_0_4"
    {% endif %}

    RESPOND MSG="Debug: SWITCH_T0 vars: extruder_temp={vars.extruder_temp}, purge_length={vars.purge_length}"

    M117 Switching to Tool 0

    # NOTE: no literal "T0"/"T1" toolchange here - this printer has a
    # single physical extruder stepper shared between two filament
    # paths (see tools/3dp.cfg), with a servo selecting which path
    # feeds the hotend. A bare "T1" command would error ("Unknown
    # command") since no [extruder1] section exists to register it.
    # The servo angle set below IS the actual tool selection.

    # Save state
    SAVE_GCODE_STATE NAME=tool_change_state

    # Lift Z
    G91
    G1 Z5 F5000
    G90

    # Retract
    G91
    G1 E-{vars.retraction_length|default(vars.load_length)} F{vars.retraction_speed|default(vars.load_speed)}

    # Engage path 0 and record it (keeps the G0/G1 E-reversal in sync)
    _SWITCHFLY_SET_PATH PATH=0

    # Set temperatures
    {% if printer.extruder.temperature < (vars.extruder_temp * 0.9) %}
        M104 S{vars.extruder_temp}
        M109 S{vars.extruder_temp}
    {% endif %}
    {% if printer.heater_bed.temperature < (vars.bed_temp * 0.9) %}
        M140 S{vars.bed_temp}
        M190 S{vars.bed_temp}
    {% endif %}

    # Load filament
    G91
    G1 E{vars.load_length} F{vars.load_speed}
    G4 P{vars.load_wait}
    G90

    # Purge at safe position
    #G1 X50 Y50 Z5 F9000
    PURGE TOOLHEAD="{toolhead}" MATERIAL_KEY="{MATERIAL}"

    # Restore state
    RESTORE_GCODE_STATE NAME=tool_change_state MOVE=1 MOVE_SPEED=100
  
[gcode_macro SWITCH_T1]
description: Switch to filament 2 (T1) on SwitchFly
gcode:
  {% set _th = {} %}
  {% set _ = _th.update(printer["gcode_macro VARIABLES"].toolheads) %}
  {% set _ = _th.update(printer["gcode_macro CUSTOM_TOOLS"].toolheads) %}
    {% set MATERIAL = params.MATERIAL|default("PLA_0_4")|string %}
    {% set toolhead = "SwitchFly" %}

    # Debug: Log entry
    RESPOND MSG="Debug: SWITCH_T1 called with MATERIAL={MATERIAL}"

    # Access toolheads
    {% set toolheads = _th %}
    {% if toolhead not in toolheads %}
        RESPOND MSG="Error: Toolhead {toolhead} not found in toolheads"
        { action_raise_error("Invalid toolhead: " ~ toolhead) }
    {% endif %}
    {% set vars = toolheads[toolhead].materials.get(MATERIAL, {}) %}
    {% if vars == {} %}
        {% set MATERIAL = "PLA_0_4" %}
        {% set vars = toolheads[toolhead].materials["PLA_0_4"] %}
        RESPOND MSG="Debug: Invalid MATERIAL, defaulting to PLA_0_4"
    {% endif %}

    RESPOND MSG="Debug: SWITCH_T1 vars: extruder_temp={vars.extruder_temp}, purge_length={vars.purge_length}"

    M117 Switching to Tool 1

    # NOTE: no literal "T0"/"T1" toolchange here - see SWITCH_T0 for why
    # (single shared extruder stepper, servo-selected filament path).

    # Save state
    SAVE_GCODE_STATE NAME=tool_change_state

    # Lift Z
    G91
    G1 Z5 F5000
    G90

    # Retract
    G91
    G1 E-{vars.retraction_length|default(vars.load_length)} F{vars.retraction_speed|default(vars.load_speed)}

    # Engage path 1 and record it (keeps the G0/G1 E-reversal in sync)
    _SWITCHFLY_SET_PATH PATH=1

    # Set temperatures
    {% if printer.extruder.temperature < (vars.extruder_temp * 0.9) %}
        M104 S{vars.extruder_temp}
        M109 S{vars.extruder_temp}
    {% endif %}
    {% if printer.heater_bed.temperature < (vars.bed_temp * 0.9) %}
        M140 S{vars.bed_temp}
        M190 S{vars.bed_temp}
    {% endif %}

    # Load filament
    G91
    G1 E{vars.load_length} F{vars.load_speed}
    G4 P{vars.load_wait}
    G90

    # Purge at safe position
    #G1 X50 Y50 Z5 F9000
    PURGE TOOLHEAD="{toolhead}" MATERIAL_KEY="{MATERIAL}"

    # Restore state
    RESTORE_GCODE_STATE NAME=tool_change_state MOVE=1 MOVE_SPEED=100


[gcode_macro G1]
description: Master Unified G1 Intercept Engine - Cohesive with DrumClock and noobydp
rename_existing: G1.1
gcode:
  {% set TOOLHEAD = printer.save_variables.variables.set_material_toolhead|default("BlockOne") %}
  {% set PATH = printer.save_variables.variables.set_material_extruder_index|default(0)|int %}

  # --------------------------------------------------------------------
  # CONDITION A: SwitchFly Active on Path 1 -> Apply Inverted E Rotation
  # --------------------------------------------------------------------
  {% if 'E' in params and TOOLHEAD == "SwitchFly" and PATH == 1 %}
    {% set raw_e = params.E|float %}
    {% set inverted_e = raw_e * -1.0 %}
    G1.1 {rawparams|replace("E" ~ params.E, "E" ~ inverted_e)}

  # --------------------------------------------------------------------
  # CONDITION B: HotJoe CNC Spindle Active -> Strip Extrusion Requests
  # --------------------------------------------------------------------
  {% elif TOOLHEAD == "HotJoe" %}
    {% if 'E' in params %}
      G1.1 {rawparams|replace("E" ~ params.E, "")}
    {% else %}
      G1.1 {rawparams}
    {% endif %}

  # --------------------------------------------------------------------
  # CONDITION C: All Other Configurations (BlockOne, Laser, DragKnife)
  # --------------------------------------------------------------------
  {% else %}
    G1.1 {rawparams}
  {% endif %}

[gcode_macro G0]
description: Master Unified G0 Intercept Engine - Cohesive with DrumClock and noobydp
rename_existing: G0.1
gcode:
  {% set TOOLHEAD = printer.save_variables.variables.set_material_toolhead|default("BlockOne") %}
  {% set PATH = printer.save_variables.variables.set_material_extruder_index|default(0)|int %}

  # --------------------------------------------------------------------
  # CONDITION A: SwitchFly Active on Path 1 -> Apply Inverted E Rotation
  # --------------------------------------------------------------------
  {% if 'E' in params and TOOLHEAD == "SwitchFly" and PATH == 1 %}
    {% set raw_e = params.E|float %}
    {% set inverted_e = raw_e * -1.0 %}
    G0.1 {rawparams|replace("E" ~ params.E, "E" ~ inverted_e)}

  # --------------------------------------------------------------------
  # CONDITION B: HotJoe CNC Spindle Active -> Strip Extrusion Requests
  # --------------------------------------------------------------------
  {% elif TOOLHEAD == "HotJoe" %}
    {% if 'E' in params %}
      G0.1 {rawparams|replace("E" ~ params.E, "")}
    {% else %}
      G0.1 {rawparams}
    {% endif %}

  # --------------------------------------------------------------------
  # CONDITION C: All Other Configurations (BlockOne, Laser, DragKnife)
  # --------------------------------------------------------------------
  {% else %}
    G0.1 {rawparams}
  {% endif %}


[gcode_macro CALCULATE_PA]
description: Auto-calculates the pressure advance for each material.
# BOWDEN_LENGTH in centimeters
# LAYER_HEIGHT and NOZZLE_SIZE in millimeters
# PRINT_SPEED in millimeters per second
gcode:
    {% set material = params.MATERIAL|default("PLA") %}
    {% set bowden_length_cm = params.BOWDEN_LENGTH|default(0.4)|float %} #use 75% of the retraction length for direct drive
    {% set bowden_length_dm = bowden_length_cm / 10 %}  # Convert cm to decimeters for consistency
    {% set layer_height = params.LAYER_HEIGHT|default(0.2)|float %}
    {% set nozzle_size = params.NOZZLE_SIZE|default(0.4)|float %}
    {% set line_width = params.LINE_WIDTH|default(nozzle_size * 1.2)|float %}
    {% set print_speed = params.PRINT_SPEED|default(60)|float %}
    {% set filament_diameter = params.FILAMENT_DIAMETER|default(1.75)|float %}
    {% set filament_area = 3.14159 * (filament_diameter / 2) ** 2 %}
    {% set flow_rate = line_width * layer_height * print_speed %}
    {% set material_constant = {
        'PLA': 85,
        'PETG': 100,
        'ABS': 95,
        'TPU': 140,
        'NYLON': 120,
        'ASA': 100,
        'PVB': 85,
        'PA': 120,
        'FLEX': 140
    }[material] %}
    {% set pressure_advance = (flow_rate * bowden_length_dm) / (material_constant * filament_area) %}
    SET_PRESSURE_ADVANCE ADVANCE={pressure_advance}

[gcode_macro PURGE]
description: Cohesive purge utility - automatically adapts to idle or mid-print configurations safely
gcode:
  {% set _th = {} %}
  {% set _ = _th.update(printer["gcode_macro VARIABLES"].toolheads) %}
  {% set _ = _th.update(printer["gcode_macro CUSTOM_TOOLS"].toolheads) %}
  {% set TOOLHEAD = params.TOOLHEAD|default("BlockOne") %}
  {% set NOZZLE_SIZE = params.NOZZLE_SIZE|default(0.4)|float %}
  {% set EXTRUDER = params.EXTRUDER|default(0)|int %}
  {% set toolheads = _th %}
  
  {% if not toolheads %}
    { action_raise_error("Missing toolheads configuration database") }
  {% endif %}
  {% if TOOLHEAD not in toolheads %}
    { action_raise_error("Invalid toolhead parameter passed: " ~ TOOLHEAD) }
  {% endif %}
  
  {% set extruder_count = toolheads[TOOLHEAD].extruder_count|default(1)|int %}

  # Standardize dynamic material key tracking
  {% if params.MATERIAL_KEY is defined %}
    {% set nozzle_key = params.MATERIAL_KEY %}
  {% else %}
    {% set MATERIAL = params.MATERIAL|default("PLA") %}
    {% set NOZZLE_SIZE_STR = "0_4" if NOZZLE_SIZE == 0.4 else "0_8" if NOZZLE_SIZE == 0.8 else NOZZLE_SIZE|string|replace(".", "_") %}
    {% set nozzle_key = MATERIAL ~ "_" ~ NOZZLE_SIZE_STR %}
    {% if extruder_count > 1 %}
      {% set nozzle_key = nozzle_key ~ "_T" ~ EXTRUDER %}
    {% endif %}
  {% endif %}

  {% set vars = toolheads[TOOLHEAD].materials.get(nozzle_key, {}) %}
  {% if vars == {} %}
    { action_raise_error("Material key " ~ nozzle_key ~ " not verified in toolhead definitions.") }
  {% endif %}
  
  {% set purge_length = vars.get("purge_length", 10.0)|float %}
  {% set purge_wait = vars.get("purge_wait", 2000)|int %}
  {% set extruder_temp = vars.get("extruder_temp", 200)|float %}
  {% set min_extrude_temp = printer.extruder.min_extrude_temp|default(170)|float %}

  # Step 1: Ensure operational extrusion temperatures
  {% if printer.extruder.temperature < min_extrude_temp %}
    M117 Heating extruder for purge...
    M109 S{extruder_temp}
  {% endif %}

  # Step 2: Absolute Homing Safety Net
  {% if "xyz" not in printer.toolhead.homed_axes %}
    G28
  {% endif %}

  # Step 3: Validate coordinate boundaries
  {% set max_x = printer.toolhead.axis_maximum.x|float %}
  {% set max_y = printer.toolhead.axis_maximum.y|float %}
  {% set purge_x = vars.get("purge_x", max_x - 10)|float %}
  {% set purge_y = vars.get("purge_y", max_y - 10)|float %}
  
  {% if purge_x > max_x or purge_y > max_y %}
    { action_raise_error("Safety Block: Configured purge targets exceed physical gantry boundaries.") }
  {% endif %}

  # ====================================================================
  # 🔒 COHESIVE SMART DYNAMIC Z-AXIS PROTECTION
  # ====================================================================
  # If a job is active or paused, maintain current layer height + clearance gap. 
  # Otherwise (idle setup), default safely down to a constant Z5 location.
  {% if printer.print_stats.state in ["printing", "paused"] %}
    RESPOND MSG="ℹ️ Mid-print tool change detected. Preserving active model layer height."
    G90
    G1 X{purge_x} Y{purge_y} F9000   # Travel to purge coords without changing Z
  {% else %}
    RESPOND MSG="ℹ️ Printer idle. Moving to baseline purge coordinates at Z5."
    G90
    G1 X{purge_x} Y{purge_y} Z5 F9000 # Normal baseline homing purge travel
  {% endif %}

  # Step 4: Perform the physical extrusion execution loop
  G91
  G1 E{purge_length} F300
  G4 P{purge_wait}
  G90

  M117 Purge complete for {nozzle_key}


[gcode_macro PRIME_LINE]
description: Draw a 120mm prime line on the left side of the bed for the specified toolhead and material
gcode:
  {% set _th = {} %}
  {% set _ = _th.update(printer["gcode_macro VARIABLES"].toolheads) %}
  {% set _ = _th.update(printer["gcode_macro CUSTOM_TOOLS"].toolheads) %}
  {% set TOOLHEAD = params.TOOLHEAD|default(printer.save_variables.variables.set_material_toolhead|default("BlockOne"))|string %}
  {% set MATERIAL = params.MATERIAL|default(printer.save_variables.variables.set_material_material|default("PLA"))|string %}
  {% set NOZZLE_SIZE = params.NOZZLE_SIZE|default(printer.save_variables.variables.set_material_nozzle_size|default(0.4))|float %}
  {% set EXTRUDER = params.EXTRUDER|default(printer.save_variables.variables.set_material_extruder_index|default(0))|int %}
  {% set call_id = printer.gcode.script_counter|default(0)|int + 1 %}

  {% set extruder_temp = printer.save_variables.variables.set_material_extruder_temp|default(200)|float %}
  # Heat extruder
  M109 S{extruder_temp}


  # Debug: Log entry
  RESPOND TYPE=command MSG="PRIME_LINE: Starting, TOOLHEAD={TOOLHEAD}, MATERIAL={MATERIAL}, NOZZLE_SIZE={NOZZLE_SIZE}, EXTRUDER={EXTRUDER}"

  # Validate toolhead
  {% if TOOLHEAD not in _th %}
    { action_raise_error("PRIME_LINE: Toolhead " ~ TOOLHEAD ~ " not found") }
  {% endif %}

  # Construct material key to match variables.cfg
  {% set NOZZLE_SIZE_STR = "0_4" if NOZZLE_SIZE|float == 0.4 else "0_8" if NOZZLE_SIZE|float == 0.8 else NOZZLE_SIZE|replace(".", "_") %}
  {% set material_key = MATERIAL ~ '_' ~ NOZZLE_SIZE_STR %}
  {% if TOOLHEAD == "SwitchFly" %}
    {% set material_key = material_key ~ '_T' ~ EXTRUDER %}
  {% endif %}

  # Validate material
  {% if material_key not in _th[TOOLHEAD].materials %}
    { action_raise_error("PRIME_LINE: Material " ~ material_key ~ " not found for " ~ TOOLHEAD) }
  {% endif %}

  # Select filament path for SwitchFly (servo, not a real T-command -
  # see SWITCH_T0/SWITCH_T1 for why)
  {% if TOOLHEAD == "SwitchFly" %}
    _SWITCHFLY_SET_PATH PATH={EXTRUDER}
  {% endif %}

  M117 Prime line initiated for {TOOLHEAD}/{MATERIAL}...
  RESPOND TYPE=command MSG="action:notify Prime line for {TOOLHEAD}/{MATERIAL} initiated."

  # Set absolute positioning
  G90

  # Move to safe Z height first
  G1 Z10 F6000
  # Move to start position (X=5, Y=10, Z=0.2)
  G1 X5 Y10 Z0.2 F4000

  # Calculate extrusion amount for 120mm line
  {% set layer_height = 0.2 %}
  {% set line_width = NOZZLE_SIZE %}
  {% set line_length = 120 %}
  {% set filament_diameter = 1.75 %}  ; Adjust if using 2.85mm
  {% set extruder_amount = (line_length * layer_height * line_width) / (3.14159 * filament_diameter * filament_diameter / 4) * 1.2 %}  ; 10% extra for priming

  # Start extrusion and draw line to Y=130
  G1 Y130 E{extruder_amount} F1200  ; Extrude at 20mm/s

  # Stop extrusion and retract
  G1 E-{extruder_amount * 0.1} F1800  ; Retract 10%

  # Move to initial layer height (Z=0.2) for print start
  G1 Z0.2 F6000
  G1 F1000

  # Z offset for the print (same as SET_PRINT applied before the line)
  _RHINO_APPLY_Z TOOLHEAD={TOOLHEAD} KEY={material_key}

  M117 Prime line complete
  RESPOND TYPE=command MSG="action:notify Prime line complete for {TOOLHEAD} {MATERIAL}"

  # Debug: Log exit
  RESPOND TYPE=command MSG="PRIME_LINE COMPLETED"


# ====================================================================
# NOZZLE HEIGHT (paper test) - one calibration per print head
# ====================================================================
# Each print head has its own capacitive probe, so each one triggers at its own height above the bed.
# NOZZLE_HEIGHT_CALIBRATE finds, for the mounted print head, the Z where the nozzle just pinches a sheet
# of paper, and saves it (rhino_zcal_<tool> in variables.save). Every print with that head then uses it
# as its Z offset (see _RHINO_APPLY_Z), so the prime line is no longer the place to find the bed.
# Redo it after changing a nozzle or moving/adjusting that head's probe. Do NOT use Mainsail's Z-offset
# "Save" button: it writes [probe] z_offset with SAVE_CONFIG, which would shift every head at once.
[gcode_macro NOZZLE_HEIGHT_CALIBRATE]
description: Paper test for the mounted print head - sets how high the nozzle is above the bed for every print with it.
variable_paper: 0.10     # paper thickness (mm); printer paper is about 0.1
variable_x: 307.5        # test spot: where the probe touches when Z homes (safe_z_home 287.5,203 + probe offset 20,5)
variable_y: 208.0
variable_start_z: 5.0    # first height shown (mm above the probe's zero) - always well clear of the bed
variable_tool: ''
gcode:
  {% set _tm = {} %}
  {% set _ = _tm.update(printer["gcode_macro VARIABLES"].tool_mapping) %}
  {% set _ = _tm.update(printer["gcode_macro CUSTOM_TOOLS"].tool_mapping) %}
  {% set _th = {} %}
  {% set _ = _th.update(printer["gcode_macro VARIABLES"].toolheads) %}
  {% set _ = _th.update(printer["gcode_macro CUSTOM_TOOLS"].toolheads) %}
  {% set c = printer["gcode_macro NOZZLE_HEIGHT_CALIBRATE"] %}
  {% set name = _tm.get(printer["gcode_macro SWAP_TOOL"].current_tool|int, "") %}
  {% if printer.print_stats.state in ["printing", "paused"] %}
    { action_raise_error("NOZZLE_HEIGHT_CALIBRATE: a job is running. Finish or cancel it first.") }
  {% endif %}
  {% if name == "" %}
    { action_raise_error("NOZZLE_HEIGHT_CALIBRATE: no toolhead confirmed. Answer the 'which toolhead is mounted?' question (RESTORE_TOOL) first.") }
  {% endif %}
  {% if _th.get(name, {}).get("type", "") != "DEPOSITION" %}
    { action_raise_error("NOZZLE_HEIGHT_CALIBRATE is for print heads. " ~ name ~ " is mounted - swap to BlockOne or SwitchFly first.") }
  {% endif %}
  SET_GCODE_VARIABLE MACRO=NOZZLE_HEIGHT_CALIBRATE VARIABLE=tool VALUE="'{name}'"
  RESPOND MSG="Nozzle height for {name}: homing, then moving to the middle of the bed. Clean any plastic off the nozzle tip."
  G28                       ; always: Z must come from THIS head's probe
  SET_GCODE_OFFSET Z=0      ; measure in plain machine Z
  G90
  G1 Z10 F600
  G1 X{c.x} Y{c.y} F6000
  G1 Z{c.start_z} F600
  _NOZZLE_Z_PROMPT Z={c.start_z}

[gcode_macro _NOZZLE_Z_PROMPT]
description: The paper-test window (redrawn after every move).
gcode:
  {% set c = printer["gcode_macro NOZZLE_HEIGHT_CALIBRATE"] %}
  {% set z = params.Z|float %}
  RESPOND TYPE=command MSG="action:prompt_begin Nozzle height - {c.tool}"
  RESPOND TYPE=command MSG="action:prompt_text Slide a sheet of paper between the nozzle and the bed. Use Down to bring the nozzle closer until the paper drags lightly as you slide it, then press Save."
  RESPOND TYPE=command MSG="action:prompt_text Nozzle at Z {'%.2f' % z}"
  {% if z <= printer.toolhead.axis_minimum.z|float + 0.06 %}
    RESPOND TYPE=command MSG="action:prompt_text This is the lowest Z allowed (position_min in [stepper_z]). If the paper is still loose, this head's probe triggers too high - lower position_min or the probe."
  {% endif %}
  RESPOND TYPE=command MSG="action:prompt_button_group_start"
  RESPOND TYPE=command MSG="action:prompt_button Down 1|_NOZZLE_Z_MOVE D=-1|warning"
  RESPOND TYPE=command MSG="action:prompt_button Down 0.1|_NOZZLE_Z_MOVE D=-0.1|warning"
  RESPOND TYPE=command MSG="action:prompt_button Down 0.02|_NOZZLE_Z_MOVE D=-0.02|warning"
  RESPOND TYPE=command MSG="action:prompt_button_group_end"
  RESPOND TYPE=command MSG="action:prompt_button_group_start"
  RESPOND TYPE=command MSG="action:prompt_button Up 1|_NOZZLE_Z_MOVE D=1|info"
  RESPOND TYPE=command MSG="action:prompt_button Up 0.1|_NOZZLE_Z_MOVE D=0.1|info"
  RESPOND TYPE=command MSG="action:prompt_button Up 0.02|_NOZZLE_Z_MOVE D=0.02|info"
  RESPOND TYPE=command MSG="action:prompt_button_group_end"
  RESPOND TYPE=command MSG="action:prompt_button Save - the paper drags|_NOZZLE_Z_SAVE|primary"
  RESPOND TYPE=command MSG="action:prompt_footer_button Cancel|_NOZZLE_Z_CANCEL|error"
  RESPOND TYPE=command MSG="action:prompt_show"

[gcode_macro _NOZZLE_Z_MOVE]
description: Paper test - move the nozzle by D mm (negative = closer to the bed), never below Z's travel limit.
gcode:
  {% set d = params.D|float %}
  {% set z = printer.toolhead.position.z %}
  {% set zmin = printer.toolhead.axis_minimum.z|float + 0.05 %}
  {% set nz = [[z + d, zmin]|max, 20.0]|min %}
  G90
  G1 Z{'%.3f' % nz} F300
  _NOZZLE_Z_PROMPT Z={nz}

[gcode_macro _NOZZLE_Z_SAVE]
description: Paper test - save where the nozzle touches the bed for the mounted print head.
gcode:
  {% set c = printer["gcode_macro NOZZLE_HEIGHT_CALIBRATE"] %}
  {% set touch = printer.toolhead.position.z - c.paper|float %}
  RESPOND TYPE=command MSG="action:prompt_end"
  SAVE_VARIABLE VARIABLE=rhino_zcal_{c.tool|lower} VALUE={'%.3f' % touch}
  SET_GCODE_OFFSET Z={'%.3f' % touch}
  G91
  G1 Z5 F600
  G90
  RESPOND MSG="Nozzle height saved for {c.tool}: the nozzle touches the bed at Z {'%.3f' % touch} (paper {c.paper} mm allowed for). Every print with {c.tool} now uses it."

[gcode_macro _NOZZLE_Z_CANCEL]
description: Paper test - stop without saving.
gcode:
  {% set c = printer["gcode_macro NOZZLE_HEIGHT_CALIBRATE"] %}
  {% set sv = printer.save_variables.variables %}
  RESPOND TYPE=command MSG="action:prompt_end"
  G91
  G1 Z5 F600
  G90
  {% set key = "rhino_zcal_" ~ c.tool|lower %}
  {% if key in sv %}
    SET_GCODE_OFFSET Z={sv[key]}
  {% endif %}
  RESPOND MSG="Nozzle height: cancelled, nothing saved."

[gcode_macro _RHINO_APPLY_Z]
description: Set the Z offset for a print head + material - its paper-test height plus an optional per-material fine-tune; without a paper test, the old per-material z_offset.
gcode:
  {% set _th = {} %}
  {% set _ = _th.update(printer["gcode_macro VARIABLES"].toolheads) %}
  {% set _ = _th.update(printer["gcode_macro CUSTOM_TOOLS"].toolheads) %}
  {% set tool = params.TOOLHEAD %}
  {% set key = params.KEY %}
  {% set sv = printer.save_variables.variables %}
  {% set cal = "rhino_zcal_" ~ tool|lower %}
  {% if cal in sv %}
    {% set fine = sv.get(("rhino_zfine_" ~ tool ~ "_" ~ key)|lower, 0.0)|float %}
    {% set z = sv[cal]|float + fine %}
    SET_GCODE_OFFSET Z={'%.3f' % z}
    RESPOND MSG="Z offset {'%.3f' % z} mm for {tool}/{key} (paper test {'%.3f' % sv[cal]|float}, fine-tune {'%.3f' % fine})"
  {% else %}
    {% set dyn = tool ~ '_' ~ key|lower ~ '_z_offset' %}
    {% if dyn in sv %}
      {% set z = sv[dyn]|float %}
    {% else %}
      {% set z = _th[tool].materials.get(key, {}).get("z_offset", 0)|float %}
    {% endif %}
    SET_GCODE_OFFSET Z={z}
    RESPOND TYPE=error MSG="{tool} has no nozzle height calibration - using the old {key} offset {z} mm. Run NOZZLE_HEIGHT_CALIBRATE with {tool} mounted."
  {% endif %}
