# M3/M4/M5 moved to tools/tool_power.cfg (one dispatcher for laser / spindle / custom tools).
# The laser branch there still scales S against VARIABLES.laser_s_max and calls SET_LASER_POWER.

# ====================================================================
# 🔒 SECTION 2: PHYSICAL INTERCEPT & INFRASTRUCTURE OVERLAYS
# ====================================================================

[gcode_macro SET_LASER_POWER]
description: Set the laser intensity (Range: 0-1) - Hardware State Verification Lockout
gcode:
  # 🔍 DISPATCH SOURCE OF TRUTH CHECK
  {% set physical_slot = printer["gcode_macro SWAP_TOOL"].current_tool|int %}
  {% set tool_mapping = printer["gcode_macro VARIABLES"].tool_mapping %}
  {% set physical_name = tool_mapping.get(physical_slot, "Unknown") %}

  # CRITICAL HARDWARE SAFETY SHIELD
  {% if physical_name != "LightSaber" %}
    # Force the laser pins off, THEN raise. The raise has to be a separate macro: raising inside
    # this template aborts the render, so the SET_PINs that used to sit above it never ran.
    SET_PIN PIN=LASER_INITIALIZE VALUE=0.0
    {% if physical_name != "SwitchFly" %}
      SET_PIN PIN=SERVO_LASER VALUE=0.0 ; (SwitchFly shares this pin as its path servo - leave it)
    {% endif %}
    _TOOL_REJECT MSG="CRITICAL SAFETY BLOCK: Laser command rejected! LightSaber is not physically mounted on the machine."
  {% endif %}

  {% if params.POWER is defined %}
    {% set power = params.POWER|float %}
    {% if power >= 0 and power <= 1 %}
      # Optimized: Stripped LEDFLASH to prevent high-frequency streaming processor stalls
      SET_PIN PIN=SERVO_LASER VALUE={power} PWM_CYCLE_TIME=0.0001
    {% else %}
      { action_respond_info("SET_LASER_POWER Error: POWER parameter must range between 0.0 and 1.0") }
    {% endif %}
  {% else %}
    { action_respond_info("SET_LASER_POWER Error: POWER parameter missing.") }
  {% endif %}

[gcode_macro ACTIVATE_LASER]
description: Initialize the laser module power rails safely
gcode:
  {% set physical_slot = printer["gcode_macro SWAP_TOOL"].current_tool|int %}
  {% set tool_mapping = printer["gcode_macro VARIABLES"].tool_mapping %}
  {% set physical_name = tool_mapping.get(physical_slot, "Unknown") %}

  {% if physical_name == "LightSaber" %}
    RESPOND MSG="⚡ Initializing LightSaber power rails..."
    SET_PIN PIN=LASER_INITIALIZE VALUE=1.0 PWM_CYCLE_TIME=0.0001
    LEDFLASH
  {% else %}
    { action_raise_error("Activation Denied: Cannot energize laser pins while " ~ physical_name ~ " is mounted.") }
  {% endif %}

[gcode_macro DEACTIVATE_LASER]
description: Power down the laser module cycle rails safely
gcode:
  M5 # Enforce immediate 0% duty cycle signal first
  SET_PIN PIN=LASER_INITIALIZE VALUE=0.0 PWM_CYCLE_TIME=0.0001
  LEDFLASH
  RESPOND MSG="❄️ Laser module rails fully de-energized."


# ====================================================================
# 🧭 SECTION 3: REFACTORED COORDINATE PLANE COHESION (WORKFLOW HOOKS)
# ====================================================================

[gcode_macro LASERHOME]
description: Home X/Y if needed with the laser mounted (never Z). Set the focus height with SET_Z_ZERO.
gcode:
  LEDMIN
  _RHINO_HOME_SAFE RESUME=LASERHOME ; never homes Z with the laser mounted
  # No Z move here any more: Z20 brought the bed up toward the laser. Focus is set by eye with SET_Z_ZERO.
  RESPOND MSG="🧭 Laser X/Y homed. Set the focus height with SET_Z_ZERO (or LASER_JOB_SETUP)."


# ====================================================================
# 🎛️ SECTION 4: DESIGNER FEATURE: VISUAL WORKFLOW FOCUS WINDOW
# ====================================================================

[gcode_macro LASER_FOCUS_ALIGN]
description: Interactive UI dashboard utility to safely fire a weak test beam for focal testing and material zeroing
gcode:
  {% set physical_slot = printer["gcode_macro SWAP_TOOL"].current_tool|int %}
  {% set tool_mapping = printer["gcode_macro VARIABLES"].tool_mapping %}
  {% set physical_name = tool_mapping.get(physical_slot, "Unknown") %}

  {% if physical_name != "LightSaber" %}
    { action_raise_error("Focus utility blocked: Physically mounted toolhead is not LightSaber.") }
  {% endif %}

  # Open graphical layout panel to prevent unexpected behavior
  RESPOND TYPE=command MSG="action:prompt_begin LightSaber focus dot"
  RESPOND TYPE=command MSG="action:prompt_text Put on laser glasses first."
  RESPOND TYPE=command MSG="action:prompt_text The focus dot runs the laser at 1% so you can see where it points."
  
  RESPOND TYPE=command MSG="action:prompt_button Focus dot ON (1%)|_LASER_FOCUS_ON|warning"
  RESPOND TYPE=command MSG="action:prompt_button Focus dot OFF|_LASER_FOCUS_OFF|primary"
  RESPOND TYPE=command MSG="action:prompt_footer_button Close (dot off)|_LASER_FOCUS_OFF|info"
  RESPOND TYPE=command MSG="action:prompt_show"

[gcode_macro _LASER_FOCUS_ON]
gcode:
  # Energize the main rails if they aren't on yet
  SET_PIN PIN=LASER_INITIALIZE VALUE=1.0 PWM_CYCLE_TIME=0.0001
  # Fire at a weak, visually trackable but safe 1% duty cycle power density limit
  SET_PIN PIN=SERVO_LASER VALUE=0.01 PWM_CYCLE_TIME=0.0001
  RESPOND MSG="🚨 Warning: Focus beam active at ultra-low density 1% power."
  LASER_FOCUS_ALIGN # Re-render menu block loop

[gcode_macro _LASER_FOCUS_OFF]
gcode:
  SET_PIN PIN=SERVO_LASER VALUE=0.0 PWM_CYCLE_TIME=0.0001
  RESPOND MSG="✅ Alignment beam turned off successfully."
  RESPOND TYPE=command MSG="action:prompt_end"