# M3/M5 used to be defined here AND in laser_macros.cfg. Klipper merges duplicate
# sections and the later include (laser) won, so these never ran. The single
# M3/M4/M5 now lives in tools/tool_power.cfg and dispatches on the mounted tool type.

# ====================================================================
# 🔒 SECTION 2: HARDWARE-GATED MOTOR OVERRIDES
# ====================================================================

[gcode_macro Spindle_ACTIVATE]
description: Initialize spindle power rails and set throttle to arming state (0% speed)
gcode:  
  # 🔍 COHESIVE CHECK: READ THE ACTUAL SLOT INDEX TRACKED BY THE PHYSICAL WIZARD
  {% set physical_slot = printer["gcode_macro SWAP_TOOL"].current_tool|int %}
  {% set tool_mapping = printer["gcode_macro VARIABLES"].tool_mapping %}
  {% set physical_name = tool_mapping.get(physical_slot, "Unknown") %}

  # CRITICAL CNC HARDWARE SHIELD
  {% if physical_name != "HotJoe" %}
    # Emergency Failsafe: Force shutdown of the power relay instantly
    SET_PIN PIN=Spindle_power VALUE=0
    SET_PIN PIN=SPINDLE_SPEED VALUE=0.3 PWM_CYCLE_TIME=0.0025
    _TOOL_REJECT MSG="CRITICAL SAFETY BLOCK: Spindle command rejected! HotJoe is not physically mounted."
  {% else %}
    RESPOND MSG="⚡ Energizing HotJoe CNC spindle power rails..."
    SET_PIN PIN=Spindle_power VALUE=1
    # 0.3 corresponds to the low endpoint (neutral/arm state) on a 400Hz frequency cycle
    SET_PIN PIN=SPINDLE_SPEED VALUE=0.3 PWM_CYCLE_TIME=0.0025
  {% endif %}

[gcode_macro Spindle_DEACTIVATE]
description: Kill power to spindle relay and drop ESC signal to safe baseline
gcode:  
  RESPOND MSG="❄️ De-energizing spindle and clearing throttle lines..."
  SET_PIN PIN=Spindle_power VALUE=0
  SET_PIN PIN=SPINDLE_SPEED VALUE=0.3 PWM_CYCLE_TIME=0.0025


# ====================================================================
# 🎛️ SECTION 3: DESIGNER FEATURE: INTERACTIVE ESC CALIBRATION WIZARD
# ====================================================================

[gcode_macro CALIBRATE_ESC]
description: Guided visual wizard to synchronize the ESC throttle range endpoints with Klipper
gcode:
  {% set physical_slot = printer["gcode_macro SWAP_TOOL"].current_tool|int %}
  {% set tool_mapping = printer["gcode_macro VARIABLES"].tool_mapping %}
  {% set physical_name = tool_mapping.get(physical_slot, "Unknown") %}

  {% if physical_name != "HotJoe" %}
    { action_raise_error("Calibration blocked: Physically mounted toolhead is not HotJoe.") }
  {% endif %}

  # Open a modern windowed prompt dashboard view to guide the user safely
  RESPOND TYPE=command MSG="action:prompt_begin 🛠️ CNC ESC Throttle Calibration Wizard"
  RESPOND TYPE=command MSG="action:prompt_text WARNING: Ensure the spindle bit/cutter tool is COMPLETELY REMOVED before calibrating!"
  RESPOND TYPE=command MSG="action:prompt_text "
  RESPOND TYPE=command MSG="action:prompt_text Step 1: Disconnect power to the ESC or machine if prompted by your hardware."
  RESPOND TYPE=command MSG="action:prompt_text Step 2: Click the 'Set High Endpoint' button below to send full throttle."
  
  RESPOND TYPE=command MSG="action:prompt_button 📈 Step 2: Set High Endpoint (1.0)|_ESC_HIGH_THROTTLE|warning"
  RESPOND TYPE=command MSG="action:prompt_footer_button Exit Calibration|_ESC_EXIT|info"
  RESPOND TYPE=command MSG="action:prompt_show"

[gcode_macro _ESC_HIGH_THROTTLE]
gcode:
  RESPOND TYPE=command MSG="action:prompt_end"
  
  # Turn on the power relay and set the signal pulse width to maximum (1.0)
  SET_PIN PIN=Spindle_power VALUE=1
  SET_PIN PIN=SPINDLE_SPEED VALUE=1.0 PWM_CYCLE_TIME=0.0025
  
  RESPOND TYPE=command MSG="action:prompt_begin 🛠️ Step 3: High Endpoint Set"
  RESPOND TYPE=command MSG="action:prompt_text Spindle signal line is now outputting maximum high pulse (1.0)."
  RESPOND TYPE=command MSG="action:prompt_text "
  RESPOND TYPE=command MSG="action:prompt_text Step 3: Power up your ESC now. Listen for the synchronization beeps."
  RESPOND TYPE=command MSG="action:prompt_text Step 4: Immediately after the musical initialization tones finish, click below."
  
  RESPOND TYPE=command MSG="action:prompt_button 📉 Step 4: Set Low Endpoint (0.3)|_ESC_LOW_THROTTLE|primary"
  RESPOND TYPE=command MSG="action:prompt_show"

[gcode_macro _ESC_LOW_THROTTLE]
gcode:
  RESPOND TYPE=command MSG="action:prompt_end"
  
  # Drop signal back down to neutral/arm floor limit (0.3)
  SET_PIN PIN=SPINDLE_SPEED VALUE=0.3 PWM_CYCLE_TIME=0.0025
  LEDFLASH
  
  RESPOND TYPE=command MSG="action:prompt_begin 🛠️ Calibration Complete"
  RESPOND TYPE=command MSG="action:prompt_text The ESC should play a validation tone confirming the low endpoint has been indexed."
  RESPOND TYPE=command MSG="action:prompt_text "
  RESPOND TYPE=command MSG="action:prompt_text Your controller board and ESC endpoints are now fully synchronized."
  RESPOND TYPE=command MSG="action:prompt_footer_button Finish & Save State|_ESC_EXIT|success"
  RESPOND TYPE=command MSG="action:prompt_show"

[gcode_macro _ESC_EXIT]
gcode:
  RESPOND TYPE=command MSG="action:prompt_end"
  Spindle_DEACTIVATE

# ====================================================================
# 🗃️ SECTION 1: WORKSPACE COORDINATE STORAGE (G54 OVERLAYS)
# ====================================================================

[gcode_macro G54]
description: Select Work Coordinate System 1 (G54 Zero Offset Plane)
gcode:
  # Pull stored offsets directly out of your variables.cfg file
  {% set offset_x = printer.save_variables.variables.cnc_g54_x|default(0.0)|float %}
  {% set offset_y = printer.save_variables.variables.cnc_g54_y|default(0.0)|float %}
  {% set offset_z = printer.save_variables.variables.cnc_g54_z|default(0.0)|float %}
  
  # Inject them safely into Klipper's live transform engine
  SET_GCODE_OFFSET X={offset_x} Y={offset_y} Z={offset_z} MOVE=1
  RESPOND MSG="🧭 CNC Workspace: Switched to G54 Work Coordinates [X:{offset_x} Y:{offset_y} Z:{offset_z}]"

[gcode_macro SET_WORK_ZERO]
description: noobydp principle: Sets the current physical position as your workpiece 0,0,0 coordinate
gcode:
  {% set physical_slot = printer["gcode_macro SWAP_TOOL"].current_tool|int %}
  {% set tool_mapping = printer["gcode_macro VARIABLES"].tool_mapping %}
  {% set physical_name = tool_mapping.get(physical_slot, "Unknown") %}

  {% if physical_name != "HotJoe" %}
    { action_raise_error("Operation blocked: Cannot set a CNC coordinate matrix while " ~ physical_name ~ " is mounted.") }
  {% endif %}

  # Capture raw stepper tracking data relative to homed absolute machine coordinates
  {% set raw_x = printer.gcode_move.gcode_position.x|float %}
  {% set raw_y = printer.gcode_move.gcode_position.y|float %}
  {% set raw_z = printer.gcode_move.gcode_position.z|float %}

  # Commit these reference points to disk memory
  SAVE_VARIABLE VARIABLE=cnc_g54_x VALUE={raw_x}
  SAVE_VARIABLE VARIABLE=cnc_g54_y VALUE={raw_y}
  SAVE_VARIABLE VARIABLE=cnc_g54_z VALUE={raw_z}

  # Instantly refresh live offsets to avoid movement lag
  G54

# ====================================================================
# 🧭 SECTION 3: WORKPIECE PROBING UTILITIES (TOUCH PLATE NAVIGATION)
# ====================================================================

[gcode_macro PROBE_Z_WORK_ZERO]
description: Automated tool-tip probe sequence to lock in material surface Z-height
gcode:
  {% set plate_thickness = params.THICKNESS|default(10.0)|float %} # e.g. a 10mm aluminum touch block
  
  # Ensure machine is homed before probing
  _RHINO_HOME_SAFE ; never homes Z with this tool mounted

  RESPOND MSG="🔍 Commencing tool-tip probe check. Ensure probe clip is attached to spindle shank!"
  G91                    # Relative positioning
  G38.2 Z-30 F100        # Move down up to 30mm looking for touch plate strike contact
  G90
  # The contact height must be read AFTER the probe move. Klipper fills in every {...} in a
  # macro before its first line runs, so reading it here would give the height before probing.
  # _CNC_SAVE_TOUCH_Z is rendered only when it is called, i.e. after G38.2 has finished.
  _CNC_SAVE_TOUCH_Z THICKNESS={plate_thickness}

  # Lift up 5mm relatively for safe transit clearance
  G91
  G1 Z5 F600
  G90                    # Restore Absolute coordinates mode
  
  G54                    # Instantly reload WCS variables
  RESPOND MSG="✅ CNC Z-Axis zero point locked at material surface face height."

[gcode_macro _CNC_SAVE_TOUCH_Z]
description: Helper - saves cnc_g54_z from where the touch-plate probe stopped. Call right after G38.2.
gcode:
  {% set plate_thickness = params.THICKNESS|default(10.0)|float %}
  # Machine position (no G-code offset), so an older G54 offset does not leak into the new one.
  {% set touch_z = printer.toolhead.position.z|float %}
  {% set material_surface_z = touch_z - plate_thickness %}
  SAVE_VARIABLE VARIABLE=cnc_g54_z VALUE={material_surface_z}
  RESPOND MSG="Touch plate contact at Z={'%.3f' % touch_z} - material surface Z={'%.3f' % material_surface_z} saved"
