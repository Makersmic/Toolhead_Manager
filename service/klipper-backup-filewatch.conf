# Rhino Tool Manager: runs klipper-backup's file watcher through scripts/rhino_backup_watch.sh, which turns a burst of
# changes into one backup. install.sh fills in @SCRIPT@ and installs this as
# /etc/systemd/system/klipper-backup-filewatch.service.d/rhino.conf. klipper-backup's own service file and scripts
# aren't changed, and uninstall.sh removes this. The empty ExecStart= is how systemd clears the original command.
[Service]
ExecStart=
ExecStart=/bin/bash @SCRIPT@
Restart=on-failure
RestartSec=30
