# Runs klipper-backup (commits + pushes printer_data/config to your GitHub backup repo).
# Console:  BACKUP_CFG            or   BACKUP_CFG MSG=after_tool_swap_fix
# END_PRINT also runs it after any job longer than 2 hours.
# Assumes the default install path /home/pi/klipper-backup - change it if your user differs.
[gcode_shell_command backup_cfg]
command: bash /home/pi/klipper-backup/script.sh
timeout: 120.
verbose: True

[gcode_macro BACKUP_CFG]
description: Back up printer_data/config to GitHub via klipper-backup (optional MSG= commit message, no spaces).
gcode:
    {% if params.MSG is defined %}
        RUN_SHELL_COMMAND CMD=backup_cfg PARAMS="{params.MSG}"
    {% else %}
        RUN_SHELL_COMMAND CMD=backup_cfg
    {% endif %}
    RESPOND MSG="klipper-backup started - watch this console for its output"

[gcode_macro SHOW_BACKUP_LOCATION]
description: Displays where your config files are being backed up
# 👇 EDIT THESE THREE VARIABLES TO MATCH YOUR ACTUAL SETUP
variable_github_username: "Makersmic"
variable_github_repo: "rhino-backup"
variable_pi_username: "pi" 
gcode:
  # Open a styled modal prompt window on screen
  RESPOND TYPE=command MSG="action:prompt_begin Where backups go"
  
  # Section 1: Remote Location (GitHub)
  RESPOND TYPE=command MSG="action:prompt_text GitHub:"
  RESPOND TYPE=command MSG="action:prompt_text https://github.com/{github_username}/{github_repo}"
  
  # Section 2: Local Paths on the machine
  RESPOND TYPE=command MSG="action:prompt_text On the Pi:"
  RESPOND TYPE=command MSG="action:prompt_text - Config folder: /home/{pi_username}/printer_data/config/"
  RESPOND TYPE=command MSG="action:prompt_text - Backup script: /home/{pi_username}/klipper-backup/script.sh"
  RESPOND TYPE=command MSG="action:prompt_text - Local backup copy: /home/{pi_username}/config_backup/"
  
  # Footer exit button
  RESPOND TYPE=command MSG="action:prompt_footer_button Close|action:prompt_end|info"
  RESPOND TYPE=command MSG="action:prompt_show"

[delayed_gcode PREFLIGHT_BACKUP_CHECK]
initial_duration: 5.0  # Runs automatically 5 seconds after Klipper initializes
gcode:
  # Klipper's Jinja has no way to capture a shell command's output (the old version
  # called tc.run_shell_command, which does not exist and errored on every boot).
  # verbose: True on the shell command prints curl's reply in the console instead.
  RUN_SHELL_COMMAND CMD=verify_github_handshake

# Writes myrhino/custom_tools.cfg for ADD_TOOLHEAD / EDIT_TOOLHEAD / REMOVE_TOOLHEAD.
# Assumes the default config path /home/pi/printer_data/config - change it if your user differs.
[gcode_shell_command rhino_toolgen]
command: python3 /home/pi/printer_data/config/scripts/rhino_toolgen.py
timeout: 20.
verbose: True
