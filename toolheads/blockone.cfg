# =====================================================================
# NOTE: this macro's "config" dict is a local Jinja variable inside its
# own gcode block - it is NOT exposed to other macros (that would
# require "variable_config: {}" declared in the macro header instead).
# Nothing in the active config currently reads this successfully; the
# real, working toolhead/material data lives in variables.cfg under
# [gcode_macro VARIABLES] -> toolheads -> 'BlockOne'. Treat this file
# as descriptive/reference metadata only, not live config, unless you
# rework it to use variable_config.
# =====================================================================
[gcode_macro blockone_config]
gcode:
    {% set config = {
        "tool_name": "BlockOne",
        "stepper_pin": "PE0",
        "heater_pin": "PE1",
        "stepper_x_current": 0.8,
        "stepper_y_current": 0.8,
        "stepper_z_current": 1.0,
        "extruder_current": 0.7,
        "z_offset": 0.0,
        "velocity_limit": 100,
        "probe_type": "inductive",
        "image_path": ""
    } %}
